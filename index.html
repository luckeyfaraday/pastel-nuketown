<script>/* ===== src/50-actors.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — characters: chunky cartoon bots, animated by hand
   No skeletons, no clips: a few pivots driven by speed / aim / state.
   ===================================================================== */

/* proportions — the hitboxes in 30-physics.js reference HIT, keep in sync */
const CH = {
  legTop: 0.74, torsoTop: 1.40, headC: 1.60, headR: 0.235,
  shoulder: 1.28, armLen: 0.50, hipW: 0.115, legW: 0.155
};

function partMesh(build, withLines) {
  const B = new GeoBuilder();
  build(B);
  const g = new THREE.Group();
  const m = B.mesh(); g.add(m);
  if (withLines) { const l = B.lines(0.5); if (l) g.add(l); }
  return g;
}

function buildCharacter(colors) {
  const body = colors.body, trim = colors.trim;
  const cB = C(body), cT = C(trim), cD = Cx(body, 0.9), skin = C(0xffe0c8), boot = C(0x6b5f80);

  const root = new THREE.Group();          // origin at the feet
  const hips = new THREE.Group();
  root.add(hips);

  // ---- torso (+ a little backpack + collar) ----
  const torso = partMesh(B => {
    B.box([-0.235, CH.legTop - 0.06, -0.145], [0.235, CH.torsoTop, 0.145], cB, { top: Cx(body, 1.05) });
    B.box([-0.245, CH.torsoTop - 0.10, -0.155], [0.245, CH.torsoTop, 0.155], cT);        // collar
    B.box([-0.165, CH.legTop + 0.10, 0.145], [0.165, CH.torsoTop - 0.12, 0.255], cD);    // backpack
    B.box([-0.10, CH.legTop + 0.16, -0.16], [0.10, CH.legTop + 0.30, -0.145], cT);       // chest badge
    B.box([-0.25, CH.legTop - 0.10, -0.15], [0.25, CH.legTop + 0.02, 0.15], cT);         // belt
  }, true);
  hips.add(torso);

  // ---- head: rounded cube + cap + big cartoon eyes ----
  const headPiv = new THREE.Group();
  headPiv.position.set(0, CH.headC, 0);
  const head = partMesh(B => {
    const r = CH.headR;
    B.box([-r, -r, -r], [r, r, r], skin, { top: Cx(0xffe0c8, 1.03) });
    B.box([-r - 0.022, r - 0.03, -r - 0.022], [r + 0.022, r + 0.055, r + 0.022], cT);    // cap
    B.box([-r - 0.02, r - 0.055, -r - 0.115], [r + 0.02, r + 0.012, -r + 0.01], cT);     // brim
    for (const s of [-1, 1]) {                                                            // eyes
      B.box([s * 0.075 - 0.048, -0.015, -r - 0.012], [s * 0.075 + 0.048, 0.075, -r + 0.01], C(0xfffdf8));
      B.box([s * 0.075 - 0.024, 0.005, -r - 0.024], [s * 0.075 + 0.024, 0.052, -r - 0.006], C(0x4a3f5c));
    }
    B.box([-0.055, -0.115, -r - 0.014], [0.055, -0.085, -r + 0.005], C(0xe8a0a8));       // mouth
    B.box([-r - 0.03, -0.06, -0.05], [-r, 0.03, 0.05], skin);                            // ears
    B.box([r, -0.06, -0.05], [r + 0.03, 0.03, 0.05], skin);
  }, true);
  headPiv.add(head);
  hips.add(headPiv);

  // ---- limbs ----
  const mkLeg = () => partMesh(B => {
    B.box([-CH.legW, -CH.legTop + 0.10, -0.10], [CH.legW, 0, 0.10], cD);
    B.box([-CH.legW - 0.012, -CH.legTop, -0.145], [CH.legW + 0.012, -CH.legTop + 0.14, 0.115], boot);
  }, false);
  const mkArm = (isRight) => partMesh(B => {
    B.box([-0.088, -CH.armLen + 0.10, -0.088], [0.088, 0, 0.088], cB);
    B.box([-0.075, -CH.armLen + 0.06, -0.075], [0.075, -CH.armLen + 0.14, 0.075], cT);   // cuff
    B.box([-0.082, -CH.armLen, -0.082], [0.082, -CH.armLen + 0.075, 0.082], skin);       // mitt
  }, false);

  const legL = new THREE.Group(), legR = new THREE.Group();
  legL.position.set(-CH.hipW, CH.legTop, 0); legL.add(mkLeg());
  legR.position.set( CH.hipW, CH.legTop, 0); legR.add(mkLeg());
  hips.add(legL, legR);

  const armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(-0.30, CH.shoulder, 0); armL.add(mkArm(false));
  armR.position.set( 0.30, CH.shoulder, 0); armR.add(mkArm(true));
  hips.add(armL, armR);

  // ---- third-person gun, parented to the right arm ----
  const gun = partMesh(B => {
    B.box([-0.045, -0.045, -0.36], [0.045, 0.045, 0.10], C(0xe9e2f2));
    B.box([-0.030, -0.020, -0.52], [0.030, 0.028, -0.36], C(0xd6cee6));
    B.box([-0.038, -0.16, -0.10], [0.038, -0.035, 0.02], cT);
    B.box([-0.036, 0.045, -0.20], [0.036, 0.070, 0.02], cT);
    B.box([-0.040, -0.02, 0.10], [0.040, 0.055, 0.26], C(0xe9e2f2));
  }, false);
  gun.position.set(0, -CH.armLen + 0.02, -0.10);
  gun.rotation.x = Math.PI / 2;
  armR.add(gun);
  const muzzle = new THREE.Object3D();
  muzzle.position.set(0, 0, -0.54);
  gun.add(muzzle);

  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  return { root, hips, torso, headPiv, legL, legR, armL, armR, gun, muzzle };
}

/* ---- name + health plate that hovers over each bot ---- */
/* =====================================================================
   BLOB SHADOWS
   Real shadow mapping is switched off on software renderers, and without
   any contact shadow the characters read as stickers floating over the
   street. A soft dark ellipse under each actor costs one small alpha quad
   and puts them back on the ground. It also survives on GPU: it lands
   under the real shadow and just reads as ambient occlusion.
   ===================================================================== */
let BLOB_TEX = null;
function blobTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0.00, 'rgba(74,63,92,.55)');
  rg.addColorStop(0.55, 'rgba(74,63,92,.30)');
  rg.addColorStop(1.00, 'rgba(74,63,92,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
function makeBlobShadow() {
  if (!BLOB_TEX) BLOB_TEX = blobTexture();
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({ map: BLOB_TEX, transparent: true, depthWrite: false,
                                  fog: true, opacity: 1 })
  );
  m.rotation.x = -Math.PI / 2;
  m.renderOrder = -5;                 // under everything else that blends
  scene.add(m);
  return m;
}
/* Drop it onto whatever surface is under the actor (street, porch, upper
   floor), and fade + spread it the higher they are — a jumping character
   should cast a big faint blob, not a hard one stuck to their boots. */
function updateBlobShadow(blob, a) {
  if (!blob) return;
  if (!a.alive && a.deathT > 1.6) { blob.visible = false; return; }
  const hit = raycastMap(a.pos.x, a.pos.y + 0.4, a.pos.z, 0, -1, 0, 9);
  const gy = hit ? (a.pos.y + 0.4 - hit.dist) : 0;
  const air = clamp(a.pos.y - gy, 0, 4);
  blob.visible = air < 3.6;
  if (!blob.visible) return;
  blob.position.set(a.pos.x, gy + 0.035, a.pos.z);
  const s = 1 + air * 0.30;
  blob.scale.set(s, s, 1);
  blob.material.opacity = (1 - air / 4.2) * (a.alive ? 1 : Math.max(0, 1 - a.deathT / 1.6));
}

/* =====================================================================
   SPAWN BUBBLE
   The gameplay job is "don't die in the first second". The look is a soap
   bubble: additive, back-faces only so it reads as a shell you see THROUGH
   rather than a solid ball, with a fresnel rim so the silhouette glows and
   the middle stays clear. Iridescence comes from shifting the rim hue with
   view angle — cheap, and it is the most overtly magical thing on screen.
   ===================================================================== */
const BUBBLE_VS = `
varying vec3 vN; varying vec3 vV;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vN = normalize(mat3(modelMatrix) * normal);
  vV = normalize(cameraPosition - wp.xyz);
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const BUBBLE_FS = `
uniform float uT; uniform float uFade;
varying vec3 vN; varying vec3 vV;
void main(){
  float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));   // fresnel rim
  float rim = pow(f, 2.2);
  // iridescent band that drifts around the shell over time
  float band = sin(f * 11.0 - uT * 2.4);
  vec3 tint = vec3(0.55 + 0.45 * sin(band + 0.0),
                   0.55 + 0.45 * sin(band + 2.1),
                   0.55 + 0.45 * sin(band + 4.2));
  vec3 col = mix(vec3(0.75, 0.90, 1.0), tint, 0.55);
  float a = (rim * 0.85 + 0.06) * uFade;
  gl_FragColor = vec4(col * a, a);
}`;
function makeBubble() {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.95, 20, 14),
    new THREE.ShaderMaterial({
      vertexShader: BUBBLE_VS, fragmentShader: BUBBLE_FS,
      uniforms: { uT: { value: 0 }, uFade: { value: 1 } },
      transparent: true, depthWrite: false, side: THREE.BackSide,
      blending: THREE.AdditiveBlending, fog: false
    })
  );
  m.visible = false;
  m.renderOrder = 6;
  scene.add(m);
  return m;
}
function updateBubble(bub, a, t) {
  if (!bub) return;
  const on = a.alive && a.shield > 0;
  bub.visible = on;
  if (!on) return;
  bub.position.set(a.pos.x, a.pos.y + 0.95, a.pos.z);
  // a slow wobble so it feels like surface tension, not a hard sphere
  const w = 1 + Math.sin(t * 3.1 + a.id) * 0.035;
  bub.scale.set(w, 1 / w, w);
  bub.material.uniforms.uT.value = t;
  // pop out over the last third rather than vanishing on a frame boundary
  bub.material.uniforms.uFade.value = clamp(a.shield / (CFG.spawnShield * 0.45), 0, 1);
}
/* a ripple where a shot was absorbed */
function fxShieldHit(a, hx, hy, hz) {
  if (hx === undefined) return;
  fxRing(hx, hy, hz, hx - a.pos.x, hy - (a.pos.y + 0.95), hz - a.pos.z, C(0xbfe8ff), 0.75);
  SFX.tone(880, 620, 0.10, 0.10, 'sine', hx, hy, hz);
}

function makePlate() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 72;
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, depthTest: true, fog: false
  }));
  sp.scale.set(1.5, 0.42, 1);
  sp.center.set(0.5, 0);
  return { sprite: sp, canvas: cv, tex, last: -1 };
}
function drawPlate(plate, name, hp, maxHp, color) {
  const g = plate.canvas.getContext('2d');
  g.clearRect(0, 0, 256, 72);
  g.font = '800 30px "Baloo 2", Trebuchet MS, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 7; g.strokeStyle = '#4a3f5c'; g.lineJoin = 'round';
  g.strokeText(name, 128, 22); g.fillStyle = '#fffdf8'; g.fillText(name, 128, 22);
  const w = 190, x = (256 - w) / 2, y = 46, h = 15;
  g.fillStyle = '#4a3f5c';
  g.beginPath(); g.roundRect ? g.roundRect(x - 4, y - 4, w + 8, h + 8, 9) : g.rect(x - 4, y - 4, w + 8, h + 8); g.fill();
  g.fillStyle = '#efe3f2';
  g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, 6) : g.rect(x, y, w, h); g.fill();
  const f = clamp(hp / maxHp, 0, 1);
  g.fillStyle = f > 0.35 ? '#7fe6b4' : '#ff8fa3';
  if (f > 0.01) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w * f, h, 6) : g.rect(x, y, w * f, h); g.fill(); }
  plate.tex.needsUpdate = true;
}

/* =====================================================================
   ANIMATION — everything is driven from a handful of scalars
   ===================================================================== */
function animateCharacter(ch, a, dt, t) {
  const spd = Math.hypot(a.vel.x, a.vel.z);
  const moving = spd > 0.35;

  // --- death: topple sideways, sink, fade out ---
  if (!a.alive) {
    a.deathT += dt;
    const u = clamp(a.deathT / 0.55, 0, 1);
    ch.root.rotation.z = a.deathDir * smoothstep(u) * 1.62;
    ch.root.position.y = a.pos.y - smoothstep(clamp((a.deathT - 0.5) / 1.4, 0, 1)) * 1.1;
    const sc = 1 - smoothstep(clamp((a.deathT - 1.1) / 0.7, 0, 1));
    ch.root.scale.setScalar(Math.max(0.001, sc));
    ch.legL.rotation.x = -0.5; ch.legR.rotation.x = 0.35;
    ch.armL.rotation.z = 0.9; ch.armR.rotation.z = -1.1;
    ch.armL.rotation.x = -0.6; ch.armR.rotation.x = -0.4;
    return;
  }

  // --- spawn pop: squash-stretch overshoot ---
  ch.root.rotation.z = 0;
  ch.root.position.y = a.pos.y;
  if (a.spawnT > 0) {
    a.spawnT = Math.max(0, a.spawnT - dt);
    const u = 1 - a.spawnT / 0.45;
    const s = u < 1 ? 1 + Math.sin(u * Math.PI) * 0.28 * (1 - u) : 1;
    ch.root.scale.set(s * (2 - s), Math.pow(smoothstep(u), 0.6) * s, s * (2 - s));
  } else ch.root.scale.set(1, 1, 1);

  // --- facing: body turns toward travel, torso/head lead toward aim ---
  /* +PI: the rig models face -Z locally, engine forward is +Z (see yawFlip). */
  const moveYaw = moving ? Math.atan2(a.vel.x, a.vel.z) + Math.PI : a.bodyYaw;
  a.bodyYaw = approachAngle(a.bodyYaw, moving ? moveYaw : (a.aimYaw + Math.PI), dt * (moving ? 9 : 4.5));
  ch.root.rotation.y = a.bodyYaw;

  const lead = angDelta(a.bodyYaw, a.aimYaw + Math.PI);
  ch.hips.rotation.y = damp(ch.hips.rotation.y, clamp(lead, -1.1, 1.1) * 0.55, 12, dt);
  ch.headPiv.rotation.y = damp(ch.headPiv.rotation.y, clamp(lead, -1.3, 1.3) * 0.45, 14, dt);
  ch.headPiv.rotation.x = damp(ch.headPiv.rotation.x, clamp(-a.aimPitch, -0.6, 0.6), 12, dt);

  // --- gait ---
  const stride = clamp(spd / 6.2, 0, 1.35);
  a.gait += dt * (2.0 + spd * 1.85);
  const sw = Math.sin(a.gait) * stride;
  const sw2 = Math.cos(a.gait * 2) * stride;

  if (a.onGround) {
    ch.legL.rotation.x = damp(ch.legL.rotation.x,  sw * 0.95, 20, dt);
    ch.legR.rotation.x = damp(ch.legR.rotation.x, -sw * 0.95, 20, dt);
    ch.hips.position.y = damp(ch.hips.position.y, Math.abs(sw2) * 0.035 - stride * 0.02, 16, dt);
  } else {
    ch.legL.rotation.x = damp(ch.legL.rotation.x, -0.45, 9, dt);
    ch.legR.rotation.x = damp(ch.legR.rotation.x,  0.30, 9, dt);
    ch.hips.position.y = damp(ch.hips.position.y, 0, 9, dt);
  }

  // --- arms: raised into a firing pose when engaged, swinging otherwise ---
  const aimUp = a.aiming ? 1 : 0;
  a.aimBlend = damp(a.aimBlend, aimUp, 10, dt);
  const rest = -sw * 0.62, restL = sw * 0.62;
  const fireX = -1.42 + clamp(-a.aimPitch, -0.7, 0.7);
  ch.armR.rotation.x = damp(ch.armR.rotation.x, lerp(rest, fireX, a.aimBlend) - a.recoil * 0.55, 16, dt);
  ch.armL.rotation.x = damp(ch.armL.rotation.x, lerp(restL, fireX + 0.12, a.aimBlend) - a.recoil * 0.35, 16, dt);
  ch.armR.rotation.z = damp(ch.armR.rotation.z, lerp(0.06, -0.30, a.aimBlend), 14, dt);
  ch.armL.rotation.z = damp(ch.armL.rotation.z, lerp(-0.06, 0.46, a.aimBlend), 14, dt);
  ch.armL.rotation.y = damp(ch.armL.rotation.y, lerp(0, -0.55, a.aimBlend), 14, dt);

  // recoil + flinch decay
  a.recoil = Math.max(0, a.recoil - dt * 6.5);
  a.flinch = Math.max(0, a.flinch - dt * 5);
  ch.hips.rotation.x = damp(ch.hips.rotation.x, stride * 0.10 + a.recoil * 0.16 + a.flinch * 0.25, 14, dt);
  ch.hips.rotation.z = damp(ch.hips.rotation.z, -a.flinch * 0.3, 12, dt);
  // idle breathe
  if (!moving) ch.hips.position.y += Math.sin(t * 1.9 + a.id) * 0.006;
}
</script>
<script>/* ===== src/60-fx.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — FX (confetti, sparkles, tracers, floaters) + audio
   ===================================================================== */

const FX = {
  conf: null, spark: null, tracers: [], tracerI: 0, rings: [], shake: 0, shakeV: 0
};

/* Confetti shape. Squares read as "default particle demo"; a four-point
   candy star belongs to the same world as BUBBLEGUN and LOLLIPOP. */
function squareTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const g = cv.getContext('2d');
  g.translate(16, 16);
  g.fillStyle = '#fff';
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU - Math.PI / 2;
    const r = i % 2 ? 5.5 : 15;
    g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  g.closePath(); g.fill();
  g.beginPath(); g.arc(0, 0, 4.5, 0, TAU); g.fill();
  return new THREE.CanvasTexture(cv);
}
function softTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  rg.addColorStop(0, 'rgba(255,255,255,1)');
  rg.addColorStop(0.4, 'rgba(255,255,255,.55)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cv);
}

/* 0 right at the lens, 1 beyond ~2.2m. Used by every point sprite. */
function nearFade(x, y, z) {
  const dx = x - camera.position.x, dy = y - camera.position.y, dz = z - camera.position.z;
  const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  return smoothstep((d - 0.7) / 1.5);
}

function ParticleSys(max, tex, additive, size) {
  const pos = new Float32Array(max * 3);
  const col = new Float32Array(max * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setDrawRange(0, 0);
  const m = new THREE.PointsMaterial({
    size: size, map: tex, vertexColors: true, transparent: true,
    depthWrite: false, sizeAttenuation: true, fog: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    opacity: 1, alphaTest: additive ? 0 : 0.12
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return {
    pts, max, n: 0, additive: !!additive,
    vx: new Float32Array(max), vy: new Float32Array(max), vz: new Float32Array(max),
    life: new Float32Array(max), maxLife: new Float32Array(max),
    r: new Float32Array(max), g: new Float32Array(max), b: new Float32Array(max),
    grav: additive ? 0.6 : 15
  };
}
function psEmit(P, x, y, z, vx, vy, vz, life, color) {
  let i = P.n;
  if (i >= P.max) {                       // recycle the oldest slot
    i = 0; let best = 1e9;
    for (let k = 0; k < P.max; k++) if (P.life[k] < best) { best = P.life[k]; i = k; }
  } else P.n++;
  const a = P.pts.geometry.attributes;
  a.position.array[i * 3] = x; a.position.array[i * 3 + 1] = y; a.position.array[i * 3 + 2] = z;
  P.vx[i] = vx; P.vy[i] = vy; P.vz[i] = vz;
  P.life[i] = life; P.maxLife[i] = life;
  P.r[i] = color.r; P.g[i] = color.g; P.b[i] = color.b;
}
function psUpdate(P, dt) {
  const a = P.pts.geometry.attributes, pos = a.position.array, col = a.color.array;
  let live = 0;
  for (let i = 0; i < P.n; i++) {
    if (P.life[i] <= 0) { col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = 0; pos[i * 3 + 1] = -999; continue; }
    P.life[i] -= dt;
    P.vy[i] -= P.grav * dt;
    P.vx[i] *= Math.exp(-2.2 * dt); P.vz[i] *= Math.exp(-2.2 * dt);
    pos[i * 3] += P.vx[i] * dt; pos[i * 3 + 1] += P.vy[i] * dt; pos[i * 3 + 2] += P.vz[i] * dt;
    if (pos[i * 3 + 1] < 0.03) { pos[i * 3 + 1] = 0.03; P.vy[i] *= -0.32; P.vx[i] *= 0.6; P.vz[i] *= 0.6; }
    const f = clamp(P.life[i] / P.maxLife[i], 0, 1);
    let e = f > 0.7 ? 1 : f / 0.7;
    /* Near-camera fade, ADDITIVE ONLY. sizeAttenuation makes a 0.3m sprite
       cover a third of the screen at arm's length and additive ones then
       bleach the frame, so dim them toward black as they near the lens —
       black is invisible under additive blending.
       Never do this to a normal-blended system: there black is opaque, and
       the confetti turns into a swarm of dark squares. It is small and
       solid anyway, so up close it just reads as confetti flying past. */
    if (P.additive) e *= nearFade(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
    col[i * 3] = P.r[i] * e; col[i * 3 + 1] = P.g[i] * e; col[i * 3 + 2] = P.b[i] * e;
    live = i + 1;
  }
  a.position.needsUpdate = true; a.color.needsUpdate = true;
  P.pts.geometry.setDrawRange(0, P.n);
}

function initFX() {
  FX.conf  = ParticleSys(SOFTWARE_GPU ? 340 : 900, squareTex(), false, 0.16);
  FX.spark = ParticleSys(SOFTWARE_GPU ? 200 : 520, softTex(),  true,  0.30);

  // tracer pool: thin additive boxes stretched along the shot
  const tg = new THREE.BoxGeometry(0.035, 0.035, 1);
  tg.translate(0, 0, -0.5);
  for (let i = 0; i < 34; i++) {
    const m = new THREE.Mesh(tg, new THREE.MeshBasicMaterial({
      color: C(0xfff0c0), transparent: true, opacity: 0, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false
    }));
    m.visible = false; m.frustumCulled = false;
    scene.add(m);
    FX.tracers.push({ mesh: m, t: 0 });
  }
  // impact shock rings
  const rg = new THREE.RingGeometry(0.22, 0.34, 18);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
      color: C(0xffffff), transparent: true, opacity: 0, depthWrite: false,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false
    }));
    m.visible = false; scene.add(m);
    FX.rings.push({ mesh: m, t: 0, dur: 0.3 });
  }
}

const CONFETTI = [0xffb7c5, 0xa8dcf0, 0xb8f2d8, 0xd4c5f9, 0xffefa8, 0xffd3b6, 0xffffff];

function fxTracer(x0, y0, z0, x1, y1, z1, color) {
  const t = FX.tracers[FX.tracerI++ % FX.tracers.length];
  const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
  const len = Math.hypot(dx, dy, dz);
  if (len < 0.05) return;
  t.mesh.position.set(x1, y1, z1);
  t.mesh.lookAt(x0, y0, z0);
  t.mesh.scale.set(1, 1, len);
  t.mesh.material.color.copy(color || C(0xfff0c0));
  t.mesh.material.opacity = 0.95;
  t.mesh.visible = true;
  t.t = 0.085;
}
function fxRing(x, y, z, nx, ny, nz, color, scale) {
  for (const r of FX.rings) {
    if (r.t > 0) continue;
    r.mesh.position.set(x + nx * 0.02, y + ny * 0.02, z + nz * 0.02);
    r.mesh.lookAt(x + nx, y + ny, z + nz);
    r.mesh.scale.setScalar(scale || 1);
    r.mesh.material.color.copy(color || C(0xfff8f0));
    r.mesh.material.opacity = 0.9;
    r.mesh.visible = true; r.t = r.dur = 0.28;
    r.s0 = scale || 1;
    return;
  }
}
function fxImpact(x, y, z, nx, ny, nz, kind) {
  const n = kind === 'actor' ? 14 : 8;
  for (let i = 0; i < n; i++) {
    const sx = nx + rand(-0.9, 0.9), sy = ny + rand(-0.2, 1.3), sz = nz + rand(-0.9, 0.9);
    const s = rand(1.6, 5.2);
    psEmit(FX.conf, x, y, z, sx * s, sy * s, sz * s, rand(0.5, 1.2),
           C(kind === 'actor' ? pick(CONFETTI) : 0xf0e6f2));
  }
  for (let i = 0; i < 5; i++)
    psEmit(FX.spark, x, y, z, nx * rand(1, 4) + rand(-1.5, 1.5), ny * rand(1, 3) + rand(0, 2), nz * rand(1, 4) + rand(-1.5, 1.5),
           rand(0.16, 0.36), C(0xfff2cc));
  fxRing(x, y, z, nx, ny, nz, C(kind === 'actor' ? 0xffd0e0 : 0xffffff), kind === 'actor' ? 1.1 : 0.7);
}
function fxKillBurst(x, y, z, color) {
  for (let i = 0; i < 46; i++) {
    const a = rand(0, TAU), p = rand(-0.6, 1.25), s = rand(2.5, 8);
    psEmit(FX.conf, x, y + rand(0.4, 1.5), z,
           Math.cos(a) * Math.cos(p) * s, Math.sin(p) * s + 3.5, Math.sin(a) * Math.cos(p) * s,
           rand(1.0, 2.0), C(pick(CONFETTI)));
  }
  for (let i = 0; i < 20; i++) {
    const a = rand(0, TAU), s = rand(1.5, 5);
    psEmit(FX.spark, x, y + rand(0.6, 1.4), z, Math.cos(a) * s, rand(1, 5), Math.sin(a) * s,
           rand(0.35, 0.8), C(0xffffff));
  }
  fxRing(x, y + 0.9, z, 0, 1, 0, color || C(0xffe0ec), 2.2);
}
function fxSpawnPuff(x, y, z, color) {
  for (let i = 0; i < 22; i++) {
    const a = rand(0, TAU), s = rand(1.2, 3.4);
    psEmit(FX.spark, x + Math.cos(a) * 0.4, y + rand(0.1, 1.7), z + Math.sin(a) * 0.4,
           Math.cos(a) * s, rand(0.5, 2.5), Math.sin(a) * s, rand(0.3, 0.7), color || C(0xffffff));
  }
}
function fxShake(amount) { FX.shakeV += amount; }

function updateFX(dt) {
  psUpdate(FX.conf, dt);
  psUpdate(FX.spark, dt);
  for (const t of FX.tracers) {
    if (t.t <= 0) continue;
    t.t -= dt;
    t.mesh.material.opacity = clamp(t.t / 0.085, 0, 1) * 0.95;
    if (t.t <= 0) t.mesh.visible = false;
  }
  for (const r of FX.rings) {
    if (r.t <= 0) continue;
    r.t -= dt;
    const u = 1 - r.t / r.dur;
    r.mesh.scale.setScalar((r.s0 || 1) * (1 + u * 2.6));
    r.mesh.material.opacity = (1 - u) * 0.85;
    if (r.t <= 0) r.mesh.visible = false;
  }
  FX.shakeV *= Math.exp(-9 * dt);
  FX.shake = FX.shakeV;
}

/* =====================================================================
   DOM FLOATERS (damage numbers, pickups)
   ===================================================================== */
const floaters = [];
const floatLayer = document.getElementById('floaters');
const _pv = new THREE.Vector3();
function addFloater(text, x, y, z, color, big) {
  if (floaters.length > 26) { const f = floaters.shift(); f.el.remove(); }
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  if (color) el.style.color = color;
  if (big) el.style.fontSize = '30px';
  floatLayer.appendChild(el);
  floaters.push({ el, x, y, z, t: 0, dur: big ? 1.5 : 1.0, rise: big ? 1.5 : 1.0, dx: rand(-16, 16) });
}
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt;
    if (f.t >= f.dur) { f.el.remove(); floaters.splice(i, 1); continue; }
    const u = f.t / f.dur;
    _pv.set(f.x, f.y + u * f.rise, f.z).project(camera);
    if (_pv.z > 1) { f.el.style.opacity = '0'; continue; }
    const sx = (_pv.x * 0.5 + 0.5) * innerWidth + f.dx * u;
    const sy = (-_pv.y * 0.5 + 0.5) * innerHeight;
    f.el.style.left = sx + 'px';
    f.el.style.top = sy + 'px';
    f.el.style.opacity = String(1 - smoothstep(clamp((u - 0.55) / 0.45, 0, 1)));
    f.el.style.transform = 'translate(-50%,-50%) scale(' + (1 + Math.sin(Math.min(u * 4, Math.PI * 0.5)) * 0.28) + ')';
  }
}

/* =====================================================================
   AUDIO — everything synthesised, no assets
   ===================================================================== */
const SFX = {
  ctx: null, master: null, ok: false,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ctx.destination);
      this.noiseBuf = this.makeNoise();
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  makeNoise() {
    const n = this.ctx.sampleRate * 0.5;
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  /* pan/attenuate by distance from the listener */
  place(node, x, y, z) {
    if (!x && x !== 0) { node.connect(this.master); return; }
    const dx = x - camera.position.x, dy = y - camera.position.y, dz = z - camera.position.z;
    const d = Math.hypot(dx, dy, dz);
    const g = this.ctx.createGain();
    g.gain.value = clamp(1 - d / 62, 0.02, 1) * clamp(1 / (1 + d * 0.09), 0.05, 1);
    const p = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    if (p) {
      const f = new THREE.Vector3(); camera.getWorldDirection(f);
      const rx = f.z, rz = -f.x;                  // camera-right on the XZ plane
      p.pan.value = clamp((dx * rx + dz * rz) / Math.max(d, 0.5), -1, 1) * 0.85;
      node.connect(p); p.connect(g);
    } else node.connect(g);
    g.connect(this.master);
  },
  noise(dur, freq, q, gain, x, y, z, type) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g);
    this.place(g, x, y, z);
    s.start(t); s.stop(t + dur + 0.02);
  },
  tone(f0, f1, dur, gain, type, x, y, z, delay) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    this.place(g, x, y, z);
    o.start(t); o.stop(t + dur + 0.02);
  },
  shoot(id, x, y, z) {
    if (id === 'shotgun') { this.noise(0.30, 780, 0.7, 0.55, x, y, z); this.tone(220, 48, 0.26, 0.30, 'square', x, y, z); }
    else if (id === 'rifle') { this.noise(0.20, 1500, 1.5, 0.36, x, y, z); this.tone(700, 130, 0.16, 0.20, 'sawtooth', x, y, z); }
    else { this.noise(0.09, 2100, 2.2, 0.26, x, y, z); this.tone(880, 300, 0.07, 0.15, 'square', x, y, z); }
  },
  hit(head) { this.tone(head ? 1500 : 900, head ? 2300 : 1250, 0.075, head ? 0.30 : 0.20, 'sine'); },
  hurt() { this.noise(0.20, 320, 0.8, 0.36, null); this.tone(180, 70, 0.20, 0.22, 'triangle'); },
  kill() { [0, 0.07, 0.14].forEach((d, i) => this.tone([660, 880, 1320][i], [660, 880, 1320][i], 0.16, 0.19, 'sine', null, 0, 0, d)); },
  die() { this.tone(420, 90, 0.6, 0.28, 'triangle'); this.noise(0.5, 260, 0.6, 0.28, null); },
  reload(x, y, z) { this.noise(0.05, 1500, 3, 0.24, x, y, z, 'bandpass'); },
  reloadDone(x, y, z) { this.noise(0.07, 900, 3, 0.30, x, y, z, 'bandpass'); this.tone(340, 200, 0.07, 0.14, 'square', x, y, z); },
  step(x, y, z) { this.noise(0.055, 200 + Math.random() * 90, 1.1, 0.13, x, y, z, 'lowpass'); },
  spawn() { this.tone(300, 900, 0.20, 0.20, 'sine'); this.tone(600, 1500, 0.22, 0.10, 'sine', null, 0, 0, 0.05); },
  swap() { this.noise(0.05, 1200, 2.5, 0.16, null); },
  empty() { this.noise(0.035, 2600, 4, 0.14, null); },
  ui() { this.tone(520, 900, 0.09, 0.18, 'sine'); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.4, 0.2, 'sine', null, 0, 0, i * 0.12)); }
};
</script>
<script>/* ===== src/70-game.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — game: actors, player control, combat, match flow
   ===================================================================== */

const CFG = {
  bots: 8,
  killsToWin: 25,
  respawn: 3.0,
  spawnShield: 1.6,
  playerSpeed: 5.9,
  sprintMul: 1.42,
  botSpeed: 5.3,
  accelGround: 13,
  accelAir: 2.6
};

const G = {
  actors: [], player: null, nav: null, aiOK: false, aiErr: null,
  time: 0, started: false, over: false, paused: false,
  winner: null, frozen: false, hintT: 0,
  fixedAcc: 0, tick: 0
};

/* =====================================================================
   ACTOR
   ===================================================================== */
let _nextId = 1;
function makeActor(opts) {
  const a = {
    id: _nextId++,
    name: opts.name,
    isPlayer: !!opts.isPlayer,
    colors: opts.colors,
    skill: opts.skill || 'normal',
    pos: { x: 0, y: 0, z: 0 }, vel: { x: 0, y: 0, z: 0 },
    yaw: 0, pitch: 0, aimYaw: 0, aimPitch: 0,
    bodyYaw: 0, gait: 0, recoil: 0, flinch: 0, aimBlend: 0, aiming: false,
    health: 100, maxHealth: 100, alive: true,
    deathT: 0, deathDir: 1, spawnT: 0, respawnT: 0,
    weapon: opts.weapon || 'smg', ammo: 0, reserve: 0, reloadT: 0, fireCd: 0,
    kills: 0, deaths: 0, streak: 0, bestStreak: 0,
    onGround: false, stepPhase: 0,
    lastHitBy: null, lastHitT: -99, shield: 0,
    brain: null, char: null, plate: null, blob: null, bubble: null, state: 'idle'
  };
  const w = WBY[a.weapon];
  a.ammo = w.mag; a.reserve = w.reserve;
  return a;
}

function attachCharacter(a) {
  a.char = buildCharacter(a.colors);
  scene.add(a.char.root);
  a.blob = makeBlobShadow();
  a.bubble = makeBubble();
  a.plate = makePlate();
  a.plate.sprite.position.set(0, CH.headC + 0.55, 0);
  a.char.root.add(a.plate.sprite);
  drawPlate(a.plate, a.name, a.health, a.maxHealth, a.colors.body);
}

function respawnActor(a, instant) {
  const sp = pickSpawn(G.actors, a.id);
  a.pos.x = sp.x; a.pos.y = sp.y; a.pos.z = sp.z;
  a.vel.x = a.vel.y = a.vel.z = 0;
  const spawnYaw = yawFlip(sp.yaw);          // mapspec yaws are contract-convention
  a.yaw = spawnYaw; a.pitch = 0;
  a.aimYaw = spawnYaw; a.aimPitch = 0; a.bodyYaw = spawnYaw + Math.PI;
  a.health = a.maxHealth; a.alive = true;
  a.deathT = 0; a.spawnT = 0.45; a.respawnT = 0;
  a.shield = CFG.spawnShield;
  a.streak = 0;
  const w = WBY[a.weapon];
  a.ammo = w.mag; a.reserve = w.reserve; a.reloadT = 0; a.fireCd = 0;
  if (a.brain && G.aiOK && AI.resetBrain) { try { AI.resetBrain(a.brain); } catch (e) {} }
  if (a.char) { a.char.root.visible = true; a.char.root.scale.setScalar(0.001); }
  if (a.plate) drawPlate(a.plate, a.name, a.health, a.maxHealth, a.colors.body);
  fxSpawnPuff(a.pos.x, a.pos.y, a.pos.z, C(a.colors.body));
  if (a.isPlayer) { SFX.spawn(); setDamageDirsCleared(); }
}

/* =====================================================================
   SETUP
   ===================================================================== */
function setupMatch() {
  for (const a of G.actors) {
    if (a.char) scene.remove(a.char.root);
    if (a.blob) scene.remove(a.blob);
    if (a.bubble) scene.remove(a.bubble);
  }
  G.actors.length = 0;
  _nextId = 1;
  G.time = 0; G.over = false; G.winner = null;

  const player = makeActor({ name: 'YOU', isPlayer: true, colors: PLAYER_COLOR, weapon: 'smg' });
  player.blob = makeBlobShadow();     // only ever seen in the death cam
  player.bubble = makeBubble();       // ditto, plus it shows in the death cam
  G.player = player;
  G.actors.push(player);

  const skills = ['easy', 'normal', 'normal', 'hard', 'normal', 'hard', 'easy', 'normal'];
  const guns   = ['smg', 'shotgun', 'smg', 'rifle', 'smg', 'shotgun', 'rifle', 'smg'];
  for (let i = 0; i < CFG.bots; i++) {
    const col = BOT_COLORS[i % BOT_COLORS.length];
    const b = makeActor({ name: col.name.toUpperCase(), colors: col, weapon: guns[i % guns.length], skill: skills[i % skills.length] });
    if (G.aiOK) {
      try { b.brain = AI.createBrain({ id: b.id, seed: 1000 + i * 77, skill: b.skill }); }
      catch (e) { b.brain = null; G.aiErr = String(e); }
    }
    attachCharacter(b);
    G.actors.push(b);
  }
  for (const a of G.actors) respawnActor(a, true);
  // stagger the initial spawns so nobody starts inside someone else
  updateHUD();
  refreshBoard();
}

function initAI() {
  try {
    if (!AI || typeof AI.buildNav !== 'function') throw new Error('NUKETOWN_AI missing');
    G.nav = AI.buildNav(MAP);
    G.aiOK = true;
  } catch (e) {
    G.aiOK = false; G.aiErr = String(e && e.message || e);
    console.warn('[nuketown] AI unavailable, using fallback wander brains:', G.aiErr);
  }
}

/* Minimal stand-in so a broken AI module degrades to "bots still move and
   shoot" instead of a lobby full of statues. */
function fallbackThink(a, dt) {
  a._fbT = (a._fbT || 0) - dt;
  if (a._fbT <= 0) { a._fbT = rand(1.2, 3.0); a._fbA = rand(0, TAU); }
  let tgt = null, bd = 1e9;
  for (const o of G.actors) {
    if (o === a || !o.alive) continue;
    const d = Math.hypot(o.pos.x - a.pos.x, o.pos.z - a.pos.z);
    if (d < bd && canSee(a.pos.x, a.pos.y + ACT.eye, a.pos.z, o.pos.x, o.pos.y + HIT.headY, o.pos.z)) { bd = d; tgt = o; }
  }
  /* NB: like bots.js, this emits CONTRACT yaw — stepBot flips it back. */
  const out = { moveX: Math.cos(a._fbA), moveZ: Math.sin(a._fbA), jump: false,
                aimYaw: yawFlip(a.aimYaw), aimPitch: 0, fire: false, reload: a.ammo <= 0, targetId: null, state: 'wander' };
  if (tgt) {
    const want = Math.atan2(tgt.pos.z - a.pos.z, tgt.pos.x - a.pos.x);
    out.aimYaw = approachAngle(yawFlip(a.aimYaw), want, dt * 3.4);
    out.aimPitch = Math.atan2((tgt.pos.y + HIT.headY) - (a.pos.y + ACT.eye), bd);
    out.fire = Math.abs(angDelta(out.aimYaw, want)) < 0.09;
    out.targetId = tgt.id; out.state = 'engage';
    out.moveX = Math.cos(a._fbA) * 0.5; out.moveZ = Math.sin(a._fbA) * 0.5;
  }
  return out;
}

/* =====================================================================
   COMBAT
   ===================================================================== */
function actorEye(a) { return a.pos.y + (a.isPlayer ? ACT.eye : HIT.headY); }

function tryReload(a) {
  if (a.reloadT > 0) return;
  const w = WBY[a.weapon];
  if (a.ammo >= w.mag || a.reserve <= 0) return;
  a.reloadT = w.reload;
  if (a.isPlayer) { vmStartReload(w.reload); SFX.reload(); }
  else SFX.reload(a.pos.x, a.pos.y + 1.2, a.pos.z);
}
function finishReload(a) {
  const w = WBY[a.weapon];
  const need = w.mag - a.ammo;
  const give = Math.min(need, a.reserve);
  a.ammo += give; a.reserve -= give;
  if (a.isPlayer) SFX.reloadDone(); else SFX.reloadDone(a.pos.x, a.pos.y + 1.2, a.pos.z);
}

function fireWeapon(a) {
  const w = WBY[a.weapon];
  if (a.fireCd > 0 || a.reloadT > 0 || !a.alive) return false;
  if (a.ammo <= 0) {
    if (a.isPlayer && a.fireCd <= 0) { SFX.empty(); a.fireCd = 0.25; }
    tryReload(a);
    return false;
  }
  a.ammo--;
  a.shield = 0;                        // shooting drops your own bubble
  a.fireCd = 60 / w.rpm;
  a.recoil = 1;
  a.aiming = true;

  const ex = a.pos.x, ey = actorEye(a), ez = a.pos.z;
  const moving = Math.hypot(a.vel.x, a.vel.z) > 1.6;
  const spread = moving ? w.spreadMove : w.spread;

  // muzzle origin for tracers: bots use their gun, the player uses the viewmodel
  let mx = ex, my = ey, mz = ez;
  if (!a.isPlayer && a.char) {
    a.char.muzzle.updateWorldMatrix(true, false);
    const p = new THREE.Vector3().setFromMatrixPosition(a.char.muzzle.matrixWorld);
    mx = p.x; my = p.y; mz = p.z;
  }

  for (let p = 0; p < w.pellets; p++) {
    const yaw = a.aimYaw + rand(-spread, spread) * (p ? 1.6 : 0.35);
    const pit = a.aimPitch + rand(-spread, spread) * (p ? 1.6 : 0.35);
    const cp = Math.cos(pit);
    const dx = Math.sin(yaw) * cp, dy = Math.sin(pit), dz = Math.cos(yaw) * cp;
    const hit = hitscan(ex, ey, ez, dx, dy, dz, w.range, G.actors, a.id);
    const endX = hit ? hit.px : ex + dx * w.range;
    const endY = hit ? hit.py : ey + dy * w.range;
    const endZ = hit ? hit.pz : ez + dz * w.range;

    if (p === 0 || w.pellets <= 3 || p % 3 === 0)
      fxTracer(mx, my, mz, endX, endY, endZ, C(a.isPlayer ? (w.tracer || 0xfff0c0) : a.colors.trim));

    if (!hit) continue;
    if (hit.kind === 'actor') {
      const dmg = w.dmg * (hit.head ? w.headMul : 1);
      applyDamage(hit.actor, dmg, a, hit.head, endX, endY, endZ);
      fxImpact(endX, endY, endZ, hit.nx, hit.ny, hit.nz, 'actor');
    } else if (hit.kind === 'mannequin') {
      hit.obj.userData.spin += rand(3, 7) * (rng() < 0.5 ? -1 : 1);
      hit.obj.userData.lean = Math.min(1.2, hit.obj.userData.lean + 0.4);
      fxImpact(endX, endY, endZ, hit.nx, hit.ny, hit.nz, 'map');
      SFX.tone(520, 300, 0.12, 0.14, 'triangle', endX, endY, endZ);
    } else {
      fxImpact(endX, endY, endZ, hit.nx, hit.ny, hit.nz, 'map');
    }
  }

  if (a.isPlayer) {
    vmFire(w);
    SFX.shoot(w.id);
    fxShake(w.id === 'shotgun' ? 0.34 : (w.id === 'rifle' ? 0.24 : 0.09));
    // view kick
    G.player.pitch = clamp(G.player.pitch + w.kickRot * rand(0.7, 1.15), -1.45, 1.45);
    G.player.yaw += rand(-1, 1) * w.kickRot * 0.35;
    setCrosshairPunch(w.id === 'shotgun' ? 14 : 7);
  } else {
    SFX.shoot(w.id, a.pos.x, a.pos.y + 1.3, a.pos.z);
  }
  return true;
}

function applyDamage(target, dmg, from, head, hx, hy, hz) {
  if (!target.alive) return;
  /* Spawn shield. Eight bots on a map this small means you can be dead
     within a second of appearing — playtesting gave three deaths in ~14s.
     A short bubble makes respawns survivable; it pops the moment you shoot,
     so it can't be camped behind. */
  if (target.shield > 0) {
    if (from) fxShieldHit(target, hx, hy, hz);
    return;
  }
  target.health -= dmg;
  target.flinch = 1;
  target.lastHitBy = from ? from.id : null;
  target.lastHitT = G.time;
  if (target.plate) drawPlate(target.plate, target.name, Math.max(0, target.health), target.maxHealth, target.colors.body);

  if (from && from.isPlayer) {
    SFX.hit(head);
    showHitmarker(head);
    addFloater(head ? Math.round(dmg) + '!' : String(Math.round(dmg)), hx, hy, hz,
               head ? '#fff0a8' : '#ffffff', head);
  }
  if (target.isPlayer) {
    SFX.hurt();
    flashDamage();
    if (from) addDamageDir(from);
    fxShake(0.18);
  }
  if (target.health <= 0) killActor(target, from);
}

function killActor(target, from) {
  target.alive = false;
  target.health = 0;
  target.deathT = 0;
  target.deathDir = rng() < 0.5 ? -1 : 1;
  target.respawnT = CFG.respawn;
  target.deaths++;
  target.streak = 0;
  target.aiming = false;
  fxKillBurst(target.pos.x, target.pos.y, target.pos.z, C(target.colors.body));
  if (target.plate) target.plate.sprite.visible = false;

  if (from && from !== target) {
    from.kills++;
    from.streak++;
    from.bestStreak = Math.max(from.bestStreak, from.streak);
    if (from.isPlayer) {
      SFX.kill();
      addFloater('+1', target.pos.x, target.pos.y + 1.6, target.pos.z, '#b8f2d8', true);
      if (from.streak >= 3) showHint(from.streak + ' IN A ROW!');
    }
  }
  addKillFeed(from, target);
  if (target.isPlayer) { SFX.die(); showDeadScreen(from); }
  refreshBoard();

  const top = G.actors.reduce((m, a) => a.kills > m.kills ? a : m, G.actors[0]);
  if (top.kills >= CFG.killsToWin && !G.over) endMatch(top);
}

function endMatch(winner) {
  G.over = true;
  G.winner = winner;
  showOverScreen(winner);
  if (winner.isPlayer) SFX.win();
  exitPointerLock();
}

/* =====================================================================
   PLAYER INPUT
   ===================================================================== */
const KEY = {};
const IN = { lookDX: 0, lookDY: 0, firing: false, sprinting: false, locked: false };
let mouseSens = 0.0021;

function initInput() {
  addEventListener('keydown', e => {
    if (e.code === 'Tab') e.preventDefault();
    KEY[e.code] = true;
    if (!G.started) return;
    if (e.code === 'KeyR') tryReload(G.player);
    if (e.code === 'Digit1') switchWeapon('smg');
    if (e.code === 'Digit2') switchWeapon('shotgun');
    if (e.code === 'Digit3') switchWeapon('rifle');
    if (e.code === 'Tab') setBoard(true);
    if (e.code === 'Escape') { /* browser exits lock; handled below */ }
  });
  addEventListener('keyup', e => {
    KEY[e.code] = false;
    if (e.code === 'Tab') setBoard(false);
  });
  addEventListener('mousedown', e => { if (IN.locked && e.button === 0) IN.firing = true; });
  addEventListener('mouseup', e => { if (e.button === 0) IN.firing = false; });
  addEventListener('wheel', e => {
    if (!IN.locked) return;
    const order = ['smg', 'shotgun', 'rifle'];
    const i = order.indexOf(G.player.weapon);
    switchWeapon(order[(i + (e.deltaY > 0 ? 1 : order.length - 1)) % order.length]);
  }, { passive: true });

  addEventListener('mousemove', e => {
    if (!IN.locked) return;
    const dx = e.movementX || 0, dy = e.movementY || 0;
    G.player.yaw -= dx * mouseSens;
    G.player.pitch = clamp(G.player.pitch - dy * mouseSens, -1.45, 1.45);
    IN.lookDX = clamp(IN.lookDX + dx * 0.006, -1, 1);
    IN.lookDY = clamp(IN.lookDY + dy * 0.006, -1, 1);
  });

  document.addEventListener('pointerlockchange', () => {
    IN.locked = document.pointerLockElement === canvas;
    if (!IN.locked && G.started && !G.over) setPaused(true);
    else if (IN.locked) setPaused(false);
  });
}
/* Pointer Lock throws if there was no user gesture (autostart, headless).
   That's not fatal — the match still runs, you just aren't mouse-looking. */
function requestLock() {
  try {
    if (!canvas.requestPointerLock) return;
    const r = canvas.requestPointerLock();       // newer Chrome returns a Promise
    if (r && typeof r.catch === 'function') r.catch(() => {});
  } catch (e) {}
}
function exitPointerLock() { try { if (document.exitPointerLock) document.exitPointerLock(); } catch (e) {} }

function switchWeapon(id) {
  if (!WBY[id] || G.player.weapon === id) return;
  G.player.weapon = id;
  const w = WBY[id];
  if (G.player.ammo > w.mag) G.player.ammo = w.mag;
  if (!G.player._ammoBy) G.player._ammoBy = {};
  // keep per-weapon ammo so switching isn't a free reload
  const store = G.player._ammoBy;
  if (store[id] === undefined) store[id] = { ammo: w.mag, reserve: w.reserve };
  G.player.ammo = store[id].ammo; G.player.reserve = store[id].reserve;
  G.player.reloadT = 0;
  vmSetWeapon(id);
  SFX.swap();
  updateHUD();
}
function syncPlayerAmmoStore() {
  const p = G.player;
  if (!p._ammoBy) p._ammoBy = {};
  p._ammoBy[p.weapon] = { ammo: p.ammo, reserve: p.reserve };
}

/* =====================================================================
   SIMULATION STEP  (fixed 1/60)
   ===================================================================== */
function stepPlayer(a, dt) {
  a.aimYaw = a.yaw; a.aimPitch = a.pitch;
  if (!a.alive) {
    a.respawnT -= dt;
    if (a.respawnT <= 0) { respawnActor(a); hideDeadScreen(); }
    return;
  }
  const fwd = (KEY.KeyW ? 1 : 0) - (KEY.KeyS ? 1 : 0);
  const str = (KEY.KeyD ? 1 : 0) - (KEY.KeyA ? 1 : 0);
  IN.sprinting = !!KEY.ShiftLeft || !!KEY.ShiftRight;

  const w = WBY[a.weapon];
  let speed = CFG.playerSpeed * w.speed;
  const sprinting = IN.sprinting && fwd > 0 && !IN.firing && a.reloadT <= 0;
  if (sprinting) speed *= CFG.sprintMul;

  /* forward = (sin y, cos y); right = cross(forward, up) = (-cos y, sin y).
     Getting this sign wrong makes D strafe left, which is subtle enough to
     ship: you still move sideways, just the wrong way. */
  const sy = Math.sin(a.yaw), cy = Math.cos(a.yaw);
  let mx = sy * fwd - cy * str;
  let mz = cy * fwd + sy * str;
  const ml = Math.hypot(mx, mz);
  if (ml > 1e-4) { mx = mx / ml * speed; mz = mz / ml * speed; }

  const acc = a.onGround ? CFG.accelGround : CFG.accelAir;
  a.vel.x = damp(a.vel.x, mx, acc, dt);
  a.vel.z = damp(a.vel.z, mz, acc, dt);
  if (KEY.Space && a.onGround) { a.vel.y = JUMP_V; a.onGround = false; }

  const res = moveActor(a.pos, a.vel, dt, {});
  const wasGround = a.onGround;
  a.onGround = res.onGround;
  if (!wasGround && a.onGround) { VM.landDip = 1; SFX.step(); fxShake(0.05); }

  // footsteps
  const spd = Math.hypot(a.vel.x, a.vel.z);
  if (a.onGround && spd > 1.2) {
    a.stepPhase += dt * (spd * 0.62);
    if (a.stepPhase > 1) { a.stepPhase -= 1; SFX.step(); }
  }

  if (a.reloadT > 0) { a.reloadT -= dt; if (a.reloadT <= 0) finishReload(a); }
  if (a.fireCd > 0) a.fireCd -= dt;
  a.aiming = IN.firing || (!sprinting && spd < 4.5);

  if (IN.firing && !sprinting) {
    const w2 = WBY[a.weapon];
    if (w2.auto) fireWeapon(a);
    else if (!IN._heldSemi) { if (fireWeapon(a)) IN._heldSemi = true; }
  }
  if (!IN.firing) IN._heldSemi = false;
  syncPlayerAmmoStore();
}

const _viewSelf = { id: 0, pos: null, vel: null, yaw: 0, pitch: 0, health: 0, maxHealth: 0,
                    ammo: 0, magSize: 0, reserve: 0, onGround: false, reloading: false };
const _viewOthers = [];
const _view = { time: 0, nav: null, rng: rng, self: _viewSelf, actors: _viewOthers, canSee: canSee };

function stepBot(a, dt) {
  if (!a.alive) {
    a.respawnT -= dt;
    if (a.respawnT <= 0) { respawnActor(a); if (a.plate) a.plate.sprite.visible = true; }
    return;
  }
  const w = WBY[a.weapon];

  _viewOthers.length = 0;
  for (const o of G.actors) if (o !== a) _viewOthers.push(o);
  _viewSelf.id = a.id; _viewSelf.pos = a.pos; _viewSelf.vel = a.vel;
  _viewSelf.yaw = yawFlip(a.aimYaw); _viewSelf.pitch = a.aimPitch;   // -> contract yaw
  _viewSelf.health = a.health; _viewSelf.maxHealth = a.maxHealth;
  _viewSelf.ammo = a.ammo; _viewSelf.magSize = w.mag; _viewSelf.reserve = a.reserve;
  _viewSelf.onGround = a.onGround; _viewSelf.reloading = a.reloadT > 0;
  _view.time = G.time; _view.nav = G.nav;

  let it;
  if (a.brain && G.aiOK) {
    try { it = AI.think(a.brain, _view, dt); }
    catch (e) { G.aiErr = String(e && e.message || e); a.brain = null; it = fallbackThink(a, dt); }
  } else it = fallbackThink(a, dt);
  if (!it) it = fallbackThink(a, dt);

  // sanitise: a NaN here would silently teleport a bot out of the world
  let mvx = Number.isFinite(it.moveX) ? clamp(it.moveX, -1, 1) : 0;
  let mvz = Number.isFinite(it.moveZ) ? clamp(it.moveZ, -1, 1) : 0;
  a.aimYaw = Number.isFinite(it.aimYaw) ? yawFlip(it.aimYaw) : a.aimYaw;   // contract -> engine
  a.aimPitch = Number.isFinite(it.aimPitch) ? clamp(it.aimPitch, -1.5, 1.5) : 0;
  a.state = it.state || '';

  const ml = Math.hypot(mvx, mvz);
  const speed = CFG.botSpeed * w.speed;
  if (ml > 1e-4) { mvx = mvx / ml * speed; mvz = mvz / ml * speed; }
  const acc = a.onGround ? CFG.accelGround : CFG.accelAir;
  a.vel.x = damp(a.vel.x, mvx, acc, dt);
  a.vel.z = damp(a.vel.z, mvz, acc, dt);
  if (it.jump && a.onGround) { a.vel.y = JUMP_V; a.onGround = false; }

  const res = moveActor(a.pos, a.vel, dt, {});
  a.onGround = res.onGround;

  if (a.reloadT > 0) { a.reloadT -= dt; if (a.reloadT <= 0) finishReload(a); }
  if (a.fireCd > 0) a.fireCd -= dt;
  if (it.reload) tryReload(a);
  a.aiming = !!it.targetId;
  if (it.fire) fireWeapon(a);

  const spd = Math.hypot(a.vel.x, a.vel.z);
  if (a.onGround && spd > 1.2) {
    a.stepPhase += dt * (spd * 0.6);
    if (a.stepPhase > 1) { a.stepPhase -= 1; SFX.step(a.pos.x, a.pos.y, a.pos.z); }
  }
}

function simulate(dt) {
  G.time += dt;
  for (const a of G.actors) if (a.shield > 0) a.shield = Math.max(0, a.shield - dt);
  stepPlayer(G.player, dt);
  for (const a of G.actors) if (!a.isPlayer) stepBot(a, dt);

  // mannequins settle back upright after being shot
  for (const m of WORLD.mannequins) {
    const u = m.userData;
    if (Math.abs(u.spin) > 0.001) {
      m.rotation.y += u.spin * dt;
      u.spin *= Math.exp(-2.6 * dt);
      if (Math.abs(u.spin) < 0.02) u.spin = 0;
    }
    if (u.lean > 0.001) {
      u.lean = Math.max(0, u.lean - dt * 0.9);
      m.rotation.z = Math.sin(u.lean * 9) * u.lean * 0.28;
    }
  }
}

/* =====================================================================
   MATCH / SCREEN FLOW
   ===================================================================== */
function startMatch() {
  SFX.init(); SFX.resume();
  setupMatch();
  G.started = true; G.over = false;
  document.getElementById('title').classList.add('off');
  document.getElementById('over').classList.add('off');
  restoreBoard();                       // put the scoreboard back on the HUD
  document.getElementById('hud').classList.remove('hide');
  vmSetWeapon('smg', true);
  showHint('FIRST TO ' + CFG.killsToWin + ' KILLS');
  requestLock();
}
</script>
<script>/* ===== src/80-ui.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — HUD, killfeed, scoreboard, screens
   ===================================================================== */
const $ = id => document.getElementById(id);
const elHp = $('hpbar'), elHpN = $('hpnum'), elAmmo = $('acount'), elWName = $('wname');
const elReload = $('reloading'), elSlots = $('wslots').children;
const elScore = $('tScore'), elLead = $('tLead'), elGoal = $('tGoal');
const elFeed = $('feed'), elHint = $('hint'), elBoard = $('board'), elBoardBody = $('boardBody');
const elHitmark = $('hitmark'), elDmg = $('dmg'), elHeal = $('heal');
const elCross = { u: $('cU'), d: $('cD'), l: $('cL'), r: $('cR') };

let crossSpread = 8, crossPunch = 0, hitmarkT = 0, dmgFlash = 0, healFlash = 0;

/* Where the scoreboard lives when no full-screen card is up. */
const boardHome = elBoard.parentNode;
function restoreBoard() {
  if (elBoard.parentNode !== boardHome) boardHome.appendChild(elBoard);
  elBoard.classList.remove('on');
}
const damageDirs = [];

function updateHUD() {
  const p = G.player;
  if (!p) return;
  const f = clamp(p.health / p.maxHealth, 0, 1);
  elHp.style.width = (f * 100) + '%';
  elHp.classList.toggle('low', f <= 0.35);
  elHpN.textContent = String(Math.max(0, Math.ceil(p.health)));

  const w = WBY[p.weapon];
  elWName.textContent = w.name;
  elAmmo.innerHTML = p.ammo + '<small>/' + p.reserve + '</small>';
  elAmmo.classList.toggle('empty', p.ammo === 0);
  elReload.textContent = p.reloadT > 0 ? 'RELOADING' : (p.ammo === 0 ? 'PRESS R' : '');

  const order = ['smg', 'shotgun', 'rifle'];
  for (let i = 0; i < elSlots.length; i++) elSlots[i].classList.toggle('on', order[i] === p.weapon);

  elScore.textContent = String(p.kills);
  elGoal.textContent = String(CFG.killsToWin);
  let lead = G.actors[0];
  for (const a of G.actors) if (a.kills > lead.kills) lead = a;
  elLead.textContent = lead.kills > 0 ? (lead.isPlayer ? 'YOU' : lead.name) : '—';
}

function setCrosshairPunch(px) { crossPunch = Math.max(crossPunch, px); }
function updateCrosshair(dt) {
  const p = G.player;
  const spd = p ? Math.hypot(p.vel.x, p.vel.z) : 0;
  const w = p ? WBY[p.weapon] : WEAPONS[0];
  const base = 7 + spd * 1.5 + (w.id === 'shotgun' ? 9 : 0) + (p && !p.onGround ? 6 : 0);
  crossPunch = Math.max(0, crossPunch - dt * 60);
  crossSpread = damp(crossSpread, base + crossPunch, 16, dt);
  const s = crossSpread;
  elCross.u.style.top = (-s - 11 + 22) + 'px'; elCross.u.style.transform = 'translateY(' + (-s) + 'px)';
  elCross.d.style.top = (22 + s) + 'px';
  elCross.l.style.left = 'calc(50% - ' + (s + 11) + 'px)';
  elCross.r.style.left = 'calc(50% + ' + s + 'px)';
  elCross.u.style.top = 'calc(50% - ' + (s + 11) + 'px)'; elCross.u.style.transform = '';
  elCross.d.style.top = 'calc(50% + ' + s + 'px)';

  if (hitmarkT > 0) {
    hitmarkT -= dt;
    elHitmark.style.opacity = String(clamp(hitmarkT / 0.22, 0, 1));
    elHitmark.style.transform = 'scale(' + (1.45 - clamp(hitmarkT / 0.22, 0, 1) * 0.45) + ')';
  } else elHitmark.style.opacity = '0';

  if (dmgFlash > 0) { dmgFlash -= dt; elDmg.style.opacity = String(clamp(dmgFlash / 0.45, 0, 1) * 0.9); }
  else elDmg.style.opacity = '0';
  if (healFlash > 0) { healFlash -= dt; elHeal.style.opacity = String(clamp(healFlash / 0.5, 0, 1) * 0.7); }
  else elHeal.style.opacity = '0';
}
function showHitmarker(head) {
  hitmarkT = 0.22;
  for (const s of elHitmark.children) s.style.background = head ? '#ffe27a' : '#ffffff';
}
function flashDamage() { dmgFlash = 0.45; }

/* ---- directional damage arrows ---- */
function addDamageDir(from) {
  const el = document.createElement('div');
  el.className = 'dind';
  $('hud').appendChild(el);
  damageDirs.push({ el, from, t: 1.1 });
  if (damageDirs.length > 5) { const d = damageDirs.shift(); d.el.remove(); }
}
function setDamageDirsCleared() { while (damageDirs.length) damageDirs.pop().el.remove(); }
function updateDamageDirs(dt) {
  const p = G.player;
  for (let i = damageDirs.length - 1; i >= 0; i--) {
    const d = damageDirs[i];
    d.t -= dt;
    if (d.t <= 0 || !p) { d.el.remove(); damageDirs.splice(i, 1); continue; }
    const ang = Math.atan2(d.from.pos.x - p.pos.x, d.from.pos.z - p.pos.z);
    const rel = angDelta(p.yaw, ang);
    d.el.style.transform = 'rotate(' + (-rel) + 'rad)';
    d.el.style.opacity = String(clamp(d.t / 1.1, 0, 1));
  }
}

/* ---- killfeed ---- */
const feedItems = [];
function addKillFeed(from, target) {
  const el = document.createElement('div');
  el.className = 'fitem';
  const w = from ? WBY[from.weapon] : null;
  const nm = (a) => {
    const s = document.createElement('b');
    s.textContent = a.isPlayer ? 'YOU' : a.name;
    s.style.color = a.isPlayer ? '#d4638f' : '#4a3f5c';
    return s;
  };
  if (from && from !== target) {
    el.appendChild(nm(from));
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = w ? w.icon : '💥';
    el.appendChild(ic);
  } else {
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = '💀';
    el.appendChild(ic);
  }
  el.appendChild(nm(target));
  elFeed.appendChild(el);
  feedItems.push({ el, t: 5.0 });
  if (feedItems.length > 5) { const f = feedItems.shift(); f.el.remove(); }
}
function updateFeed(dt) {
  for (let i = feedItems.length - 1; i >= 0; i--) {
    const f = feedItems[i];
    f.t -= dt;
    if (f.t <= 0) { f.el.remove(); feedItems.splice(i, 1); continue; }
    if (f.t < 0.6) f.el.style.opacity = String(f.t / 0.6);
  }
}

/* ---- hint toast ---- */
let hintT = 0;
function showHint(text) { elHint.textContent = text; hintT = 2.4; }
function updateHint(dt) {
  if (hintT > 0) {
    hintT -= dt;
    const u = clamp(hintT / 0.4, 0, 1) * clamp((2.4 - hintT) / 0.25, 0, 1);
    elHint.style.opacity = String(u);
  } else elHint.style.opacity = '0';
}

/* ---- scoreboard ---- */
/* The board centres itself on the viewport, so on its own it lands right on
   top of any full-screen card. Whenever one is up, park it inside that card
   instead — checking the scores while dead is a thing players actually do. */
function setBoard(on) {
  if (on) {
    refreshBoard();
    const dead = document.getElementById('dead');
    if (!G.over && !dead.classList.contains('off')) dead.appendChild(elBoard);
    else if (!G.over && elBoard.parentNode !== boardHome) boardHome.appendChild(elBoard);
  } else if (!G.over && elBoard.parentNode !== boardHome) {
    boardHome.appendChild(elBoard);
  }
  elBoard.classList.toggle('on', on);
}
function refreshBoard() {
  const rows = G.actors.slice().sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  elBoardBody.innerHTML = '';
  for (const a of rows) {
    const tr = document.createElement('tr');
    if (a.isPlayer) tr.className = 'me';
    const td0 = document.createElement('td');
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = '#' + a.colors.body.toString(16).padStart(6, '0');
    td0.appendChild(sw);
    td0.appendChild(document.createTextNode(a.isPlayer ? 'YOU' : a.name));
    tr.appendChild(td0);
    for (const v of [a.kills, a.deaths, a.bestStreak]) {
      const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
    }
    elBoardBody.appendChild(tr);
  }
}

/* ---- death + match-over screens ---- */
function showDeadScreen(from) {
  $('deadBy').textContent = from && from !== G.player ? ('taken out by ' + from.name) : 'you went down';
  $('dead').classList.remove('off');
}
function hideDeadScreen() { $('dead').classList.add('off'); if (!G.over) restoreBoard(); }
function updateDeadScreen() {
  if (G.player && !G.player.alive) $('deadCd').textContent = String(Math.max(1, Math.ceil(G.player.respawnT)));
}
function showOverScreen(winner) {
  const rows = G.actors.slice().sort((a, b) => b.kills - a.kills);
  const place = rows.indexOf(G.player) + 1;
  $('overBig').textContent = winner.isPlayer ? 'YOU WIN!' : (winner.name + ' WINS');
  $('overRank').textContent = 'You placed #' + place + ' of ' + rows.length +
    '  ·  ' + G.player.kills + ' kills / ' + G.player.deaths + ' deaths  ·  best streak ' + G.player.bestStreak;
  refreshBoard();
  const over = $('over');
  over.insertBefore(elBoard, $('again'));
  elBoard.classList.add('on');
  over.classList.remove('off');
}

/* ---- pause ---- */
function setPaused(p) {
  if (G.over) return;
  G.paused = p;
  if (p && G.started) { $('title').classList.remove('off'); $('play').textContent = 'RESUME'; }
  else if (G.started) $('title').classList.add('off');
}
</script>
<script>/* ===== src/90-main.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — boot, camera, main loop, debug contract
   ===================================================================== */

const FIXED = 1 / 60;
let lastT = 0, titleOrbit = 0;
const PROF = { sim: 0, anim: 0, render: 0, frames: 0 };

/* Death cam: up and BEHIND (forward is (sin yaw, cos yaw), so behind is the
   negative of that), and shortened if a wall is in the way — otherwise you
   die next to a house and spend the respawn staring at flat siding. */
function placeDeathCam(p) {
  const back = 4.2, up = 2.6;
  const dx = -Math.sin(p.yaw), dz = -Math.cos(p.yaw);
  const h = raycastMap(p.pos.x, p.pos.y + 1.2, p.pos.z, dx, 0, dz, back + 0.4);
  const d = h ? Math.max(0.9, h.dist - 0.45) : back;
  // if cover forced the camera in close, climb so it looks over it
  const y = up + (back - d) * 0.55;
  camera.position.set(p.pos.x + dx * d, p.pos.y + y, p.pos.z + dz * d);
  camera.lookAt(p.pos.x, p.pos.y + 0.9, p.pos.z);
}

/* ---------------------------------------------------------------- */
function updateCamera(dt) {
  if (G.frozen) return;                       // screenshotPose owns the camera
  const p = G.player;

  if (!G.started || G.paused) {               // slow orbit behind the title card
    titleOrbit += dt * 0.055;
    const r = 46, y = 19;
    camera.position.set(Math.cos(titleOrbit) * r, y + Math.sin(titleOrbit * 0.7) * 4, Math.sin(titleOrbit) * r * 0.72);
    camera.lookAt(0, 3.2, 0);
    return;
  }
  if (!p) return;

  if (!p.alive) { placeDeathCam(p); return; }

  const spd = Math.hypot(p.vel.x, p.vel.z);
  const bobA = p.onGround ? Math.min(spd / 7, 1) * 0.045 : 0;
  const bx = Math.cos(VM.bobT) * bobA * 0.6;
  const by = Math.abs(Math.sin(VM.bobT)) * -bobA;

  camera.position.set(p.pos.x + bx, p.pos.y + ACT.eye + by - VM.landDip * 0.16, p.pos.z);
  /* +PI because a three.js camera looks down -Z but engine yaw 0 means +Z.
     Without it you shoot and walk exactly opposite to where you're looking. */
  camera.rotation.set(p.pitch, p.yaw + Math.PI, 0);

  if (FX.shake > 0.001) {
    const s = FX.shake;
    camera.position.x += rand(-s, s) * 0.16;
    camera.position.y += rand(-s, s) * 0.16;
    camera.rotation.z += rand(-s, s) * 0.035;
  }
  // slight roll when strafing reads as weight
  const str = (KEY.KeyD ? 1 : 0) - (KEY.KeyA ? 1 : 0);
  camera.rotation.z += damp(camera.rotation.z, -str * 0.022, 8, dt) * 0 + (-str * 0.022);
}

function animateAll(dt) {
  for (const a of G.actors) {
    updateBlobShadow(a.blob, a);
    updateBubble(a.bubble, a, G.time);
    if (a.isPlayer || !a.char) continue;
    a.char.root.position.set(a.pos.x, a.pos.y, a.pos.z);
    animateCharacter(a.char, a, dt, G.time);
    if (!a.alive && a.deathT > 2.0) a.char.root.visible = false;
    else if (a.alive) a.char.root.visible = true;
  }
  updateMotes(G.time);
  updateFX(dt);
  updateFloaters(dt);
}

function renderAll() {
  renderer.autoClear = true;
  renderer.render(scene, camera);
  if (G.started && !G.paused && G.player && G.player.alive && !G.frozenNoVM) {
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(vmScene, vmCam);
    renderer.autoClear = true;
  }
}

/* =====================================================================
   ADAPTIVE RESOLUTION
   This renderer is fill-rate bound — measured on a software rasteriser,
   frame time tracks pixel count almost exactly (0.42x -> 20fps, 0.6x ->
   12fps) while geometry and particle counts barely register. So the one
   knob worth steering automatically is the drawing-buffer scale: aim for
   a playable frame time, and hand the pixels back when there's headroom.
   Flat cel colours upscale gracefully, which is what makes this viable.
   ===================================================================== */
const RES = {
  scale: 1, min: 0.4, max: 1, cool: 0, pinned: false,
  hist: [], target: 1 / 30, good: 1 / 55
};
/* Pin full resolution — the screenshot rig uses this so evidence frames show
   what a GPU user sees, not what this software rasteriser degraded to. */
function pinRes(on) {
  RES.pinned = !!on;
  renderer.setPixelRatio(on ? 1 : RES.scale);
  renderer.setSize(innerWidth, innerHeight);
}
function initAdaptiveRes() {
  RES.max = SOFTWARE_GPU ? 0.72 : Math.min(devicePixelRatio || 1, 1.75);
  RES.min = SOFTWARE_GPU ? 0.38 : 0.6;
  RES.scale = SOFTWARE_GPU ? 0.5 : RES.max;
  renderer.setPixelRatio(RES.scale);
  renderer.setSize(innerWidth, innerHeight);
}
function updateAdaptiveRes(dt) {
  RES.hist.push(dt);
  if (RES.hist.length > 24) RES.hist.shift();
  RES.cool -= dt;
  if (RES.pinned || RES.cool > 0 || RES.hist.length < 24) return;
  const med = RES.hist.slice().sort((a, b) => a - b)[12];
  let s = RES.scale;
  if (med > RES.target) s = Math.max(RES.min, s * 0.90);
  else if (med < RES.good) s = Math.min(RES.max, s * 1.06);
  if (Math.abs(s - RES.scale) > 0.005) {
    RES.scale = s;
    renderer.setPixelRatio(s);
    renderer.setSize(innerWidth, innerHeight);
  }
  RES.cool = 0.7;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  updateAdaptiveRes(dt);

  if (!G.frozen) {
    if (G.started && !G.paused && !G.over) {
      G.fixedAcc += dt;
      let guard = 0;
      while (G.fixedAcc >= FIXED && guard++ < 6) { simulate(FIXED); G.fixedAcc -= FIXED; }
      if (guard >= 6) G.fixedAcc = 0;
    }
    IN.lookDX = damp(IN.lookDX, 0, 9, dt);
    IN.lookDY = damp(IN.lookDY, 0, 9, dt);
    updateCamera(dt);
    updateViewmodel(dt, {
      vel: G.player ? G.player.vel : { x: 0, y: 0, z: 0 },
      onGround: G.player ? G.player.onGround : true,
      lookDX: IN.lookDX, lookDY: IN.lookDY,
      sprinting: IN.sprinting, firing: IN.firing
    });
    animateAll(dt);
    updateCrosshair(dt);
    updateFeed(dt);
    updateHint(dt);
    updateDamageDirs(dt);
    updateDeadScreen();
    updateHUD();
  }
  renderAll();
  PROF.frames++;
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  const bar = document.getElementById('lbar');
  const set = p => { if (bar) bar.style.width = p + '%'; };
  set(8);
  initRenderer();  set(18);
  initAdaptiveRes();
  initLights();    set(30);
  buildWorld();    set(60);
  initViewmodel(); set(74);
  initFX();        set(82);
  initInput();     set(88);
  initAI();        set(96);

  setupMatch();
  camera.position.set(40, 20, 30); camera.lookAt(0, 3, 0);

  document.getElementById('loading').classList.add('off');
  set(100);

  document.getElementById('play').addEventListener('click', () => {
    SFX.init(); SFX.resume(); SFX.ui();
    if (G.started && G.paused) { setPaused(false); requestLock(); }
    else startMatch();
  });
  document.getElementById('again').addEventListener('click', () => {
    SFX.ui();
    G.over = false;
    document.getElementById('over').classList.add('off');
    restoreBoard();
    startMatch();
  });

  requestAnimationFrame(frame);
  if (AUTOSTART) startMatch();
}

/* =====================================================================
   DEBUG CONTRACT — headless verification hook.
   Pointer Lock can't be driven by synthetic input, so the rig freezes
   the world and poses the camera directly instead of "playing".
   ===================================================================== */
const POSES = {
  overview:  { pos: [0, 52, 62],      look: [0, 2, 0] },
  aerial:    { pos: [-40, 34, 40],    look: [2, 3, -2] },
  street:    { pos: [12, 1.75, 0.6],  look: [-26, 2.6, -0.4] },
  streetEast:{ pos: [-11, 1.75, 1.2], look: [24, 2.2, 0.2] },
  yard:      { pos: [-6.0, 1.7, 1.0], look: [-5.0, 2.4, -9.0] },
  porch:     { pos: [-4.6, 1.7, -4.6],look: [-4.6, 2.2, -12.0] },
  house:     { pos: [-5.0, 1.7, -11.8], look: [-10.4, 1.45, -16.0] },
  upstairs:  { pos: [-5.2, 4.92, -16.4], look: [-10.4, 4.35, -14.2] },
  balcony:   { pos: [3.6, 5.0, 5.2],  look: [-4.0, 3.4, -8.0] },
  bus:       { pos: [-29.3, 2.0, 4.6], look: [-22.0, 1.4, -0.4] },
  truck:     { pos: [13.2, 1.9, -3.6], look: [21.5, 1.3, 0.4] },
  tower:     { pos: [-4.0, 8.0, -19.5], look: [-6.0, 26.0, -70.0] },
  gun:       { pos: [-6.0, 1.7, 2.0], look: [-6.4, 1.9, -8.0] }
};

function poseCamera(name) {
  const p = POSES[name];
  if (!p) return false;
  camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
  camera.rotation.set(0, 0, 0);
  camera.lookAt(p.look[0], p.look[1], p.look[2]);
  return true;
}

/* Move bots somewhere the pose can actually see them, and make them shoot,
   so a "combat" screenshot shows combat instead of an empty street. */
function stageCombat(anchor) {
  const spots = [
    [-3.5, 0, -2.0, 1.2], [3.0, 0, 2.6, -2.0], [-9.0, 0, -1.2, 0.6],
    [6.5, 0, -2.2, 2.6], [-2.0, 3.3, -9.5, 0.2], [8.0, 0, 3.0, -1.4],
    [-13.0, 0, 1.5, 0.9], [1.0, 3.3, 9.5, 3.1]
  ];
  let i = 0;
  for (const a of G.actors) {
    if (a.isPlayer) continue;
    const s = spots[i++ % spots.length];
    a.pos.x = s[0]; a.pos.y = s[1]; a.pos.z = s[2];
    a.vel.x = Math.sin(s[3]) * 3.4; a.vel.z = Math.cos(s[3]) * 3.4; a.vel.y = 0;
    a.alive = true; a.health = a.maxHealth; a.spawnT = 0; a.deathT = 0;
    a.aimYaw = s[3]; a.aimPitch = -0.03; a.aiming = true; a.onGround = true;
    if (a.plate) a.plate.sprite.visible = true;
    if (a.char) { a.char.root.visible = true; a.char.root.scale.setScalar(1); }
  }
  // a couple of animation frames so limbs are mid-stride, not in T-pose
  for (let k = 0; k < 12; k++) animateAll(FIXED);
  // real shots so there are tracers, flashes and confetti in the frame
  for (const a of G.actors) {
    if (a.isPlayer || rng() < 0.35) continue;
    a.fireCd = 0; a.recoil = 1;
    fireWeapon(a);
  }
  for (let k = 0; k < 3; k++) { updateFX(FIXED); animateAll(FIXED); }
}

window.NUKETOWN_DEBUG = {
  THREE: THREE,
  get scene() { return scene; },
  get camera() { return camera; },
  get renderer() { return renderer; },
  get game() { return G; },
  poses: Object.keys(POSES).concat(['title', 'combat', 'death', 'victory']),

  /* run N fixed sim ticks with no rendering — deterministic and instant */
  step(n) {
    if (!G.started) { startMatch(); exitPointerLock(); }
    for (let i = 0; i < (n || 60); i++) simulate(FIXED);
    for (let i = 0; i < 4; i++) animateAll(FIXED);
    updateHUD(); refreshBoard();
    return this.state();
  },

  screenshotPose(name, opts) {
    opts = opts || {};
    const hud = document.getElementById('hud');
    if (!G.started) { startMatch(); exitPointerLock(); }
    G.frozen = false;
    G.frozenNoVM = true;

    // settle the match so bots have spread out and scores exist
    const warm = opts.warm === undefined ? 240 : opts.warm;
    for (let i = 0; i < warm; i++) simulate(FIXED);
    for (let i = 0; i < 8; i++) animateAll(FIXED);

    document.getElementById('title').classList.add('off');
    document.getElementById('dead').classList.add('off');
    document.getElementById('over').classList.add('off');
    restoreBoard();
    hud.classList.remove('hide');

    if (name === 'title') {
      document.getElementById('title').classList.remove('off');
      hud.classList.add('hide');
      titleOrbit = 2.15;
      camera.position.set(Math.cos(titleOrbit) * 46, 21, Math.sin(titleOrbit) * 33);
      camera.lookAt(0, 3.2, 0);
    } else if (name === 'death') {
      const killer = G.actors.find(a => !a.isPlayer);
      // die somewhere with a view, not wherever the warm-up left the player
      G.player.pos.x = 4.0; G.player.pos.y = 0; G.player.pos.z = 1.2;
      G.player.yaw = -1.5;
      G.player.alive = false; G.player.respawnT = 3; G.player.health = 0;
      showDeadScreen(killer);
      fxKillBurst(G.player.pos.x, G.player.pos.y, G.player.pos.z, C(0xffb7c5));
      placeDeathCam(G.player);
    } else if (name === 'victory') {
      G.player.kills = CFG.killsToWin;
      G.actors.forEach((a, i) => { if (!a.isPlayer) { a.kills = 4 + i * 2; a.deaths = 5 + i; } });
      G.player.deaths = 9; G.player.bestStreak = 7;
      endMatch(G.player);
      camera.position.set(Math.cos(2.4) * 40, 17, Math.sin(2.4) * 30);
      camera.lookAt(0, 3.2, 0);
    } else if (name === 'combat') {
      stageCombat();
      // first-person: stand in the street, weapon up, mid-firefight
      G.frozenNoVM = false;
      const p = G.player;
      p.pos.x = 11.5; p.pos.y = 0; p.pos.z = 1.4; p.alive = true; p.health = 72;
      p.yaw = -1.44; p.pitch = -0.02; p.aimYaw = p.yaw; p.aimPitch = p.pitch;
      p.vel.x = -2.2; p.vel.z = 0.2; p.onGround = true; p.kills = 7; p.deaths = 3;
      p.weapon = 'smg'; p.ammo = 17; p.reserve = 120;
      vmSetWeapon('smg', true);
      camera.position.set(p.pos.x, p.pos.y + ACT.eye, p.pos.z);
      camera.rotation.set(p.pitch, p.yaw + Math.PI, 0);
      vmFire(WBY.smg); VM.recoil = 0.014; VM.rot = 0.02;
      updateViewmodel(FIXED, { vel: p.vel, onGround: true, lookDX: 0.2, lookDY: 0, sprinting: false, firing: true });
      fireWeapon(p);
      updateHUD(); refreshBoard();
    } else if (name === 'gun') {
      /* Weapon showcase: stand in the street holding the chosen gun, calm
         pose, viewmodel on. opts.weapon picks which one. */
      G.frozenNoVM = false;
      const p = G.player;
      p.pos.x = -6.0; p.pos.y = 0; p.pos.z = 2.0; p.alive = true; p.health = 100;
      p.yaw = Math.PI; p.pitch = -0.02; p.aimYaw = p.yaw; p.aimPitch = p.pitch;
      p.vel.x = 0; p.vel.z = 0; p.onGround = true;
      p.weapon = opts.weapon || 'smg';
      const gw = WBY[p.weapon];
      p.ammo = gw.mag; p.reserve = gw.reserve;
      vmSetWeapon(p.weapon, true);
      VM.swapT = 0; VM.sprint = 0; VM.recoil = 0; VM.rot = 0;
      camera.position.set(p.pos.x, p.pos.y + ACT.eye, p.pos.z);
      camera.rotation.set(p.pitch, p.yaw + Math.PI, 0);
      updateViewmodel(FIXED, { vel: p.vel, onGround: true, lookDX: 0, lookDY: 0, sprinting: false, firing: false });
      updateHUD();
    } else if (!poseCamera(name)) {
      return { ok: false, error: 'unknown pose: ' + name, poses: this.poses };
    }

    if (opts.hud === false) hud.classList.add('hide');
    pinRes(opts.pinRes !== false);
    updateHUD();
    updateCrosshair(FIXED);
    G.frozen = true;
    camera.updateMatrixWorld(true);
    renderAll();
    return { ok: true, pose: name, state: this.state() };
  },

  unfreeze() { G.frozen = false; G.frozenNoVM = false; pinRes(false); },
  pinRes: pinRes,
  res() { return { scale: +RES.scale.toFixed(3), pinned: RES.pinned, min: RES.min, max: RES.max }; },

  /* Wall-clock FPS is meaningless headless (rAF is throttled), so time the
     stages directly instead. */
  profile(iters) {
    const N = iters || 60;
    const t0 = performance.now();
    for (let i = 0; i < N; i++) simulate(FIXED);
    const t1 = performance.now();
    for (let i = 0; i < N; i++) animateAll(FIXED);
    const t2 = performance.now();
    for (let i = 0; i < Math.min(N, 20); i++) renderAll();
    const t3 = performance.now();
    return {
      simMs: +((t1 - t0) / N).toFixed(3),
      animMs: +((t2 - t1) / N).toFixed(3),
      renderMs: +((t3 - t2) / Math.min(N, 20)).toFixed(3),
      software: SOFTWARE_GPU, toon: TOON_OK,
      /* info.render is reset by every render() call, so read it straight
         after the world pass — otherwise you measure the viewmodel. */
      drawCalls: (renderer.render(scene, camera), renderer.info.render.calls),
      tris: renderer.info.render.triangles
    };
  },

  state() {
    return {
      booted: true,
      started: G.started, over: G.over, time: +G.time.toFixed(2),
      aiOK: G.aiOK, aiErr: G.aiErr, toon: TOON_OK, software: SOFTWARE_GPU,
      solids: MAP.solids.length,
      actors: G.actors.map(a => ({
        name: a.name, isPlayer: a.isPlayer, alive: a.alive,
        hp: Math.round(a.health), kills: a.kills, deaths: a.deaths,
        state: a.state, weapon: a.weapon,
        pos: [+a.pos.x.toFixed(2), +a.pos.y.toFixed(2), +a.pos.z.toFixed(2)]
      }))
    };
  },

  /* headless sanity: are the bots actually fighting each other? */
  botFightReport(seconds) {
    if (!G.started) { startMatch(); exitPointerLock(); }
    const p = G.player;
    p.pos.x = 0; p.pos.y = 60; p.pos.z = 0;      // park the player out of the fight
    const k0 = G.actors.map(a => a.kills);
    const n = Math.round((seconds || 45) / FIXED);
    const seen = new Set(); const levels = new Set(); const moved = [];
    const start = G.actors.map(a => ({ x: a.pos.x, z: a.pos.z, d: 0 }));
    for (let i = 0; i < n; i++) {
      simulate(FIXED);
      p.pos.y = 60;
      G.actors.forEach((a, j) => {
        if (a.isPlayer) return;
        seen.add(a.state);
        if (a.pos.y > 2.5) levels.add(a.id);
        const dx = a.pos.x - start[j].x, dz = a.pos.z - start[j].z;
        start[j].d += Math.hypot(dx, dz); start[j].x = a.pos.x; start[j].z = a.pos.z;
      });
    }
    G.actors.forEach((a, j) => { if (!a.isPlayer) moved.push({ name: a.name, dist: +start[j].d.toFixed(1), kills: a.kills - k0[j] }); });
    return {
      simSeconds: seconds || 45,
      botKills: moved.reduce((s, m) => s + m.kills, 0),
      statesSeen: Array.from(seen),
      botsThatReachedUpperFloor: levels.size,
      perBot: moved,
      nan: G.actors.some(a => !Number.isFinite(a.pos.x) || !Number.isFinite(a.pos.y) || !Number.isFinite(a.pos.z))
    };
  }
};

boot();
</script>
</body>
</html>
