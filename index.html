<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASTEL NUKETOWN — Free-For-All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3f5c; --ink-soft:#6b5f80;
  --cream:#fff8f0; --pink:#ffb7c5; --peach:#ffd3b6; --butter:#ffefa8;
  --mint:#b8f2d8; --sky:#a8dcf0; --lilac:#d4c5f9; --coral:#ff9aa2;
  --panel:rgba(255,248,240,.82);
  --disp:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --ui:'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfe8f5}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ---------- generic chunky pastel panel ---------- */
.panel{
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:18px;
  box-shadow:0 5px 0 var(--ink), 0 5px 22px rgba(74,63,92,.22);
  backdrop-filter:blur(7px);
}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
#hud.hide{display:none}

/* ---------- vignette + damage flash ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(90,74,110,.30) 100%)}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,120,150,0) 35%,rgba(255,110,145,.62) 100%)}
#heal{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(150,255,200,0) 40%,rgba(140,250,200,.5) 100%)}

/* ---------- crosshair ---------- */
#cross{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:11;pointer-events:none}
#cross i{position:absolute;background:var(--cream);border:2px solid var(--ink);border-radius:3px;
  box-shadow:0 0 6px rgba(74,63,92,.35);transition:none}
#cross .dot{left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%}
#cross .t{left:50%;width:4px;height:11px;margin-left:-2px}
#cross .h{top:50%;height:4px;width:11px;margin-top:-2px}
#hitmark{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:12;
  opacity:0;pointer-events:none}
#hitmark span{position:absolute;left:50%;top:50%;width:16px;height:4px;margin:-2px 0 0 -8px;
  background:#fff;border:2px solid var(--ink);border-radius:3px}

/* ---------- bottom-left: health ---------- */
#vitals{position:absolute;left:26px;bottom:24px;padding:12px 18px 13px;min-width:250px}
#vitals .lbl{font-family:var(--disp);font-size:13px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#hpwrap{margin-top:6px;height:22px;border:3px solid var(--ink);border-radius:12px;background:#efe3f2;overflow:hidden;position:relative}
#hpbar{height:100%;width:100%;border-radius:8px;
  background:linear-gradient(180deg,#c8ffe4,#7fe6b4);transition:width .16s ease-out}
#hpbar.low{background:linear-gradient(180deg,#ffc9d4,#ff8fa3)}
#hpnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:15px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}

/* ---------- bottom-right: ammo + weapon ---------- */
#ammo{position:absolute;right:26px;bottom:24px;padding:10px 20px 12px;text-align:right;min-width:210px}
#wname{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
#acount{font-family:var(--disp);font-size:44px;font-weight:800;line-height:.98;color:var(--ink)}
#acount small{font-size:20px;color:var(--ink-soft)}
#acount.empty{color:var(--coral)}
#reloading{font-family:var(--disp);font-size:14px;letter-spacing:.14em;color:var(--coral);
  text-transform:uppercase;height:16px}
#wslots{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
#wslots div{width:26px;height:22px;border:2.5px solid var(--ink);border-radius:7px;background:#fff;
  font-family:var(--disp);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:.45}
#wslots div.on{opacity:1;background:var(--butter);transform:translateY(-2px)}

/* ---------- top-centre: match state ---------- */
#top{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
#top .box{padding:7px 16px 8px;text-align:center;min-width:82px}
#top .k{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#top .v{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1;color:var(--ink)}
#top .v.lead{color:#e0709a}

/* ---------- killfeed ---------- */
#feed{position:absolute;right:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fitem{padding:5px 13px 6px;border:2.5px solid var(--ink);border-radius:13px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-size:14px;font-weight:600;
  display:flex;gap:7px;align-items:center;animation:fpop .22s cubic-bezier(.3,1.6,.5,1)}
.fitem b{font-weight:800}
.fitem .ic{font-size:15px}
@keyframes fpop{from{transform:translateX(22px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---------- floating combat text ---------- */
#floaters{position:absolute;inset:0}
.float{position:absolute;font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(255,255,255,.6);transform:translate(-50%,-50%);white-space:nowrap}

/* ---------- damage direction ---------- */
.dind{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
  pointer-events:none}
.dind::before{content:'';position:absolute;left:50%;top:2px;margin-left:-15px;
  width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
  border-bottom:19px solid rgba(255,120,150,.9);filter:drop-shadow(0 0 3px rgba(74,63,92,.6))}

/* ---------- scoreboard ---------- */
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 26px 22px;
  min-width:430px;display:none}
#board.on{display:block}
/* while the match-over card is up the board is re-parented into it, so it
   has to sit in the flex flow instead of centring itself on the viewport */
#over #board,#dead #board{position:static;transform:none;margin:14px 0 2px;max-height:56vh;overflow:auto}
#board h3{font-family:var(--disp);font-size:20px;letter-spacing:.1em;text-align:center;margin-bottom:12px}
#board table{width:100%;border-collapse:collapse;font-family:var(--disp);font-size:16px}
#board th{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
  text-align:right;padding-bottom:6px}
#board th:first-child{text-align:left}
#board td{padding:4px 0;text-align:right;font-weight:600}
#board td:first-child{text-align:left;display:flex;gap:8px;align-items:center}
#board tr.me td{color:#d4638f}
#board .sw{width:15px;height:15px;border:2.5px solid var(--ink);border-radius:5px;display:inline-block}

/* ---------- title / overlays ---------- */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:radial-gradient(ellipse at 50% 38%,rgba(255,248,240,.26),rgba(180,198,238,.5));
  backdrop-filter:blur(2px);pointer-events:auto}
.screen.off{display:none}
#title h1{font-family:var(--disp);font-size:clamp(46px,10vw,116px);font-weight:800;line-height:.86;
  letter-spacing:.01em;text-align:center;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 7px 0 rgba(74,63,92,.35),0 16px 34px rgba(74,63,92,.3)}
#title h1 em{display:block;font-style:normal;
  background:linear-gradient(180deg,#ffd9e6,#ffb7c5 45%,#f79ec0);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 var(--ink))}
#title .sub{margin-top:14px;font-family:var(--disp);font-size:clamp(13px,2vw,18px);letter-spacing:.34em;
  text-transform:uppercase;color:var(--ink);opacity:.8}
#play{margin-top:30px;pointer-events:auto;cursor:pointer;border:none;
  font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:.08em;color:var(--ink);
  padding:15px 52px 17px;border:3px solid var(--ink);border-radius:22px;
  background:linear-gradient(180deg,#fff2c9,#ffe08a);box-shadow:0 6px 0 var(--ink),0 12px 26px rgba(74,63,92,.28);
  transition:transform .09s,box-shadow .09s}
#play:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink),0 16px 30px rgba(74,63,92,.3)}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.keys{margin-top:26px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:640px}
.keys span{font-family:var(--disp);font-size:13px;font-weight:600;padding:6px 13px 7px;border:2.5px solid var(--ink);
  border-radius:11px;background:rgba(255,255,255,.72);box-shadow:0 3px 0 var(--ink)}
.keys span b{font-weight:800;color:#d4638f}

#dead .big{font-family:var(--disp);font-size:clamp(40px,8vw,84px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 28px rgba(74,63,92,.3)}
#dead .by{margin-top:8px;font-family:var(--disp);font-size:20px;font-weight:600;color:var(--ink)}
#dead .cd{margin-top:22px;font-family:var(--disp);font-size:58px;font-weight:800;color:#fff;
  text-shadow:0 4px 0 var(--ink)}

#over .big{font-family:var(--disp);font-size:clamp(40px,9vw,96px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 30px rgba(74,63,92,.3);text-align:center}
#over .rank{margin-top:16px;font-family:var(--disp);font-size:22px;font-weight:700;color:var(--ink)}

#hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-family:var(--disp);
  font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:0;
  padding:7px 18px 8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink)}

#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:linear-gradient(180deg,#ffe9f0,#d8e8fb)}
#loading .lt{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.2em;color:var(--ink)}
#loading .bar{width:230px;height:14px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
#loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd3b6,#ffb7c5,#d4c5f9)}
#loading.off{display:none}
#fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;max-width:70vw;
  padding:18px 22px;font-family:var(--ui);font-size:14px;line-height:1.5;display:none;white-space:pre-wrap}
</style>
<body>
<div id="vig"></div><div id="dmg"></div><div id="heal"></div>

<div id="hud" class="hide">
  <div id="top">
    <div class="box panel"><div class="k">Score</div><div class="v" id="tScore">0</div></div>
    <div class="box panel"><div class="k">Leader</div><div class="v lead" id="tLead">—</div></div>
    <div class="box panel"><div class="k">Target</div><div class="v" id="tGoal">25</div></div>
  </div>

  <div id="feed"></div>
  <div id="floaters"></div>

  <div id="vitals" class="panel">
    <div class="lbl">Vitality</div>
    <div id="hpwrap"><div id="hpbar"></div><div id="hpnum">100</div></div>
  </div>

  <div id="ammo" class="panel">
    <div id="wname">BUBBLEGUN</div>
    <div id="acount">30<small>/90</small></div>
    <div id="reloading"></div>
    <div id="wslots"><div class="on">1</div><div>2</div><div>3</div></div>
  </div>

  <div id="hint"></div>

  <div id="board" class="panel">
    <h3>FREE FOR ALL</h3>
    <table><thead><tr><th>Player</th><th>Kills</th><th>Deaths</th><th>Streak</th></tr></thead>
    <tbody id="boardBody"></tbody></table>
  </div>
</div>

<div id="cross"><i class="dot"></i><i class="t" id="cU"></i><i class="t" id="cD"></i><i class="h" id="cL"></i><i class="h" id="cR"></i></div>
<div id="hitmark"><span style="transform:rotate(45deg)"></span><span style="transform:rotate(-45deg)"></span></div>

<div class="screen" id="title">
  <h1>PASTEL<em>NUKETOWN</em></h1>
  <div class="sub">Free&nbsp;For&nbsp;All</div>
  <button id="play">PLAY</button>
  <div class="keys">
    <span><b>WASD</b> move</span><span><b>SHIFT</b> sprint</span><span><b>SPACE</b> jump</span>
    <span><b>MOUSE</b> aim</span><span><b>CLICK</b> shoot</span><span><b>R</b> reload</span>
    <span><b>1 2 3</b> weapons</span><span><b>TAB</b> scores</span><span><b>ESC</b> pause</span>
  </div>
</div>

<div class="screen off" id="dead">
  <div class="big">DOWN!</div>
  <div class="by" id="deadBy"></div>
  <div class="cd" id="deadCd">3</div>
</div>

<div class="screen off" id="over">
  <div class="big" id="overBig">MATCH OVER</div>
  <div class="rank" id="overRank"></div>
  <button id="again" style="margin-top:28px;pointer-events:auto;cursor:pointer;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--ink);padding:13px 42px 15px;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(180deg,#d9f7e6,#b8f2d8);box-shadow:0 6px 0 var(--ink)">REMATCH</button>
</div>

<div id="loading"><div class="lt">WARMING UP THE PASTELS</div><div class="bar"><i id="lbar"></i></div></div>
<div id="fatal" class="panel"></div>

<script>/* ===== mapspec.js ===== */
/* =====================================================================
   PASTEL NUKETOWN — SHARED MAP SPEC  (contract file; do not restructure)
   =====================================================================
   Consumed by BOTH:
     - index.html   (renderer + engine)   -> globalThis.NUKETOWN_MAP
     - bots.js      (nav + AI)            -> require('./mapspec.js')

   COORDINATES
     Y is up, meters. Street runs along X. Map is 180deg-rotationally
     symmetric about the origin (classic Nuketown): House A sits north
     (-Z), House B south (+Z); bus at the west end, truck at the east.

     x in [-30, 30]   long axis (street)
     z in [-20, 20]   short axis
     y = 0 ground, 3.3 = upper floor, 6.6 = roof top

   DATA
     solids    [{min:[x,y,z], max:[x,y,z], mat, house?}]  block movement
     platforms [{min:[x,z], max:[x,z], y}]                walkable tops
     links     [{a:[x,y,z], b:[x,y,z], w}]                stairs (2-way)
     spawns    [{x,y,z,yaw}]
     bounds    {minX,maxX,minZ,maxZ}
   ===================================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.NUKETOWN_MAP = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const W = 0.3;      // wall thickness
  const H0 = 3.0;     // ground-floor ceiling height
  const SLAB = 0.3;   // floor slab thickness
  const F1 = H0 + SLAB;   // 3.3 upper floor level
  const H1 = 6.3;     // upper ceiling
  const ROOF = 6.6;

  const solids = [];
  const platforms = [];
  const links = [];
  const spawns = [];

  // --- emit helpers ---------------------------------------------------
  // s = +1 -> House A (north).  s = -1 -> House B (south), mirrored
  // through the origin, which is exactly Nuketown's rotational symmetry.
  function box(s, x0, y0, z0, x1, y1, z1, mat, house) {
    const ax = s > 0 ? x0 : -x1, bx = s > 0 ? x1 : -x0;
    const az = s > 0 ? z0 : -z1, bz = s > 0 ? z1 : -z0;
    solids.push({
      min: [ax, y0, az], max: [bx, y1, bz],
      mat: mat || 'wall', house: house || null
    });
  }
  function plat(s, x0, z0, x1, z1, y) {
    const ax = s > 0 ? x0 : -x1, bx = s > 0 ? x1 : -x0;
    const az = s > 0 ? z0 : -z1, bz = s > 0 ? z1 : -z0;
    platforms.push({ min: [ax, az], max: [bx, bz], y: y });
  }
  function link(s, ax, ay, az, bx, by, bz, w) {
    links.push({
      a: [s > 0 ? ax : -ax, ay, s > 0 ? az : -az],
      b: [s > 0 ? bx : -bx, by, s > 0 ? bz : -bz],
      w: w || 1.6
    });
  }

  /* =====================================================================
     HOUSE  (footprint x[-12,4]  z[-18,-7];  front wall faces the street)
     ===================================================================== */
  function buildHouse(s) {
    const hc = s > 0 ? 'A' : 'B';
    const X0 = -12, X1 = 4, ZB = -18, ZF = -7;   // back / front

    // ---- ground floor shell (y 0..H0) ----
    // front (street-facing) wall, door gap x[-5.5,-3.5]
    box(s, X0, 0, ZF - W, -5.5, H0, ZF, 'house', hc);
    box(s, -3.5, 0, ZF - W, X1, H0, ZF, 'house', hc);
    box(s, -5.5, 2.25, ZF - W, -3.5, H0, ZF, 'house', hc);   // door header
    // back wall, door gap x[-1.5,0.5]
    box(s, X0, 0, ZB, -1.5, H0, ZB + W, 'house', hc);
    box(s, 0.5, 0, ZB, X1, H0, ZB + W, 'house', hc);
    box(s, -1.5, 2.25, ZB, 0.5, H0, ZB + W, 'house', hc);
    // west wall, side opening z[-13.5,-11.5]
    box(s, X0, 0, ZB, X0 + W, H0, -13.5, 'house', hc);
    box(s, X0, 0, -11.5, X0 + W, H0, ZF, 'house', hc);
    box(s, X0, 2.25, -13.5, X0 + W, H0, -11.5, 'house', hc);
    // east wall solid
    box(s, X1 - W, 0, ZB, X1, H0, ZF, 'house', hc);
    // interior dividers
    box(s, -5.5, 0, ZB, -5.2, H0, -12.5, 'trim', hc);
    box(s, -5.5, 0, -12.8, -1.0, H0, -12.5, 'trim', hc);

    // ---- staircase: rises along -Z, bottom z=-12.5 -> top z=-16.2 ----
    const SX0 = 1.6, SX1 = 3.7, STEPS = 9;
    const sz0 = -12.5, sz1 = -16.2;
    for (let i = 0; i < STEPS; i++) {
      const za = sz0 + (sz1 - sz0) * (i / STEPS);
      const zb = sz0 + (sz1 - sz0) * ((i + 1) / STEPS);
      const top = F1 * ((i + 1) / STEPS);
      box(s, SX0, 0, Math.min(za, zb), SX1, top, Math.max(za, zb), 'stair', hc);
    }
    link(s, (SX0 + SX1) / 2, 0, -11.9, (SX0 + SX1) / 2, F1, -16.8, 1.8);

    // ---- upper floor slab (hole over the stairwell) ----
    box(s, X0, H0, ZB, SX0, F1, ZF, 'slab', hc);
    box(s, SX0, H0, ZB, X1, F1, sz1, 'slab', hc);
    box(s, SX0, H0, sz0, X1, F1, ZF, 'slab', hc);
    plat(s, X0, ZB, SX0, ZF, F1);
    plat(s, SX0, ZB, X1, sz1, F1);
    plat(s, SX0, sz0, X1, ZF, F1);

    // ---- upper floor shell (y F1..H1) ----
    // front wall, balcony doorway gap x[-9,-1]
    box(s, X0, F1, ZF - W, -9, H1, ZF, 'house', hc);
    box(s, -1, F1, ZF - W, X1, H1, ZF, 'house', hc);
    box(s, -9, F1 + 2.25, ZF - W, -1, H1, ZF, 'house', hc);
    // back wall with a drop-out window gap x[-6,-3] (jump down to alley)
    box(s, X0, F1, ZB, -6, H1, ZB + W, 'house', hc);
    box(s, -3, F1, ZB, X1, H1, ZB + W, 'house', hc);
    box(s, -6, F1 + 1.9, ZB, -3, H1, ZB + W, 'house', hc);
    // west wall, upper opening z[-14,-12]
    box(s, X0, F1, ZB, X0 + W, H1, -14, 'house', hc);
    box(s, X0, F1, -12, X0 + W, H1, ZF, 'house', hc);
    box(s, X0, F1 + 1.9, -14, X0 + W, H1, -12, 'house', hc);
    // east wall solid
    box(s, X1 - W, F1, ZB, X1, H1, ZF, 'house', hc);
    // upper divider
    box(s, -4.0, F1, ZB, -3.7, H1, -13.0, 'trim', hc);

    // ---- roof ----
    box(s, X0, H1, ZB, X1, ROOF, ZF, 'roof', hc);

    /* ---- porch + balcony ----------------------------------------------

        cursor = parent[cursor];
      }
      if (ids[ids.length - 1] !== startId) return [waypoint(startId, null)];
      ids.reverse();
      return smoothPath(ids);
    }

    function isSegmentTraversable(a, b) {
      if (!a || !b) return false;
      if (a.level === b.level) return lineWalkable(a, b);
      const from = typeof a.nodeId === 'number' ? a.nodeId : nearest(a.x, a.y, a.z);
      const to = typeof b.nodeId === 'number' ? b.nodeId : nearest(b.x, b.y, b.z);
      return !!findEdge(from, to);
    }

    const nav = {
      cellSize: cellSize,
      width: width,
      height: height,
      levels: map.levels.slice(),
      bounds: bounds,
      actor: {
        radius: map.actor.radius,
        height: map.actor.height,
        eye: map.actor.eye,
        step: map.actor.step
      },
      nodes: nodes,
      grid: grid,
      dropEdgeCount: dropEdgeCount,
      nearest: nearest,
      findPath: findPath,
      lineWalkable: lineWalkable,
      isSegmentTraversable: isSegmentTraversable,
      nodeAt: function nodeAt(level, gx, gz) {
        if (level < 0 || level >= levelCount || gx < 0 || gx >= width || gz < 0 || gz >= height) return -1;
        return grid[index(level, gx, gz)];
      }
    };
    return nav;
  }

  function createBrain(options) {
    options = options || {};
    const id = options.id == null ? 0 : options.id;
    const skillName = SKILLS[options.skill] ? options.skill : 'normal';
    const random = makeRng((Number(options.seed) || 1) ^ Math.imul(Number(id) || 0, 0x9e3779b1));
    return {
      id: id,
      skill: skillName,
      state: 'spawn',
      stateSince: 0,
      targetId: null,
      targetSeenAt: -Infinity,
      acquiredAt: -Infinity,
      lastKnown: null,
      aimYaw: 0,
      aimPitch: 0,
      initializedAim: false,
      path: [],
      pathIndex: 0,
      goal: null,
      goalKind: null,
      nextTargetEval: (hashSeed(id) % 12) * 0.01,
      targetScan: 0,
      nextDecision: 0,
      visibility: new Map(),
      strafeSign: random() < 0.5 ? -1 : 1,
      nextStrafe: 0,
      burstUntil: 0,
      pauseUntil: 0,
      progressPos: null,
      progressAt: 0,
      wasTryingMove: false,
      stuckAttempts: 0,
      escapeUntil: 0,
      escapeAngle: random() * TAU,
      patrolCount: 0,
      stateChanges: 0,
      phase: random() * TAU,
      phase2: random() * TAU,
      rand: random
    };
  }

  function setState(brain, state, now) {
    if (brain.state === state) return;
    brain.state = state;
    brain.stateSince = now;
    brain.stateChanges++;
  }

  function actorEyeY(nav, actor) {
    return finite(actor.pos && actor.pos.y, 0) + (nav.actor ? nav.actor.eye : 1.62);
  }

  function safeCanSee(view, a, b) {
    if (typeof view.canSee !== 'function') return false;
    try {
      return !!view.canSee(
        finite(a.x, 0), finite(a.y, 0), finite(a.z, 0),
        finite(b.x, 0), finite(b.y, 0), finite(b.z, 0)
      );
    } catch (_) {
      return false;
    }
  }

  function cachedVisibility(brain, view, actor, now, forceFresh) {
    const cached = brain.visibility.get(actor.id);
    const ttl = 0.12 + ((hashSeed(brain.id) & 31) / 1000);
    if (!forceFresh && cached && now - cached.at < ttl) return cached.visible;
    const nav = view.nav;
    const self = view.self;
    const from = {
      x: finite(self.pos && self.pos.x, 0),
      y: actorEyeY(nav, self),
      z: finite(self.pos && self.pos.z, 0)
    };
    const to = {
      x: finite(actor.pos && actor.pos.x, 0),
      y: actorEyeY(nav, actor),
      z: finite(actor.pos && actor.pos.z, 0)
    };
    const visible = safeCanSee(view, from, to);
    brain.visibility.set(actor.id, { visible: visible, at: now });
    return visible;
  }

  function livingActors(view) {
    return Array.isArray(view.actors) ? view.actors : [];
  }

  function findActor(view, id) {
    const actors = livingActors(view);
    for (let i = 0; i < actors.length; i++) {
      if (actors[i] && actors[i].id === id && actors[i].alive !== false &&
          finite(actors[i].health, 1) > 0 && actors[i].pos) return actors[i];
    }
    return null;
  }

  function evaluateTarget(brain, view, now) {
    const actors = livingActors(view);
    const selfPos = view.self.pos || { x: 0, y: 0, z: 0 };
    const candidates = [];
    for (let i = 0; i < actors.length; i++) {
      const actor = actors[i];
      if (!actor || actor.id === view.self.id || actor.alive === false ||
          finite(actor.health, 1) <= 0 || !actor.pos) continue;
      candidates.push({ actor: actor, d2: distSq3(selfPos, actor.pos) });
    }
    candidates.sort(function byDistance(a, b) { return a.d2 - b.d2; });

    const current = findActor(view, brain.targetId);
    let currentVisible = false;
    let currentD2 = Infinity;
    if (current) {
      currentD2 = distSq3(selfPos, current.pos);
      currentVisible = cachedVisibility(brain, view, current, now, false);
      if (currentVisible) {
        brain.targetSeenAt = now;
        brain.lastKnown = {
          x: finite(current.pos.x, 0), y: finite(current.pos.y, 0), z: finite(current.pos.z, 0)
        };
      }
    }

    let best = currentVisible ? current : null;
    let bestD2 = currentVisible ? currentD2 : Infinity;
    const checks = Math.min(candidates.length, 4);
    for (let i = 0; i < checks; i++) {
      const candidateIndex = (brain.targetScan + i) % Math.max(1, candidates.length);
      const actor = candidates[candidateIndex].actor;
      if (current && actor.id === current.id) continue;
      if (!cachedVisibility(brain, view, actor, now, false)) continue;
      const d2 = candidates[candidateIndex].d2;
      if (!best || d2 < bestD2 * 0.58) {
        best = actor;
        bestD2 = d2;
      }
    }
    if (candidates.length) brain.targetScan = (brain.targetScan + checks) % candidates.length;

    if (best && best.id !== brain.targetId) {
      brain.targetId = best.id;
      brain.acquiredAt = now;
      brain.targetSeenAt = now;
      brain.lastKnown = {
        x: finite(best.pos.x, 0), y: finite(best.pos.y, 0), z: finite(best.pos.z, 0)
      };
      brain.burstUntil = 0;
      brain.pauseUntil = 0;
    } else if (!best && (!current || now - brain.targetSeenAt > 3.6)) {
      brain.targetId = null;
    }
  }

  function chooseNodeGoal(brain, nav, selfPos, kind, threatPos) {
    if (!nav || !nav.nodes || nav.nodes.length === 0) return null;
    const currentId = nav.nearest(selfPos.x, selfPos.y, selfPos.z);
    const current = nav.nodes[currentId] || nav.nodes[0];
    let best = null;
    let bestScore = -Infinity;
    const count = nav.nodes.length;
    const samples = Math.min(56, count);
    const wantUpper = kind === 'patrol' &&
      ((brain.patrolCount + (hashSeed(brain.id) & 1)) % 3 === 1);
    for (let i = 0; i < samples; i++) {
      const idx = Math.floor(brain.rand() * count);
      const n = nav.nodes[idx];
      if (!n) continue;
      if (kind === 'reposition' && current.level === 0 && n.level === 0) continue;
      const travel = Math.hypot(n.x - current.x, n.z - current.z);
      if (travel < 5.0) continue;
      let score = travel * 0.18 + brain.rand() * 2.0;
      if (kind === 'patrol') {
        if (wantUpper === (n.level > 0)) score += 12;
        if (travel > 12 && travel < 31) score += 5;
      } else if (threatPos) {
        const threatDistance = Math.hypot(n.x - threatPos.x, n.z - threatPos.z);
        const curThreat = Math.hypot(current.x - threatPos.x, current.z - threatPos.z);
        const awayX = current.x - threatPos.x;
        const awayZ = current.z - threatPos.z;
        const candidateX = n.x - current.x;
        const candidateZ = n.z - current.z;
        const directional = (awayX * candidateX + awayZ * candidateZ) /
          Math.max(1, Math.hypot(awayX, awayZ) * Math.hypot(candidateX, candidateZ));
        score += threatDistance * (kind === 'retreat' ? 2.4 : 0.7) +
          directional * (kind === 'retreat' ? 10 : 3);
        score += finite(n.cover, 0) * (kind === 'retreat' ? 10 : 7);
        if (kind === 'reposition' && threatDistance > 7 && threatDistance < 18) score += 7;
        if (n.level !== current.level) {
          score += kind === 'retreat' ? 25 - travel * 0.65 : 32 - travel * 0.9;
        }
        if (threatDistance < curThreat - 2) score -= 12;
      }
      if (score > bestScore) {
        bestScore = score;
        best = { x: n.x, y: n.y, z: n.z, nodeId: n.id };
      }
    }
    if (!best) {
      const n = nav.nodes[Math.floor(brain.rand() * count)] || current;
      best = { x: n.x, y: n.y, z: n.z, nodeId: n.id };
    }
    return best;
  }

  function setGoal(brain, goal, kind) {
    brain.goal = goal;
    brain.goalKind = kind;
    brain.path = [];
    brain.pathIndex = 0;
  }

  function ensurePath(brain, view, goal) {
    const nav = view.nav;
    if (!nav || typeof nav.findPath !== 'function' || !goal) return;
    const selfPos = view.self.pos || { x: 0, y: 0, z: 0 };
    const movedGoal = !brain.goal || dist2D(brain.goal, goal) > 2.5 ||
      Math.abs(finite(brain.goal.y, 0) - finite(goal.y, 0)) > 1.5;
    if (movedGoal) {
      brain.goal = { x: goal.x, y: goal.y, z: goal.z, nodeId: goal.nodeId };
      brain.path = [];
      brain.pathIndex = 0;
    }
    if (brain.path.length && brain.pathIndex < brain.path.length) return;
    brain.path = nav.findPath(selfPos, goal, 900);
    brain.pathIndex = 0;
    while (brain.pathIndex < brain.path.length &&
      dist2D(selfPos, brain.path[brain.pathIndex]) < 0.65 &&
      Math.abs(finite(selfPos.y, 0) - brain.path[brain.pathIndex].y) < 1.0) {
      brain.pathIndex++;
    }
  }

  function followPath(brain, view) {
    const pos = view.self.pos || { x: 0, y: 0, z: 0 };
    while (brain.pathIndex < brain.path.length) {
      const waypoint = brain.path[brain.pathIndex];
      const horizontal = dist2D(pos, waypoint);
      const vertical = Math.abs(finite(pos.y, 0) - finite(waypoint.y, 0));
      if (horizontal < 0.52 && (vertical < 0.85 || waypoint.via === 'stair' || waypoint.via === 'drop')) {
        brain.pathIndex++;
      } else {
        break;
      }
    }
    if (brain.pathIndex >= brain.path.length) return { x: 0, z: 0, jump: false };
    const wp = brain.path[brain.pathIndex];
    const dx = wp.x - finite(pos.x, 0);
    const dz = wp.z - finite(pos.z, 0);
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) return { x: 0, z: 0, jump: false };
    return {
      x: dx / len,
      z: dz / len,
      jump: wp.via === 'drop' || (wp.via === 'stair' && wp.y > finite(pos.y, 0) + 0.6)
    };
  }

  function updateUnstuck(brain, view, now) {
    const pos = view.self.pos || { x: 0, y: 0, z: 0 };
    if (!brain.progressPos) {
      brain.progressPos = { x: finite(pos.x, 0), z: finite(pos.z, 0) };
      brain.progressAt = now;
      return;
    }
    if (!brain.wasTryingMove) {
      brain.progressPos.x = finite(pos.x, 0);
      brain.progressPos.z = finite(pos.z, 0);
      brain.progressAt = now;
      return;
    }
    if (now - brain.progressAt < 1.2) return;
    const moved = Math.hypot(
      finite(pos.x, 0) - brain.progressPos.x,
      finite(pos.z, 0) - brain.progressPos.z
    );
    if (moved < 0.35) {
      brain.stuckAttempts++;
      brain.path = [];
      brain.pathIndex = 0;
      brain.escapeUntil = now + 0.7;
      brain.escapeAngle = angleWrap(brain.escapeAngle + 1.9 + brain.rand() * 1.5);
      if (brain.stuckAttempts >= 2) {
        brain.goal = null;
        brain.goalKind = null;
        brain.lastKnown = null;
        brain.nextDecision = 0;
        brain.stuckAttempts = 0;
      }
    } else {
      brain.stuckAttempts = 0;
    }
    brain.progressPos.x = finite(pos.x, 0);
    brain.progressPos.z = finite(pos.z, 0);
    brain.progressAt = now;
  }

  function updateAim(brain, view, target, visible, now, dt) {
    const nav = view.nav || { actor: { eye: 1.62 } };
    const self = view.self;
    const skill = SKILLS[brain.skill];
    if (!brain.initializedAim) {
      brain.aimYaw = finite(self.yaw, 0);
      brain.aimPitch = finite(self.pitch, 0);
      brain.initializedAim = true;
    }
    let desiredYaw = brain.aimYaw;
    let desiredPitch = brain.aimPitch;
    if (target && target.pos && now - brain.acquiredAt >= skill.reaction) {
      const tracked = Math.max(0, now - brain.acquiredAt - skill.reaction);
      const lead = skill.lead;
      const tx = finite(target.pos.x, 0) + finite(target.vel && target.vel.x, 0) * lead;
      const ty = actorEyeY(nav, target) + finite(target.vel && target.vel.y, 0) * lead;
      const tz = finite(target.pos.z, 0) + finite(target.vel && target.vel.z, 0) * lead;
      const sx = finite(self.pos && self.pos.x, 0);
      const sy = actorEyeY(nav, self);
      const sz = finite(self.pos && self.pos.z, 0);
      const dx = tx - sx;
      const dy = ty - sy;
      const dz = tz - sz;
      const horizontal = Math.max(0.001, Math.hypot(dx, dz));
      const shrink = Math.exp(-tracked / skill.settle);
      const error = skill.minError + skill.error * shrink;
      const wanderYaw = Math.sin(now * 1.73 + brain.phase) * error +
        Math.sin(now * 0.57 + brain.phase2) * error * 0.35;
      const wanderPitch = Math.sin(now * 1.31 + brain.phase2) * error * 0.58;
      desiredYaw = Math.atan2(dz, dx) + wanderYaw;
      desiredPitch = Math.atan2(dy, horizontal) + wanderPitch;
    } else if (!target || !visible) {
      desiredYaw = angleWrap(finite(self.yaw, brain.aimYaw) +
        Math.sin(now * 0.45 + brain.phase) * 0.18);
      desiredPitch = clamp(finite(self.pitch, brain.aimPitch) * 0.8, -0.45, 0.45);
    }
    const maxStep = skill.turn * dt;
    brain.aimYaw = slewAngle(brain.aimYaw, desiredYaw, maxStep);
    brain.aimPitch += clamp(desiredPitch - brain.aimPitch, -maxStep, maxStep);
    brain.aimPitch = clamp(finite(brain.aimPitch, 0), -1.5, 1.5);
  }

  function aimErrorToTarget(brain, view, target) {
    if (!target || !target.pos) return Infinity;
    const nav = view.nav || { actor: { eye: 1.62 } };
    const sx = finite(view.self.pos && view.self.pos.x, 0);
    const sy = actorEyeY(nav, view.self);
    const sz = finite(view.self.pos && view.self.pos.z, 0);
    const dx = finite(target.pos.x, 0) - sx;
    const dy = actorEyeY(nav, target) - sy;
    const dz = finite(target.pos.z, 0) - sz;
    const yaw = Math.atan2(dz, dx);
    const pitch = Math.atan2(dy, Math.max(0.001, Math.hypot(dx, dz)));
    return Math.hypot(angleDelta(yaw, brain.aimYaw), pitch - brain.aimPitch);
  }

  function burstAllowsFire(brain, now) {
    const skill = SKILLS[brain.skill];
    if (now < brain.pauseUntil) return false;
    if (now >= brain.burstUntil) {
      brain.burstUntil = now + skill.burstMin + brain.rand() * (skill.burstMax - skill.burstMin);
      brain.pauseUntil = brain.burstUntil + skill.pauseMin +
        brain.rand() * (skill.pauseMax - skill.pauseMin);
    }
    return now < brain.burstUntil;
  }

  function normalizedIntent(intent, brain) {
    return {
      moveX: clamp(finite(intent.moveX, 0), -1, 1),
      moveZ: clamp(finite(intent.moveZ, 0), -1, 1),
      jump: !!intent.jump,
      aimYaw: angleWrap(finite(intent.aimYaw, brain.aimYaw || 0)),
      aimPitch: clamp(finite(intent.aimPitch, brain.aimPitch || 0), -1.5, 1.5),
      fire: !!intent.fire,
      reload: !!intent.reload,
      targetId: intent.targetId == null ? null : intent.targetId,
      state: typeof intent.state === 'string' ? intent.state : 'patrol'
    };
  }

  function think(brain, view, dt) {
    if (!brain || !view || !view.self) {
      const fallbackBrain = brain || { aimYaw: 0, aimPitch: 0 };
      return normalizedIntent({
        moveX: 0, moveZ: 0, jump: false, aimYaw: 0, aimPitch: 0,
        fire: false, reload: false, targetId: null, state: 'spawn'
      }, fallbackBrain);
    }
    dt = clamp(finite(dt, 1 / 60), 0.001, 0.25);
    const now = finite(view.time, 0);
    const nav = view.nav;
    const self = view.self.pos ? view.self : Object.assign({}, view.self, {
      pos: { x: 0, y: 0, z: 0 }
    });

    updateUnstuck(brain, view, now);

    if (brain.nextTargetEval <= now) {
      evaluateTarget(brain, view, now);
      brain.nextTargetEval = now + 0.13 + ((hashSeed(brain.id) & 15) / 500);
    } else if (brain.targetId != null && !findActor(view, brain.targetId) &&
      now - brain.targetSeenAt > 3.6) {
      brain.targetId = null;
    }

    const target = findActor(view, brain.targetId);
    let visible = false;
    if (target) {
      visible = cachedVisibility(brain, view, target, now, false);
      if (visible) {
        brain.targetSeenAt = now;
        brain.lastKnown = {
          x: finite(target.pos.x, 0), y: finite(target.pos.y, 0), z: finite(target.pos.z, 0)
        };
      }
    }

    const healthRatio = finite(self.maxHealth, 100) > 0 ?
      finite(self.health, 0) / finite(self.maxHealth, 100) : 0;
    const ammo = Math.max(0, finite(self.ammo, 0));
    const magSize = Math.max(1, finite(self.magSize, 1));
    const reserve = Math.max(0, finite(self.reserve, 0));
    const inContact = !!target && (visible || now - brain.targetSeenAt < 1.0);
    let reload = false;

    if (brain.state === 'spawn' && now - brain.stateSince > 0.18) {
      setState(brain, 'patrol', now);
    }
    if (self.reloading) {
      setState(brain, 'reload', now);
    } else if (ammo <= 0 && reserve > 0) {
      reload = true;
      setState(brain, 'reload', now);
    } else if (!inContact && reserve > 0 && ammo < magSize * 0.48) {
      reload = true;
      setState(brain, 'reload', now);
    } else if (target && healthRatio < 0.25) {
      setState(brain, 'retreat', now);
    } else if (brain.state === 'reposition' && brain.goal &&
      dist2D(self.pos, brain.goal) >= 1.0 && now - brain.stateSince < 12.0) {
      // Commit long enough to actually reach cover or change floors instead of
      // oscillating back to engage as the range changes by a few centimetres.
    } else if (target && visible) {
      const range = dist2D(self.pos, target.pos);
      if (healthRatio < 0.62 || range < SKILLS[brain.skill].preferred * 0.45) {
        setState(brain, 'reposition', now);
      } else {
        setState(brain, 'engage', now);
      }
    } else if (target && brain.lastKnown && now - brain.targetSeenAt <= 3.6) {
      setState(brain, 'hunt', now);
    } else if (brain.state === 'reload' && !self.reloading && !reload) {
      setState(brain, 'patrol', now);
    } else if (brain.state !== 'patrol' && brain.state !== 'spawn') {
      setState(brain, 'patrol', now);
    }

    let movement = { x: 0, z: 0, jump: false };
    const movingState = MOVING_STATES.has(brain.state);
    if (now < brain.escapeUntil) {
      movement.x = Math.cos(brain.escapeAngle);
      movement.z = Math.sin(brain.escapeAngle);
      movement.jump = true;
    } else if (brain.state === 'engage' && target) {
      if (now >= brain.nextStrafe) {
        if (brain.rand() < 0.7) brain.strafeSign *= -1;
        brain.nextStrafe = now + 0.65 + brain.rand() * 1.0;
      }
      const dx = finite(target.pos.x, 0) - finite(self.pos.x, 0);
      const dz = finite(target.pos.z, 0) - finite(self.pos.z, 0);
      const range = Math.max(0.001, Math.hypot(dx, dz));
      const ux = dx / range;
      const uz = dz / range;
      const radial = clamp((range - SKILLS[brain.skill].preferred) / 5.0, -0.62, 0.42);
      movement.x = -uz * brain.strafeSign * 0.92 + ux * radial;
      movement.z = ux * brain.strafeSign * 0.92 + uz * radial;
    } else if (brain.state === 'hunt' && brain.lastKnown) {
      const huntGoal = brain.lastKnown;
      ensurePath(brain, view, huntGoal);
      movement = followPath(brain, view);
      if (dist2D(self.pos, huntGoal) < 1.2) {
        brain.targetId = null;
        brain.lastKnown = null;
        setState(brain, 'patrol', now);
      }
    } else if ((brain.state === 'retreat' || brain.state === 'reposition') &&
      (target || brain.goal)) {
      if (target && (!brain.goal || brain.goalKind !== brain.state ||
          dist2D(self.pos, brain.goal) < 1.0)) {
        setGoal(brain, chooseNodeGoal(brain, nav, self.pos, brain.state, target.pos), brain.state);
        brain.nextDecision = now + (brain.state === 'retreat' ? 2.2 : 1.7);
      }
      ensurePath(brain, view, brain.goal);
      movement = followPath(brain, view);
    } else if (brain.state === 'patrol' || brain.state === 'spawn') {
      if (!brain.goal || brain.goalKind !== 'patrol' ||
          brain.pathIndex >= brain.path.length || dist2D(self.pos, brain.goal) < 1.0) {
        brain.patrolCount++;
        setGoal(brain, chooseNodeGoal(brain, nav, self.pos, 'patrol', null), 'patrol');
      }
      ensurePath(brain, view, brain.goal);
      movement = followPath(brain, view);
    }

    if (brain.state === 'reload' && target && visible) {
      const dx = finite(self.pos.x, 0) - finite(target.pos.x, 0);
      const dz = finite(self.pos.z, 0) - finite(target.pos.z, 0);
      const len = Math.max(0.001, Math.hypot(dx, dz));
      movement = { x: dx / len, z: dz / len, jump: false };
    }

    updateAim(brain, view, target, visible, now, dt);
    let fire = false;
    if (target && visible && ammo > 0 && !self.reloading &&
        now - brain.acquiredAt >= SKILLS[brain.skill].reaction &&
        aimErrorToTarget(brain, view, target) <= SKILLS[brain.skill].cone &&
        burstAllowsFire(brain, now)) {
      fire = true;
    }

    brain.wasTryingMove = movingState &&
      Math.hypot(finite(movement.x, 0), finite(movement.z, 0)) > 0.25;
    return normalizedIntent({
      moveX: movement.x,
      moveZ: movement.z,
      jump: movement.jump,
      aimYaw: brain.aimYaw,
      aimPitch: brain.aimPitch,
      fire: fire,
      reload: reload,
      targetId: target ? target.id : null,
      state: brain.state
    }, brain);
  }

  return {
    buildNav: buildNav,
    createBrain: createBrain,
    think: think
  };
});
</script>

   PASTEL NUKETOWN — core: palette, math, geometry builder, sky, lights
   ===================================================================== */
'use strict';

const MAP = globalThis.NUKETOWN_MAP;
const AI  = globalThis.NUKETOWN_AI;

const QS = new URLSearchParams(location.search);
const AUTOSTART = QS.has('autostart');

/* ---------- fatal error surface (a blank pastel screen tells us nothing) */
function fatal(msg) {
  const el = document.getElementById('fatal');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = 'ERROR\n\n' + msg;
  const l = document.getElementById('loading'); if (l) l.classList.add('off');

window.addEventListener('error', e => fatal((e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '')));

/* ---------- math ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const TAU = Math.PI * 2;
function angDelta(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

// exponential smoothing that is correct for a variable timestep
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

/* deterministic PRNG so a replayed match looks the same */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xC0FFEE);
const rand  = (a, b) => a + (b - a) * rng();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length) % arr.length];

/* ---------- colour ---------- *
   Renderer output is sRGB, but r128 does no automatic colour management,
   so every authored hex must be converted to linear exactly once. C() is
   the single door — never hand a raw hex to a material or vertex colour. */
const _ctmp = new THREE.Color();
function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function Cx(hex, mulR, mulG, mulB) {
  const c = C(hex);
  c.r *= mulR; c.g *= (mulG === undefined ? mulR : mulG); c.b *= (mulB === undefined ? mulR : mulB);
  return c;
}

const PAL = {
  ink:      0x4a3f5c,
  cream:    0xfff8f0,
  sand:     0xf6e2c0,
  sandDeep: 0xecd0a6,
  road:     0xcdc6dd,
  roadLine: 0xfff3c4,
  walk:     0xe6dff0,

  houseA:   0xffe9a8,   // butter yellow house  (north)
  houseAtrim:0xffc9d6,
  roofA:    0xff9aa2,   // coral roof
  houseB:   0xbfe3f5,   // sky-blue house       (south)
  houseBtrim:0xc8f2dc,
  roofB:    0xb6bef0,   // periwinkle roof

  slab:     0xf3e7dd,
  stair:    0xf0dfd2,
  post:     0xfff6ec,
  rail:     0xfff6ec,
  picket:   0xfffaf3,
  crate:    0xffd3b6,
  crateTop: 0xffe3cc,
  perimeter:0xdcd3e8,
  bus:      0xffe08a,
  busTrim:  0xffffff,
  truck:    0xff9ab0,
  glass:    0xd8f2ff,
  tyre:     0x8b7f9e,
  metal:    0xd7cfe4,
  mannequin:0xf5dff0,
  wood:     0xe8c9a8,
  leaf:     0xc9edd6,
  leaf2:    0xffd6e8
};

/* bot jersey colours — all pastel, all clearly separable at distance */
const BOT_COLORS = [
  { body: 0xffb7c5, trim: 0xff8fa8, name: 'Bubblegum' },
  { body: 0xa8dcf0, trim: 0x7cc6e6, name: 'Sky' },
  { body: 0xb8f2d8, trim: 0x86e0bb, name: 'Sherbet' },
  { body: 0xd4c5f9, trim: 0xb49ff0, name: 'Lilac' },
  { body: 0xffefa8, trim: 0xf7dc78, name: 'Butter' },
  { body: 0xffd3b6, trim: 0xffb894, name: 'Peach' },
  { body: 0xc9f0f7, trim: 0x99dee9, name: 'Frost' },
  { body: 0xf7c5e0, trim: 0xe89ec9, name: 'Taffy' },
  { body: 0xdff2b8, trim: 0xbfe08a, name: 'Pistachio' }
];
const PLAYER_COLOR = { body: 0xfff8f0, trim: 0xffc9d6, name: 'You' };

/* ---------------------------------------------------------------------
   YAW CONVENTIONS — these differ on purpose, so convert at the border.

     ENGINE yaw : 0 = +Z, forward = (sin y, cos y)
                  used by movement, bullets, the camera rig, the characters.
     CONTRACT yaw: 0 = +X, forward = (cos y, sin y)
                  declared by mapspec.js (spawn yaws) and therefore what
                  bots.js emits and expects.

   The two are a reflection of each other, so a single involution converts
   in both directions. Every crossing point calls this: respawnActor (spawn
   yaws in) and stepBot (bot aim out and back).
   --------------------------------------------------------------------- */
const yawFlip = y => Math.PI * 0.5 - y;

/* =====================================================================
   TOON MATERIAL
   Cel shading with a *lifted* shadow floor — the single most important
   trick for a pastel look. Shadows land around 62% brightness instead of
   0%, so nothing ever goes muddy. Falls back to Lambert if this build of
   three has no working MeshToonMaterial.
   ===================================================================== */
let TOON_OK = true;
function makeGradientMap(steps, floorV) {
  const d = new Uint8Array(steps);
  for (let i = 0; i < steps; i++) d[i] = Math.round(255 * lerp(floorV, 1.0, i / (steps - 1)));
  const t = new THREE.DataTexture(d, steps, 1, THREE.LuminanceFormat);
  t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
let GRAD = null;
try {
  if (typeof THREE.MeshToonMaterial !== 'function') throw new Error('no MeshToonMaterial');
  GRAD = makeGradientMap(4, 0.70);
} catch (e) { TOON_OK = false; }

function toonMat(opts) {
  opts = opts || {};
  const base = {
    color: opts.color !== undefined ? C(opts.color) : C(0xffffff),
    vertexColors: !!opts.vertexColors,
    transparent: !!opts.transparent,
    opacity: opts.opacity === undefined ? 1 : opts.opacity,
    side: opts.side || THREE.FrontSide,
    emissive: opts.emissive !== undefined ? C(opts.emissive) : C(0x000000)
  };
  if (opts.map) base.map = opts.map;
  if (TOON_OK) { base.gradientMap = GRAD; return new THREE.MeshToonMaterial(base); }
  return new THREE.MeshLambertMaterial(base);
}

/* =====================================================================
   GEOMETRY BUILDER
   Accumulates flat-shaded quads with per-vertex colour into ONE buffer,
   plus a parallel line buffer of the "inked" edges. The whole 110-box
   map then draws in two calls, which keeps it fast even under software
   rendering.
   ===================================================================== */
function GeoBuilder() {
  this.pos = []; this.nrm = []; this.col = [];
  this.epos = []; this.ecol = [];
}
GeoBuilder.prototype.quad = function (a, b, c, d, color, noEdge) {
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
  const vx = d[0] - a[0], vy = d[1] - a[1], vz = d[2] - a[2];
  let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  const P = this.pos, N = this.nrm, K = this.col;
  const tri = (p, q, r) => {
    P.push(p[0], p[1], p[2], q[0], q[1], q[2], r[0], r[1], r[2]);
    for (let i = 0; i < 3; i++) { N.push(nx, ny, nz); K.push(color.r, color.g, color.b); }
  };
  tri(a, b, c); tri(a, c, d);
  if (!noEdge) { this.edge(a, b); this.edge(b, c); this.edge(c, d); this.edge(d, a); }
};
GeoBuilder.prototype.edge = function (a, b, col) {
  const c = col || EDGE_COL;
  this.epos.push(a[0], a[1], a[2], b[0], b[1], b[2]);
  this.ecol.push(c.r, c.g, c.b, c.r, c.g, c.b);
};
GeoBuilder.prototype.tri = function (a, b, c, color, noEdge) {
  this.quad(a, b, c, c, color, true);
  if (!noEdge) { this.edge(a, b); this.edge(b, c); this.edge(c, a); }
};
/* axis-aligned box; `tint` darkens sides slightly so faces read apart even
   when the light is flat */
GeoBuilder.prototype.box = function (min, max, color, opt) {
  opt = opt || {};
  const [x0, y0, z0] = min, [x1, y1, z1] = max;
  const top = opt.top || color, sideC = opt.side || color, botC = opt.bottom || color;
  const ne = opt.noEdge;
  const skip = opt.skip || {};
  if (!skip.py) this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], top, ne);
  if (!skip.ny) this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], botC, ne);
  if (!skip.pz) this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], sideC, ne);
  if (!skip.nz) this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], sideC, ne);
  if (!skip.px) this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], sideC, ne);
  if (!skip.nx) this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], sideC, ne);

GeoBuilder.prototype.mesh = function (matOpts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(this.nrm, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(this.col, 3));
  g.computeBoundingSphere();
  const m = new THREE.Mesh(g, toonMat(Object.assign({ vertexColors: true }, matOpts || {})));
  m.castShadow = true; m.receiveShadow = true;
  return m;
};
GeoBuilder.prototype.lines = function (opacity) {
  if (!this.epos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.epos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(this.ecol, 3));
  g.computeBoundingSphere();
  const mat = new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true,
    opacity: opacity === undefined ? 0.5 : opacity, depthWrite: false
  });
  return new THREE.LineSegments(g, mat);
};
let EDGE_COL = C(0x6b5f80);

/* =====================================================================
   RENDERER / SCENE
   ===================================================================== */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);

let renderer, scene, camera, sunLight;
let SOFTWARE_GPU = false;

/* Which GPU are we on? This has to be answered BEFORE the real context is
   made, because `antialias` is baked in at creation and MSAA is the single
   most expensive thing you can ask a software rasteriser for. So probe with
   a throwaway context first. */
let GPU_NAME = '';
function detectSoftwareGPU() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    GPU_NAME = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return /swiftshader|llvmpipe|software|basic render/i.test(GPU_NAME);
  } catch (e) { return false; }
}

function initRenderer() {
  SOFTWARE_GPU = detectSoftwareGPU();

  renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: !SOFTWARE_GPU,          // MSAA is ~4x the fill cost in SwiftShader
    powerPreference: 'high-performance'
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(C(0xcfe8f5), 1);

  if (SOFTWARE_GPU) {
    /* Fill rate is the whole budget here. Render at ~0.6x and let the
       browser upscale — flat cel colours survive that far better than a
       detailed render would — and drop shadow mapping entirely, which
       costs a second full geometry pass plus PCF taps per lit pixel. */
    renderer.setPixelRatio(0.5);
    renderer.shadowMap.enabled = false;
  } else {
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(C(0xd7dcf2), 95, 250);

  camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.06, 400);
  camera.rotation.order = 'YXZ';

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);   // RES.scale is kept by setPixelRatio
  });
}

function initLights() {
  /* Two constraints pull against each other here:
       exterior total must stay near ~1.35 (no tone mapping in r128, so more
       than that clips the pale pastels to flat white), while interiors are
       lit by the hemisphere and fill ALONE and go muddy below ~0.8.
     Hence a hemisphere-heavy split: 0.68 + 0.15 indoors, +0.52 sun outdoors. */
  const hemi = new THREE.HemisphereLight(C(0xdcefff), C(0xffe0bd), 0.68);
  hemi.position.set(0, 40, 0);
  scene.add(hemi);

  sunLight = new THREE.DirectionalLight(C(0xfff4d9), 0.52);
  sunLight.position.set(-34, 46, 26);
  sunLight.castShadow = !SOFTWARE_GPU;
  const S = 2048;
  sunLight.shadow.mapSize.set(S, S);
  const c = sunLight.shadow.camera;
  c.left = -46; c.right = 46; c.top = 42; c.bottom = -42; c.near = 1; c.far = 130;
  c.updateProjectionMatrix();
  sunLight.shadow.bias = -0.0012;
  sunLight.shadow.normalBias = 0.035;
  scene.add(sunLight);
  scene.add(sunLight.target);
  sunLight.target.position.set(0, 0, 0);

  // cool bounce from the opposite side keeps shadowed faces pastel, not grey
  const fill = new THREE.DirectionalLight(C(0xcfd9ff), 0.15);
  fill.position.set(30, 18, -26);
  scene.add(fill);
}

/* =====================================================================
   SKY — gradient dome + soft sun bloom disc, drawn behind everything
   ===================================================================== */
const SKY_VS = `
varying vec3 vDir;
void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SKY_FS = `
varying vec3 vDir;
uniform vec3 cLow, cMid, cHigh, cSun;
uniform vec3 sunDir;
void main(){
  float h = clamp(vDir.y*0.5+0.5, 0.0, 1.0);
  // two-stage vertical ramp: horizon glow -> mid -> zenith
  vec3 col = mix(cLow, cMid, smoothstep(0.42, 0.56, h));
  col = mix(col, cHigh, smoothstep(0.55, 0.92, h));
  // warm band hugging the horizon
  col += cLow * 0.35 * pow(1.0 - abs(vDir.y), 14.0);
  // soft sun
  float d = max(dot(normalize(vDir), sunDir), 0.0);
  col += cSun * pow(d, 220.0) * 1.5;
  col += cSun * pow(d, 12.0) * 0.16;
  gl_FragColor = vec4(col, 1.0);
}`;

function buildSky() {
  const sunDir = sunLight.position.clone().normalize();
  const mat = new THREE.ShaderMaterial({
    vertexShader: SKY_VS, fragmentShader: SKY_FS,
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cLow:  { value: C(0xffdfd0) },   // peach horizon
      cMid:  { value: C(0xd9e4fb) },   // powder blue
      cHigh: { value: C(0xbcd0f7) },   // deeper blue zenith
      cSun:  { value: C(0xfff3d0) },
      sunDir: { value: sunDir }
    }
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(260, 24, 16), mat);
  /* Draw the sky AFTER the town, not before. depthWrite is off, so the
     depth test then rejects every pixel the buildings already cover —
     otherwise this full-screen custom shader runs once for the whole
     viewport and is immediately painted over. Worth ~25% of the frame
     under software rendering. */
  sky.frustumCulled = false; sky.renderOrder = 100;
  scene.add(sky);

  // ---- puffy clouds: clusters of soft billboards ----
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, 'rgba(255,255,255,.95)');
  g.addColorStop(0.5, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, 128, 128);
  const cloudTex = new THREE.CanvasTexture(cv);

  const cloudMat = new THREE.SpriteMaterial({
    map: cloudTex, transparent: true, opacity: 0.85, depthWrite: false, fog: false,
    color: C(0xfffdfa)
  });
  const clouds = new THREE.Group(); clouds.renderOrder = -90;
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), r = rand(110, 210), y = rand(38, 84);
    const cluster = new THREE.Group();
    cluster.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    const n = randi(3, 6), s = rand(20, 40);
    for (let j = 0; j < n; j++) {
      const sp = new THREE.Sprite(cloudMat);
      sp.position.set(rand(-s, s), rand(-s * 0.16, s * 0.16), rand(-s * 0.3, s * 0.3));
      const ss = rand(s * 0.75, s * 1.5);
      sp.scale.set(ss, ss * rand(0.5, 0.72), 1);
      cluster.add(sp);
    }
    clouds.add(cluster);
  }
  scene.add(clouds);
  return { sky, clouds };
}
