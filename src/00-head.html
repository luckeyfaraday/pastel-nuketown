<meta charset="utf-8">
<script>
/* The sign-in callback arrives as `#auth_token=…&auth_expires_at=…` and has to
   come off the address bar in the same tick the page starts parsing — which is
   why this is here, ahead of the fonts, the CDN copy of Three.js and every
   module in the bundle, rather than in 82-store.js where the rest of the store
   lives. Anything above it in the document runs with page privileges and can
   read location.href, and a CDN that stalls would otherwise leave a freshly
   issued bearer sitting visible in the popup's address bar for as long as the
   player leaves the window open — and in history, and in anything they copy.

   It sits second because the charset declaration has to stay inside the first
   1024 bytes; everything after that point is negotiable, this is not.

   Deliberately dependency-free: no bundle globals, no helpers, all of it inside
   one try. If the store module never loads, the token still leaves the URL.
   The values are handed on through a one-shot function that deletes itself on
   the first call, so once the store has taken them there is nothing left on
   window for later code to find. */
(function () {
  try {
    var hash = typeof location.hash === 'string' ? location.hash : '';
    if (hash.length < 2) return;
    var fragment = new URLSearchParams(hash.slice(1));
    if (!fragment.has('auth_token') && !fragment.has('auth_expires_at')) return;
    var found = { token: fragment.get('auth_token'), expiresAt: fragment.get('auth_expires_at') };
    fragment.delete('auth_token');
    fragment.delete('auth_expires_at');
    /* Whatever else was in the fragment — #room=ABCDE — belongs to the page. */
    var rest = fragment.toString();
    if (history && history.replaceState)
      history.replaceState(null, '', location.pathname + location.search + (rest ? '#' + rest : ''));
    window.__pnTakeAuthCallback = function () {
      var taken = found;
      found = null;
      try { delete window.__pnTakeAuthCallback; } catch (e) { window.__pnTakeAuthCallback = null; }
      return taken;
    };
  } catch (e) {}
})();
</script>

<title>PASTEL NUKETOWN — Free-For-All</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🫧%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3f5c; --ink-soft:#6b5f80;
  --cream:#fff8f0; --pink:#ffb7c5; --peach:#ffd3b6; --butter:#ffefa8;
  --mint:#b8f2d8; --sky:#a8dcf0; --lilac:#d4c5f9; --coral:#ff9aa2;
  --panel:rgba(255,248,240,.82);
  --disp:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --ui:'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe8f5}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ---------- generic chunky pastel panel ---------- */
.panel{
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:18px;
  box-shadow:0 5px 0 var(--ink), 0 5px 22px rgba(74,63,92,.22);
  backdrop-filter:blur(7px);
}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
#hud.hide{display:none}

/* ---------- vignette + damage flash ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(90,74,110,.30) 100%)}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,120,150,0) 35%,rgba(255,110,145,.62) 100%)}
#heal{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(150,255,200,0) 40%,rgba(140,250,200,.5) 100%)}

/* ---------- crosshair ---------- */
#cross{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:11;pointer-events:none}
#cross i{position:absolute;background:var(--cream);border:2px solid var(--ink);border-radius:3px;
  box-shadow:0 0 6px rgba(74,63,92,.35);transition:none}
#cross .dot{left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%}
#cross .t{left:50%;width:4px;height:11px;margin-left:-2px}
#cross .h{top:50%;height:4px;width:11px;margin-top:-2px}
#hitmark{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:12;
  opacity:0;pointer-events:none}
#hitmark span{position:absolute;left:50%;top:50%;width:16px;height:4px;margin:-2px 0 0 -8px;
  background:#fff;border:2px solid var(--ink);border-radius:3px}

/* ---------- bottom-left: health ---------- */
#vitals{position:absolute;left:26px;bottom:24px;padding:12px 18px 13px;min-width:250px}
#vitals .lbl{font-family:var(--disp);font-size:13px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#hpwrap{margin-top:6px;height:22px;border:3px solid var(--ink);border-radius:12px;background:#efe3f2;overflow:hidden;position:relative}
#hpbar{height:100%;width:100%;border-radius:8px;
  background:linear-gradient(180deg,#c8ffe4,#7fe6b4);transition:width .16s ease-out}
#hpbar.low{background:linear-gradient(180deg,#ffc9d4,#ff8fa3)}
#hpnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:15px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}

/* ---------- bottom-right: ammo + weapon ---------- */
#ammo{position:absolute;right:26px;bottom:24px;padding:10px 20px 12px;text-align:right;min-width:210px}
#wname{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
#acount{font-family:var(--disp);font-size:44px;font-weight:800;line-height:.98;color:var(--ink)}
#acount small{font-size:20px;color:var(--ink-soft)}
#acount.empty{color:var(--coral)}
#reloading{font-family:var(--disp);font-size:14px;letter-spacing:.14em;color:var(--coral);
  text-transform:uppercase;height:16px}
#wslots{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
#wslots div{width:26px;height:22px;border:2.5px solid var(--ink);border-radius:7px;background:#fff;
  font-family:var(--disp);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:.45}
#wslots div.on{opacity:1;background:var(--butter);transform:translateY(-2px)}

/* ---------- top-centre: match state ---------- */
#top{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
#top .box{padding:7px 16px 8px;text-align:center;min-width:82px}
#top .k{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#top .v{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1;color:var(--ink)}
#top .v.lead{color:#e0709a}

/* ---------- killfeed ---------- */
#feed{position:absolute;right:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fitem{padding:5px 13px 6px;border:2.5px solid var(--ink);border-radius:13px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-size:14px;font-weight:600;
  display:flex;gap:7px;align-items:center;animation:fpop .22s cubic-bezier(.3,1.6,.5,1)}
.fitem b{font-weight:800}
.fitem .ic{font-size:15px}
@keyframes fpop{from{transform:translateX(22px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---------- floating combat text ---------- */
#floaters{position:absolute;inset:0}
.float{position:absolute;font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(255,255,255,.6);transform:translate(-50%,-50%);white-space:nowrap}

/* ---------- damage direction ---------- */
.dind{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
  pointer-events:none}
.dind::before{content:'';position:absolute;left:50%;top:2px;margin-left:-15px;
  width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
  border-bottom:19px solid rgba(255,120,150,.9);filter:drop-shadow(0 0 3px rgba(74,63,92,.6))}

/* ---------- scoreboard ---------- */
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 26px 22px;
  min-width:min(430px,calc(100vw - 20px));max-width:calc(100vw - 20px);display:none}
#board.on{display:block}
/* while the match-over card is up the board is re-parented into it, so it
   has to sit in the flex flow instead of centring itself on the viewport */
#over #board,#dead #board{position:static;transform:none;margin:14px 0 2px;max-height:56vh;overflow:auto}
#board h3{font-family:var(--disp);font-size:20px;letter-spacing:.1em;text-align:center;margin-bottom:12px}
#board table{width:100%;border-collapse:collapse;font-family:var(--disp);font-size:16px}
#board th{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
  text-align:right;padding-bottom:6px}
#board th:first-child{text-align:left}
#board td{padding:4px 0;text-align:right;font-weight:600}
#board td:first-child{text-align:left;display:flex;gap:8px;align-items:center}
#board tr.me td{color:#d4638f}
#board .sw{width:15px;height:15px;border:2.5px solid var(--ink);border-radius:5px;display:inline-block}

/* ---------- title / overlays ---------- */
/* Centred by auto margins rather than by justify-content. A centred column
   that overflows spills equally past both ends, and the half above the top is
   unreachable -- no amount of scrolling brings it back, so the title crops.
   Auto margins collapse to nothing once the content is taller than the
   viewport, which leaves the overflow entirely at the bottom where scrolling
   can actually reach it. Looks identical whenever the card does fit.
   The margins hang off ::before/::after rather than the first and last
   children: the title ends on two .keys rows and hides whichever one the
   input type does not want, so a child selector picks a display:none element
   half the time, loses that end's margin, and the column silently drops to
   bottom-aligned with the last row against the window edge. The spacers are
   always the real end items, and their height keeps the last row's shadow
   off that edge -- and leaves a gutter to scroll to when the card is taller
   than the window. */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;
  flex-direction:column;background:radial-gradient(ellipse at 50% 38%,rgba(255,248,240,.26),rgba(180,198,238,.5));
  backdrop-filter:blur(2px);pointer-events:auto;overflow-y:auto;overflow-x:hidden}
.screen::before,.screen::after{content:'';flex:0 0 auto;height:14px}
.screen::before{margin-top:auto}
.screen::after{margin-bottom:auto}
.screen.off{display:none}
#title{z-index:34}          /* always above the death / match-over cards */
#title h1{font-family:var(--disp);font-size:clamp(46px,10vw,116px);font-weight:800;line-height:.86;
  letter-spacing:.01em;text-align:center;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 7px 0 rgba(74,63,92,.35),0 16px 34px rgba(74,63,92,.3)}
#title h1 em{display:block;font-style:normal;
  background:linear-gradient(180deg,#ffd9e6,#ffb7c5 45%,#f79ec0);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 var(--ink))}
#title .sub{margin-top:14px;font-family:var(--disp);font-size:clamp(13px,2vw,18px);letter-spacing:.34em;
  text-transform:uppercase;color:var(--ink);opacity:.8}
.online-count{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;
  color:var(--ink);opacity:.55;margin-top:6px}
/* Second line of the same stack, one step quieter: who is here now outranks
   how many have ever been. Tight to the line above so the two read as a pair
   rather than as two unrelated notes. */
#matchesCount{margin-top:3px;opacity:.42}
#menu{width:min(560px,calc(100vw - 28px));margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.identity{width:min(330px,100%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;
  border:2.5px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.76);box-shadow:0 3px 0 var(--ink)}
.identity span{font-family:var(--disp);font-size:11px;letter-spacing:.13em;color:var(--ink-soft)}
.identity input,#roomCode{min-width:0;border:0;outline:0;background:transparent;color:var(--ink);text-transform:uppercase;
  font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.05em}
.identity input{flex:1;text-align:right}
.menu-actions{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.menu-btn{pointer-events:auto;cursor:pointer;border:none;
  font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:.08em;color:var(--ink);
  padding:15px 52px 17px;border:3px solid var(--ink);border-radius:22px;
  background:linear-gradient(180deg,#fff2c9,#ffe08a);box-shadow:0 6px 0 var(--ink),0 12px 26px rgba(74,63,92,.28);
  transition:transform .09s,box-shadow .09s}
.menu-btn.alt{font-size:19px;padding:14px 25px 16px;background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
/* SOLO is the second choice on the title screen but the same button becomes
   RESUME / ENTER MATCH on the pause card, where it is the only thing to press
   and has to stay the loudest. */
#menu:not(.pause) #play{font-size:19px;padding:14px 25px 16px;background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
.menu-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink),0 16px 30px rgba(74,63,92,.3)}
.menu-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.menu-btn:disabled,.mini-btn:disabled,#again:disabled{cursor:not-allowed!important;opacity:.55;filter:saturate(.45)}
.join-row{width:min(330px,100%);display:flex;gap:8px}
#roomCode{flex:1;padding:9px 12px 10px;text-align:center;border:2.5px solid var(--ink);border-radius:13px;
  background:rgba(255,255,255,.78);box-shadow:0 3px 0 var(--ink)}
#roomCode::placeholder{color:var(--ink-soft);opacity:.72}
.mini-btn{pointer-events:auto;cursor:pointer;padding:8px 14px 9px;border:2.5px solid var(--ink);border-radius:12px;
  background:#fff8f0;color:var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-weight:800;
  letter-spacing:.06em;white-space:nowrap}
.mini-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
/* An <a> rather than a <button>, so it needs the bits .mini-btn leaves to the
   button default: its own font-size, no underline, and a box that lines the
   glyph up with the text. Sits below #menuNote as the quietest thing on the
   card -- it should never compete with PLAY. */
.social{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 7px;font-size:12px;
  text-decoration:none;opacity:.72;transition:opacity .12s,transform .09s,box-shadow .09s}
.social:hover{opacity:1}
.social svg{width:12px;height:12px;flex:none}
.listed{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--disp);font-size:11px;
  font-weight:700;letter-spacing:.11em;color:var(--ink-soft)}
.listed input{width:15px;height:15px;accent-color:#d4638f;cursor:pointer}
/* Sits in #menu without `setup-only`, so it is reachable from the title screen
   and from the pause card. Mouse-look only, so it stays off touch devices. */
.sens{width:min(330px,100%);display:flex;align-items:center;gap:10px;pointer-events:auto;cursor:pointer;
  font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--ink-soft)}
.sens input{flex:1;min-width:0;accent-color:#d4638f;cursor:pointer}
.sens b{min-width:44px;text-align:right;font-size:12px;color:var(--ink)}
body.touch .sens{display:none}
/* The other aim setting, sized to match the slider so the two line up as a
   pair. Unlike .sens it stays up on touch: drag-look goes through the same
   applyLook, so inverting matters to a thumb exactly as much as to a mouse. */
.look-invert{width:min(330px,100%);pointer-events:auto}
.mode-picker{width:min(360px,100%);pointer-events:auto;text-align:center}
.mode-picker-label{display:block;margin-bottom:6px;font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--ink-soft)}
.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-option{min-width:0;min-height:50px;padding:6px 7px 7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;white-space:normal;line-height:1.05;font-size:11px}
.mode-option span{font-weight:800;letter-spacing:.06em}
.mode-option small{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft)}
.mode-option[aria-pressed="true"]{background:linear-gradient(180deg,#fff2c9,#ffe08a);transform:translateY(-1px);
  box-shadow:0 4px 0 var(--ink)}
.mode-option:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
/* Hosting a room by hand is a minority path now that PLAY picks one, but as an
   underlined line of fine print it read as a caption and nobody found CREATE
   ROOM behind it. It is a real button now — quieter than PLAY, still a button —
   and it says what it opens rather than naming the panel. */
.room-toggle{width:min(330px,100%);display:flex;align-items:center;justify-content:center;gap:9px;
  padding:9px 14px 10px;font-size:12px;letter-spacing:.13em;background:rgba(255,255,255,.72)}
.room-toggle::after{content:"\25BE";font-size:9px;line-height:1;color:var(--ink-soft)}
.room-toggle[aria-expanded="true"]{background:#fff8f0}
.room-toggle[aria-expanded="true"]::after{content:"\25B4"}
#roomOptions{width:min(330px,100%);display:flex;flex-direction:column;gap:9px}
#roomOptions[hidden]{display:none}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* ---------- room browser ---------- */
.rooms{width:min(390px,100%);display:flex;flex-direction:column;gap:7px}
.rooms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
.rooms-head .mini-btn{padding:4px 10px 5px;font-size:11px}
#roomList{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:min(210px,28vh);overflow-y:auto}
#roomList li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
  padding:7px 9px;border:2px solid rgba(74,63,92,.65);border-radius:11px;background:rgba(255,255,255,.6);
  font-family:var(--disp);font-size:13px}
#roomList li strong{font-size:15px;letter-spacing:.12em;color:#d4638f}
#roomList li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#roomList li b{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
#roomList li .mini-btn{padding:4px 11px 5px;font-size:11px}
#roomList li.rooms-empty{display:block;text-align:center;border-style:dashed;color:var(--ink-soft);
  font-size:12px;font-weight:600;letter-spacing:.04em;background:rgba(255,255,255,.42)}
/* A running match is joinable, so it reads as available rather than greyed.
   The dashed edge is all that marks it as already underway; its button says
   DROP IN where a lobby's says JOIN. */
#roomList li.busy{border-style:dashed;background:rgba(255,255,255,.44)}
#menuNote,#netStatus{min-height:18px;text-align:center;font-family:var(--disp);font-size:12px;font-weight:600;
  letter-spacing:.035em;color:var(--ink-soft)}
#netStatus{margin-top:9px;color:#4f7389}
#netStatus[data-kind="error"]{color:#b8406a}
#menu.pause{margin-top:28px}
#menu.pause .setup-only{display:none}
#menu.pause #menuNote{font-size:14px}
#lobby{width:min(440px,calc(100vw - 30px));margin-top:22px;padding:18px 20px 20px;pointer-events:auto}
.lobby-head,.roster-title,.lobby-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lobby-head>div{display:flex;align-items:baseline;gap:10px}
.lobby-head small,.roster-title{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
#lobbyCode{font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:.16em;color:#d4638f}
.roster-title{margin:17px 3px 7px}
/* Nine seats is roughly twice the lobby the card was drawn for, and a
   landscape phone has no vertical room to spare, so the list scrolls inside
   itself rather than pushing START MATCH off the bottom of the screen. */
#roster{list-style:none;display:flex;flex-direction:column;gap:6px;
  max-height:min(44vh,296px);overflow-y:auto}
#roster li{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:7px 9px;
  border:2px solid rgba(74,63,92,.65);border-radius:10px;background:rgba(255,255,255,.54);
  font-family:var(--disp);font-size:14px}
#roster li i{width:17px;height:17px;border:2px solid var(--ink);border-radius:5px}
#roster li b{font-size:10px;letter-spacing:.1em;color:var(--ink-soft)}
#lobbyCountdown{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px;
  font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.05em;color:#4f7389;text-align:center}
#lobbyCountdown[hidden]{display:none}
#lobbyCountdown .mini-btn{padding:4px 11px 5px;font-size:11px}
.lobby-actions{justify-content:center;margin-top:16px}
#netStart{font-size:20px;padding:11px 25px 13px}

  border-radius:11px;background:rgba(255,255,255,.72);box-shadow:0 3px 0 var(--ink)}

/* =====================================================================
   SIGN-IN ROW + THE LOCKER
   Both are title-screen furniture, so they are built out of the parts the
   rest of that card is built out of: .mini-btn, .panel, the same 2.5px
   ink outline and 3px drop. The row sits between the callsign and the aim
   settings because who you are and what you are called belong together.
   The store itself is a .screen, which buys it the auto-margin centring
   the title uses -- six cards are taller than a phone held sideways, and
   that machinery is the only thing that keeps the top of a tall card
   reachable instead of cropped off the window.
   ===================================================================== */
.locker{width:min(330px,100%);display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:auto}
/* 44px everywhere something can be pressed, and it is a floor rather than a
   size: this game is played on a phone held sideways, where a thumb covers
   more than it can aim at. Everything below that wants to be smaller on a
   short screen shrinks its decoration -- the type, the padding, the swatch --
   and leaves the box you actually hit alone. */
.locker .mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;font-size:11px;letter-spacing:.1em}
.locker-btn{flex:1 1 auto;min-width:0}
#signIn{background:#fff}
.gmark{width:15px;height:15px;flex:none}
.locker-store{flex:0 0 auto;background:linear-gradient(180deg,#f3e9ff,#d4c5f9)}
.locker-who{flex:1 1 175px;display:flex;align-items:center;gap:8px;min-width:0;
  padding:4px 6px 4px 12px;border:2.5px solid var(--ink);border-radius:12px;
  background:rgba(255,255,255,.76);box-shadow:0 3px 0 var(--ink)}
.locker-who .tag{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.13em;
  color:var(--ink-soft);flex:none}
#accountName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.03em}
.locker-who .mini-btn{flex:none;min-height:44px;padding:5px 10px 6px;font-size:10px}
#lockerNote{flex:1 0 100%;text-align:center;font-family:var(--disp);font-size:11px;font-weight:600;
  letter-spacing:.04em;color:#b8406a}
#lockerNote:empty{display:none}

#store{z-index:36}                /* over #title (34): it replaces that card, not shares it */
.store-card{width:min(680px,calc(100vw - 16px));max-height:calc(100vh - 30px);padding:15px 17px 17px;
  display:flex;flex-direction:column;gap:11px;pointer-events:auto}
.store-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* A flex child is as wide as its longest word unless told otherwise, and the
   words here are somebody else's: a Google display name, a catalog name the
   relay wrote. Forty unbroken characters would push CLOSE off the card at
   phone width, so the text column is allowed to be narrower than its content
   and the content is allowed to break mid-word. */
.store-head-text{min-width:0}
.store-head h2{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.09em;line-height:1;
  overflow-wrap:anywhere}
.store-sub{margin-top:4px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;
  color:var(--ink-soft);overflow-wrap:anywhere}
#storeClose{flex:none;min-height:44px}
#storeNote{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.035em;
  color:#4f7389;text-align:center}
#storeNote[data-kind="error"]{color:#b8406a}
#storeNote:empty{display:none}

/* ---------------------------------------------------------------------
   THE DISPLAY CASE
   A shop window, not a 3D viewport: the same 2.5px ink outline and 3px drop
   as every other box on this card, a warm-to-lilac wash behind the geometry
   so pastel toon bands have something to sit against, and a soft ellipse on
   the floor so the model stands rather than floats. The canvas is drawn with
   alpha on purpose -- the backdrop and the shadow are CSS, which costs the
   renderer nothing and keeps the case looking the same on a browser whose
   context has just gone away.
   --------------------------------------------------------------------- */
.store-stage{flex:none;display:flex;flex-direction:column;gap:8px}
.store-stage[hidden]{display:none}
/* Tall on purpose. A character is 1.8m of mostly vertical detail and the
   thing being decided in front of it is whether to spend money on exactly
   these pixels, so the case is given the height a standing figure wants
   and the grid below it scrolls. */
.stage-case{position:relative;height:clamp(232px,42vh,336px);overflow:hidden;
  border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:0 3px 0 var(--ink),inset 0 -16px 30px rgba(74,63,92,.11);
  background:radial-gradient(122% 98% at 50% 10%,#fffdfa 0%,#fdf2fb 44%,#e3daf6 100%)}
/* The contact shadow sits under the canvas; the canvas is positioned only so
   that it wins the stacking order over it. */
/* Where the models' feet land, which the framing holds steady: the content
   sits on a floor a fixed share of the way up the case, because the share of
   the frame reserved for the captions does not change with what is in it. */
.stage-case::before{content:'';position:absolute;z-index:0;left:50%;bottom:23%;
  transform:translateX(-50%);width:64%;height:18px;border-radius:50%;
  background:rgba(74,63,92,.17);filter:blur(6px)}
#storeCanvas{position:relative;z-index:1;display:block;width:100%;height:100%}
/* Which half is which, under the models rather than beside them, so the two
   captions line up with the two things they name at any width. */
.stage-tags{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;gap:8px;
  padding:0 9px 9px;pointer-events:none}
.stage-tag{flex:1 1 0;min-width:0;text-align:center;padding:4px 7px 5px;border-radius:999px;
  background:rgba(255,255,255,.80);font-family:var(--disp);font-size:9px;font-weight:700;
  letter-spacing:.13em;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-tag[hidden]{display:none}
.stage-empty{position:absolute;z-index:2;inset:0;display:flex;align-items:center;
  justify-content:center;padding:0 22px;text-align:center;
  font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
.stage-empty[hidden]{display:none}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage-title{min-width:0}
#stageName{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.02em;
  line-height:1.1;min-width:0;overflow-wrap:anywhere}
#stageKind{margin-top:2px;font-family:var(--disp);font-size:9px;font-weight:700;
  letter-spacing:.13em;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere}
#stageCompare{flex:none;min-height:44px;padding:8px 13px 9px;font-size:11px}
#stageCompare[aria-pressed="true"]{background:linear-gradient(180deg,#f8f0ff,#e0d3fa)}

/* Scrolls inside the card rather than growing it, so CLOSE stays where it
   was put on a short screen. `min-height:0` is what lets it: a flex child
   will not shrink below its content otherwise, and with the case above it
   that is the difference between a scrolling grid and a card taller than
   the window. */
#storeGrid{flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;
  overflow-y:auto;padding:3px}
.sitem{display:flex;flex-direction:column;gap:6px;padding:9px 10px 10px;
  border:2.5px solid var(--ink);border-radius:15px;background:rgba(255,255,255,.66);
  box-shadow:0 3px 0 var(--ink)}
.sitem.owned{background:rgba(255,255,255,.92)}
/* Equipped is a state of the card, not of the button alone -- at a glance
   across six of them the ring is what you actually read. */
.sitem.on{box-shadow:0 3px 0 var(--ink),0 0 0 3px #d4638f}
/* Which one the case is showing. Violet rather than the equipped pink,
   because a card can be both and the two answers are different questions:
   what you are wearing, and what you are looking at. */
.sitem.sel{background:rgba(255,255,255,.94);box-shadow:0 3px 0 var(--ink),0 0 0 3px #8f7ad4}
.sitem.on.sel{box-shadow:0 3px 0 var(--ink),0 0 0 3px #d4638f,0 0 0 6px #8f7ad4}
/* The picture and the name are the control that loads the case; BUY and
   EQUIP stay their own buttons in the foot, so nothing is nested inside
   anything. Everything from the swatch to the kind line is one 44px-plus
   target, which on a phone is the whole top of the card. */
.spick{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;border:0;
  background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
/* The card's picture: a render of the real item over the pastel wash. The
   wash stays because it is what the card looks like before the picture
   arrives, and on a browser that could not give the store a context it is
   what the card looks like for good. */
.swatch{position:relative;height:86px;overflow:hidden;
  border:2.5px solid var(--ink);border-radius:11px;
  box-shadow:inset 0 -6px 12px rgba(74,63,92,.14)}
.sshot{position:absolute;inset:0;display:block;width:100%;height:100%;
  object-fit:contain;pointer-events:none}
/* Same reasoning as the header: the name and the price are the relay's text
   in a two-column card 152px wide. */
.sname{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.1;
  min-width:0;overflow-wrap:anywhere}
.skind{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.13em;color:var(--ink-soft);
  min-width:0;overflow-wrap:anywhere}
.sfoot{margin-top:auto;padding-top:3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sprice{font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.04em;
  min-width:0;overflow-wrap:anywhere}
.sitem .mini-btn{min-height:44px;padding:8px 13px 9px;font-size:11px}
.sitem .mini-btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff2c9,#ffe08a)}
.sitem .mini-btn:focus-visible,.locker .mini-btn:focus-visible,
.spick:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
.spick:focus-visible{border-radius:12px}
/* The dialog takes focus when it opens; it should say so quietly rather than
   draw a ring around the whole card. */
.store-card:focus{outline:none}
.store-card:focus-visible{outline:3px solid #d4638f;outline-offset:3px}

/* A phone in portrait: two columns is the narrowest a card can be and still
   fit a name, and one column would put BUY six scrolls apart. */
@media(max-width:430px){
  .store-card{padding:12px 12px 14px}
  #storeGrid{grid-template-columns:1fr 1fr;gap:8px;padding:2px}
  .sitem{padding:7px 8px 8px;border-radius:13px}
  .swatch{height:72px}
  .sname{font-size:13px}
  .sfoot{flex-wrap:wrap;gap:5px}
  .sitem .mini-btn{flex:1 1 100%;padding:8px 6px 9px}
  /* The case keeps its size here on purpose: it is the reason the panel
     exists, and a phone in portrait has the height to spare that a phone
     on its side does not. */
  .stage-case{height:clamp(216px,38vh,300px);border-radius:15px}
  #stageName{font-size:14px}
}
/* A phone held sideways, which is how this game is played: the title card is
   already over budget at this height, so the locker gets shorter rather than
   dropping off it the way the social link does. */
@media(max-height:430px){
  .locker{gap:6px}
  .locker .mini-btn{font-size:10px;padding-top:5px;padding-bottom:6px}
  .locker-who{padding-top:2px;padding-bottom:2px}
  .store-card{max-height:calc(100vh - 14px);padding:10px 12px 12px;gap:8px}
  .store-head h2{font-size:19px}
  .store-sub{font-size:10px}
  #storeGrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
  .swatch{height:54px}
  .sitem{gap:4px;padding:6px 8px 7px}
  .sname{font-size:13px}
  .skind{font-size:8px}
  /* A phone on its side has under 400px of height for the whole card, and
     everything on it is competing. The case gives ground -- but only down
     to a floor, because a 1.8m character in a 90px window is a thumbnail
     with a GPU behind it, and the grid below scrolls where the case
     cannot. */
  .stage-case{height:clamp(150px,46vh,214px);border-radius:14px}
  .store-stage{gap:6px}
  #stageName{font-size:14px}
  #stageKind{font-size:8px}
  .stage-tags{padding:0 7px 6px;gap:6px}
}

/* .screen's wash is tuned for the title and match-over cards, where there is
   nothing behind it worth reading. A killcam you cannot see through is not a
   killcam, so pull it back to a vignette for as long as one is running. The
   death cam keeps the full wash — there the blur is ambience over your own
   corpse, not something you are being shown on purpose. */
#dead.killcam{background:radial-gradient(ellipse at 50% 38%,rgba(255,248,240,0),rgba(180,198,238,.2));
  backdrop-filter:none}

#dead .big{font-family:var(--disp);font-size:clamp(40px,8vw,84px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 28px rgba(74,63,92,.3)}
#dead .by{margin-top:8px;font-family:var(--disp);font-size:20px;font-weight:600;color:var(--ink)}
#dead .cd{margin-top:22px;font-family:var(--disp);font-size:58px;font-weight:800;color:#fff;
  text-shadow:0 4px 0 var(--ink)}

#over .big{font-family:var(--disp);font-size:clamp(40px,9vw,96px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 30px rgba(74,63,92,.3);text-align:center}
#over .rank{margin-top:16px;font-family:var(--disp);font-size:22px;font-weight:700;color:var(--ink)}

#hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-family:var(--disp);
  font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:0;
  padding:7px 18px 8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink)}

#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:linear-gradient(180deg,#ffe9f0,#d8e8fb)}
#loading .lt{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.2em;color:var(--ink)}
#loading .bar{width:230px;height:14px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
#loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd3b6,#ffb7c5,#d4c5f9)}
#loading.off{display:none}
#fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;max-width:70vw;
  padding:18px 22px;font-family:var(--ui);font-size:14px;line-height:1.5;display:none;white-space:pre-wrap}

/* =====================================================================
   TOUCH CONTROLS
   Everything below is inert until 78-touch.js puts `touch` on <body>, so
   a desktop build renders exactly as it did before. Sits at z-index 20:
   above the HUD (10) so buttons are tappable, below the title / death /
   match-over cards (30) so those still cover it.
   ===================================================================== */
body.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#touch{position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none}
#touch *{-webkit-tap-highlight-color:transparent}

/* the two drag halves: movement left, look right */
.tzone{position:absolute;top:0;bottom:0;z-index:1;pointer-events:auto;touch-action:none}
#tMove{left:0;width:46%}
#tLook{right:0;width:54%}

/* the stick draws itself wherever the thumb landed, so JS owns left/top */
#tStick{position:absolute;z-index:2;width:116px;height:116px;margin:0;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  border:3px solid var(--ink);background:rgba(255,248,240,.30);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),0 4px 14px rgba(74,63,92,.25)}
#tStick i{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
  border:3px solid var(--ink);background:linear-gradient(180deg,#fff6e2,#ffd9a8);
  box-shadow:0 3px 0 var(--ink);transform:translate(-27px,-27px)}

.tbtn{position:absolute;z-index:3;pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--ink);border-radius:50%;color:var(--ink);
  background:linear-gradient(180deg,#fff8f0,#ffe4ee);
  font-family:var(--disp);font-weight:800;letter-spacing:.06em;line-height:1;
  box-shadow:0 4px 0 var(--ink),0 8px 18px rgba(74,63,92,.22);
  transition:transform .06s,box-shadow .06s,filter .06s}
.tbtn.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);filter:brightness(.94)}

#tFire{right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
  width:104px;height:104px;font-size:18px;background:linear-gradient(180deg,#ffd9e2,#ff9aa2)}
#tJump{right:calc(134px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  width:74px;height:74px;font-size:28px;background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
#tReload{right:calc(32px + env(safe-area-inset-right));bottom:calc(136px + env(safe-area-inset-bottom));
  width:70px;height:70px;font-size:28px;background:linear-gradient(180deg,#fff6d6,#ffe08a)}

#tSys{position:absolute;z-index:3;display:flex;gap:8px;
  left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
.tbtn.sys{position:static;width:46px;height:46px;border-radius:14px;font-size:14px;
  background:var(--panel);box-shadow:0 3px 0 var(--ink)}

/* weapon chips replace the passive #wslots readout on touch */
#tWeps{position:absolute;z-index:3;left:50%;transform:translateX(-50%);display:flex;gap:9px;
  bottom:calc(14px + env(safe-area-inset-bottom))}
#tWeps button{pointer-events:auto;touch-action:none;width:52px;height:44px;
  border:3px solid var(--ink);border-radius:13px;background:rgba(255,255,255,.72);color:var(--ink);
  font-family:var(--disp);font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--ink);
  opacity:.5;transition:opacity .1s,transform .1s}
#tWeps button.on{opacity:1;background:var(--butter);transform:translateY(-3px)}
#tWeps button.down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ---------- HUD relayout for a phone held sideways ----------
   The stick owns the bottom-left and the fire cluster owns the
   bottom-right, so vitals and ammo both have to move out of the corners
   they normally live in. */
body.touch #vitals{left:calc(14px + env(safe-area-inset-left));top:calc(66px + env(safe-area-inset-top));
  bottom:auto;min-width:176px;padding:6px 12px 8px}
body.touch #vitals .lbl{font-size:9px}
body.touch #hpwrap{margin-top:4px;height:16px;border-width:2.5px}
body.touch #hpnum{font-size:12px}
/* Ammo joins vitality in a left column rather than sitting bottom-centre.
   Centred, it covered the ground directly under the crosshair -- the part of
   the screen you are looking at while you shoot. Bottom-left would be worse
   than centre, not better: the movement stick is a floating base that spawns
   wherever the left thumb lands, so anything low on that side ends up under
   a hand. Stacked beneath vitality it is clear of both the sightline and the
   thumb. */
body.touch #ammo{right:auto;left:calc(14px + env(safe-area-inset-left));transform:none;
  min-width:0;padding:5px 16px 7px;text-align:left;bottom:auto;
  top:calc(124px + env(safe-area-inset-top))}
body.touch #wname{font-size:12px}
body.touch #acount{font-size:29px}
body.touch #acount small{font-size:14px}
body.touch #reloading{font-size:10px;height:13px}
body.touch #wslots{display:none}
