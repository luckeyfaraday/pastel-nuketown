<meta charset="utf-8">
<script>
/* The sign-in callback arrives as `#auth_token=…&auth_expires_at=…` and has to
   come off the address bar in the same tick the page starts parsing — which is
   why this is here, ahead of the fonts, the CDN copy of Three.js and every
   module in the bundle, rather than in 82-store.js where the rest of the store
   lives. Anything above it in the document runs with page privileges and can
   read location.href, and a CDN that stalls would otherwise leave a freshly
   issued bearer sitting visible in the popup's address bar for as long as the
   player leaves the window open — and in history, and in anything they copy.

   It sits second because the charset declaration has to stay inside the first
   1024 bytes; everything after that point is negotiable, this is not.

   Deliberately dependency-free: no bundle globals, no helpers, all of it inside
   one try. If the store module never loads, the token still leaves the URL.

   The whole handoff happens here, and that is the point rather than an
   optimisation. This snippet used to park the values on `window` for the store
   to collect once the bundle had loaded — which meant the bearer was sitting on
   a predictable global for the whole of the CDN's execution, and a compromised
   jsDelivr response only had to call it. Taking the token off the URL and then
   leaving it somewhere the same untrusted code can reach protects it from the
   address bar and from nothing else. So the token never leaves this closure:
   the only thing a legitimate callback does with it is post it to the window
   that opened us, and by the time anything else on the page runs, this variable
   is out of scope and this window is closing.

   Everything below is duplicated from 82-store.js on purpose — the key, the ten
   minute life of a marker, the message shape — because a dependency here would
   mean loading the bundle first, which is the thing being avoided. store.test.js
   pins these literals against the constants they mirror. The store keeps its own
   copy of this handoff for a page assembled without this snippet; in the built
   page the fragment is gone by then and its copy quietly finds nothing. */
(function () {
  try {
    var hash = typeof location.hash === 'string' ? location.hash : '';
    if (hash.length < 2) return;
    var fragment = new URLSearchParams(hash.slice(1));
    if (!fragment.has('auth_token') && !fragment.has('auth_expires_at')) return;
    var token = fragment.get('auth_token');
    var rawExpiry = fragment.get('auth_expires_at');
    fragment.delete('auth_token');
    fragment.delete('auth_expires_at');
    /* Whatever else was in the fragment — #room=ABCDE — belongs to the page. */
    var rest = fragment.toString();
    if (history && history.replaceState)
      history.replaceState(null, '', location.pathname + location.search + (rest ? '#' + rest : ''));

    /* From here on every exit drops the token on the floor, which is the
       correct outcome for all of them: a callback nobody asked for, an attempt
       that has gone stale, or a window with nobody to hand it to. This page
       never signs *itself* in on the strength of a URL. */
    var raw = null;
    try { raw = sessionStorage.getItem('pastel-nuketown-signin'); } catch (e) { return; }
    if (!raw) return;
    var mark = null;
    try { mark = JSON.parse(raw); } catch (e) { return; }
    if (!mark || typeof mark !== 'object') return;
    if (typeof mark.nonce !== 'string' || !mark.nonce) return;
    var at = typeof mark.at === 'number' && isFinite(mark.at) ? mark.at : 0;
    if (!at || Date.now() - at > 600000) return;
    if (!window.opener || window.opener.closed || window.opener === window) return;

    /* Milliseconds per the relay. The opener re-validates all of this — origin,
       which window sent it, the shape, the nonce, the token's own characters —
       so this is a courier, not a checkpoint. */
    var expiresAt = /^\d{1,15}$/.test(String(rawExpiry || '')) ? Number(rawExpiry) : 0;
    window.opener.postMessage({
      type: 'pastel-nuketown-auth',
      token: token,
      expiresAt: expiresAt > Date.now() ? expiresAt : 0,
      nonce: mark.nonce
    }, location.origin);
    /* This copy of the marker is spent. The opener clears its own. */
    try { sessionStorage.removeItem('pastel-nuketown-signin'); } catch (e) {}
    window.close();
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#cfe8f5">
<title>PASTEL NUKETOWN — Free-For-All</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🫧%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3f5c; --ink-soft:#6b5f80;
  --cream:#fff8f0; --pink:#ffb7c5; --peach:#ffd3b6; --butter:#ffefa8;
  --mint:#b8f2d8; --sky:#a8dcf0; --lilac:#d4c5f9; --coral:#ff9aa2;
  --panel:rgba(255,248,240,.82);
  --disp:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --ui:'Nunito', 'Trebuchet MS', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe8f5}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ---------- generic chunky pastel panel ---------- */
.panel{
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:18px;
  box-shadow:0 5px 0 var(--ink), 0 5px 22px rgba(74,63,92,.22);
  backdrop-filter:blur(7px);
}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
#hud.hide{display:none}

/* ---------- vignette + damage flash ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(90,74,110,.30) 100%)}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,120,150,0) 35%,rgba(255,110,145,.62) 100%)}
#heal{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,rgba(150,255,200,0) 40%,rgba(140,250,200,.5) 100%)}

/* ---------- crosshair ---------- */
#cross{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:11;pointer-events:none}
#cross i{position:absolute;background:var(--cream);border:2px solid var(--ink);border-radius:3px;
  box-shadow:0 0 6px rgba(74,63,92,.35);transition:none}
#cross .dot{left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%}
#cross .t{left:50%;width:4px;height:11px;margin-left:-2px}
#cross .h{top:50%;height:4px;width:11px;margin-top:-2px}
#hitmark{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:12;
  opacity:0;pointer-events:none}
#hitmark span{position:absolute;left:50%;top:50%;width:16px;height:4px;margin:-2px 0 0 -8px;
  background:#fff;border:2px solid var(--ink);border-radius:3px}

/* ---------- bottom-left: health ---------- */
#vitals{position:absolute;left:26px;bottom:24px;padding:12px 18px 13px;min-width:250px}
#vitals .lbl{font-family:var(--disp);font-size:13px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#hpwrap{margin-top:6px;height:22px;border:3px solid var(--ink);border-radius:12px;background:#efe3f2;overflow:hidden;position:relative}
#hpbar{height:100%;width:100%;border-radius:8px;
  background:linear-gradient(180deg,#c8ffe4,#7fe6b4);transition:width .16s ease-out}
#hpbar.low{background:linear-gradient(180deg,#ffc9d4,#ff8fa3)}
#hpnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:15px;font-weight:800;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}

/* ---------- bottom-right: ammo + weapon ---------- */
#ammo{position:absolute;right:26px;bottom:24px;padding:10px 20px 12px;text-align:right;min-width:210px}
#wname{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
#acount{font-family:var(--disp);font-size:44px;font-weight:800;line-height:.98;color:var(--ink)}
#acount small{font-size:20px;color:var(--ink-soft)}
#acount.empty{color:var(--coral)}
#reloading{font-family:var(--disp);font-size:14px;letter-spacing:.14em;color:var(--coral);
  text-transform:uppercase;height:16px}
#wslots{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
#wslots div{width:26px;height:22px;border:2.5px solid var(--ink);border-radius:7px;background:#fff;
  font-family:var(--disp);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:.45}
#wslots div.on{opacity:1;background:var(--butter);transform:translateY(-2px)}

/* ---------- top-centre: match state ---------- */
#top{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
#top .box{padding:7px 16px 8px;text-align:center;min-width:82px}
#top .k{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
#top .v{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1;color:var(--ink)}
#top .v.lead{color:#e0709a}

/* ---------- killfeed ---------- */
#feed{position:absolute;right:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fitem{padding:5px 13px 6px;border:2.5px solid var(--ink);border-radius:13px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-size:14px;font-weight:600;
  display:flex;gap:7px;align-items:center;animation:fpop .22s cubic-bezier(.3,1.6,.5,1)}
.fitem b{font-weight:800}
.fitem .ic{font-size:15px}
@keyframes fpop{from{transform:translateX(22px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---------- floating combat text ---------- */
#floaters{position:absolute;inset:0}
.float{position:absolute;font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(255,255,255,.6);transform:translate(-50%,-50%);white-space:nowrap}

/* ---------- damage direction ---------- */
.dind{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
  pointer-events:none}
.dind::before{content:'';position:absolute;left:50%;top:2px;margin-left:-15px;
  width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
  border-bottom:19px solid rgba(255,120,150,.9);filter:drop-shadow(0 0 3px rgba(74,63,92,.6))}

/* ---------- scoreboard ---------- */
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 26px 22px;
  min-width:min(430px,calc(100vw - 20px));max-width:calc(100vw - 20px);display:none}
#board.on{display:block}
/* while the match-over card is up the board is re-parented into it, so it
   has to sit in the flex flow instead of centring itself on the viewport */
#over #board,#dead #board{position:static;transform:none;margin:14px 0 2px;max-height:56vh;overflow:auto}
#board h3{font-family:var(--disp);font-size:20px;letter-spacing:.1em;text-align:center;margin-bottom:12px}
#board table{width:100%;border-collapse:collapse;font-family:var(--disp);font-size:16px}
#board th{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
  text-align:right;padding-bottom:6px}
#board th:first-child{text-align:left}
#board td{padding:4px 0;text-align:right;font-weight:600}
#board td:first-child{text-align:left;display:flex;gap:8px;align-items:center}
#board tr.me td{color:#d4638f}
#board .sw{width:15px;height:15px;border:2.5px solid var(--ink);border-radius:5px;display:inline-block}

/* ---------- title / overlays ---------- */
/* Centred by auto margins rather than by justify-content. A centred column
   that overflows spills equally past both ends, and the half above the top is
   unreachable -- no amount of scrolling brings it back, so the title crops.
   Auto margins collapse to nothing once the content is taller than the
   viewport, which leaves the overflow entirely at the bottom where scrolling
   can actually reach it. Looks identical whenever the card does fit.
   The margins hang off ::before/::after rather than the first and last
   children: the title ends on two .keys rows and hides whichever one the
   input type does not want, so a child selector picks a display:none element
   half the time, loses that end's margin, and the column silently drops to
   bottom-aligned with the last row against the window edge. The spacers are
   always the real end items, and their height keeps the last row's shadow
   off that edge -- and leaves a gutter to scroll to when the card is taller
   than the window. */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;
  flex-direction:column;background:radial-gradient(ellipse at 50% 38%,rgba(255,248,240,.26),rgba(180,198,238,.5));
  backdrop-filter:blur(2px);pointer-events:auto;overflow-y:auto;overflow-x:hidden}
.screen::before,.screen::after{content:'';flex:0 0 auto;height:14px}
.screen::before{margin-top:auto}
.screen::after{margin-bottom:auto}
.screen.off{display:none}
#title{z-index:34}          /* always above the death / match-over cards */
#title h1{font-family:var(--disp);font-size:clamp(46px,10vw,116px);font-weight:800;line-height:.86;
  letter-spacing:.01em;text-align:center;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 7px 0 rgba(74,63,92,.35),0 16px 34px rgba(74,63,92,.3)}
#title h1 em{display:block;font-style:normal;
  background:linear-gradient(180deg,#ffd9e6,#ffb7c5 45%,#f79ec0);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 var(--ink))}
#title .sub{margin-top:14px;font-family:var(--disp);font-size:clamp(13px,2vw,18px);letter-spacing:.34em;
  text-transform:uppercase;color:var(--ink);opacity:.8}
.online-count{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;
  color:var(--ink);opacity:.55;margin-top:6px}
/* Second line of the same stack, one step quieter: who is here now outranks
   how many have ever been. Tight to the line above so the two read as a pair
   rather than as two unrelated notes. */
#matchesCount{margin-top:3px;opacity:.42}
#menu{width:min(560px,calc(100vw - 28px));margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.identity{width:min(330px,100%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;
  border:2.5px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.76);box-shadow:0 3px 0 var(--ink)}
.identity span{font-family:var(--disp);font-size:11px;letter-spacing:.13em;color:var(--ink-soft)}
.identity input,#roomCode{min-width:0;border:0;outline:0;background:transparent;color:var(--ink);text-transform:uppercase;
  font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.05em}
.identity input{flex:1;text-align:right}
.menu-actions{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.menu-btn{pointer-events:auto;cursor:pointer;border:none;
  font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:.08em;color:var(--ink);
  padding:15px 52px 17px;border:3px solid var(--ink);border-radius:22px;
  background:linear-gradient(180deg,#fff2c9,#ffe08a);box-shadow:0 6px 0 var(--ink),0 12px 26px rgba(74,63,92,.28);
  transition:transform .09s,box-shadow .09s}
.menu-btn.alt{font-size:19px;padding:14px 25px 16px;background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
/* SOLO is the second choice on the title screen but the same button becomes
   RESUME / ENTER MATCH on the pause card, where it is the only thing to press
   and has to stay the loudest. */
#menu:not(.pause) #play{font-size:19px;padding:14px 25px 16px;background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
.menu-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink),0 16px 30px rgba(74,63,92,.3)}
.menu-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.menu-btn:disabled,.mini-btn:disabled,#again:disabled{cursor:not-allowed!important;opacity:.55;filter:saturate(.45)}
.join-row{width:100%;display:flex;gap:8px}
#roomCode{flex:1;padding:9px 12px 10px;text-align:center;border:2.5px solid var(--ink);border-radius:13px;
  background:rgba(255,255,255,.78);box-shadow:0 3px 0 var(--ink)}
#roomCode::placeholder{color:var(--ink-soft);opacity:.72}
.mini-btn{pointer-events:auto;cursor:pointer;padding:8px 14px 9px;border:2.5px solid var(--ink);border-radius:12px;
  background:#fff8f0;color:var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-weight:800;
  letter-spacing:.06em;white-space:nowrap}
.mini-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
/* An <a> rather than a <button>, so it needs the bits .mini-btn leaves to the
   button default: its own font-size, no underline, and a box that lines the
   glyph up with the text. Sits below #menuNote as the quietest thing on the
   card -- it should never compete with PLAY. */
.social{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 7px;font-size:12px;
  text-decoration:none;opacity:.72;transition:opacity .12s,transform .09s,box-shadow .09s}
.social:hover{opacity:1}
.social svg{width:12px;height:12px;flex:none}
.listed{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--disp);font-size:11px;
  font-weight:700;letter-spacing:.11em;color:var(--ink-soft)}
.listed input{width:15px;height:15px;accent-color:#d4638f;cursor:pointer}
/* Sits in #menu without `setup-only`, so it is reachable from the title screen
   and from the pause card. Mouse-look only, so it stays off touch devices. */
.sens{width:min(330px,100%);display:flex;align-items:center;gap:10px;pointer-events:auto;cursor:pointer;
  font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--ink-soft)}
.sens input{flex:1;min-width:0;accent-color:#d4638f;cursor:pointer}
.sens b{min-width:44px;text-align:right;font-size:12px;color:var(--ink)}
body.touch .sens{display:none}
/* The other aim setting, sized to match the slider so the two line up as a
   pair. Unlike .sens it stays up on touch: drag-look goes through the same
   applyLook, so inverting matters to a thumb exactly as much as to a mouse. */
.look-invert{width:min(330px,100%);pointer-events:auto}
.mode-picker{width:min(360px,100%);pointer-events:auto;text-align:center}
.mode-picker-label{display:block;margin-bottom:6px;font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.14em;color:var(--ink-soft)}
.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-option{min-width:0;min-height:50px;padding:6px 7px 7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;white-space:normal;line-height:1.05;font-size:11px}
.mode-option span{font-weight:800;letter-spacing:.06em}
.mode-option small{font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft)}
.mode-option[aria-pressed="true"]{background:linear-gradient(180deg,#fff2c9,#ffe08a);transform:translateY(-1px);
  box-shadow:0 4px 0 var(--ink)}
.mode-option:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
#roomOptions{width:100%;display:flex;flex-direction:column;gap:9px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* ---------- room browser ----------
   A dialog rather than a panel in the middle of the title card. Hosting or
   picking a specific room is the minority path -- PLAY chooses one -- and
   inline it competed with PLAY for the same glance while still being too
   short to show more than three rooms. Built out of the store's parts, so
   it opens, traps and closes the way the other two dialogs do. */
#rooms{z-index:36}                /* over #title (34): it replaces that card, not shares it */
.rooms-card{width:min(560px,calc(100vw - 16px));max-height:calc(100vh - 30px);padding:15px 17px 17px;
  display:flex;flex-direction:column;gap:12px;pointer-events:auto;overflow:hidden}
.rooms-card:focus{outline:none}
.rooms-card:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
.rooms-head-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rooms-head-text{min-width:0}
.rooms-head-bar h2{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.09em;line-height:1}
.rooms-sub{margin-top:4px;font-family:var(--disp);font-size:12px;font-weight:600;color:var(--ink-soft)}
.rooms-head-btns{display:flex;gap:8px;flex:none}
.rooms-head-btns .mini-btn{padding:6px 12px 7px;font-size:11px;min-height:44px}
#roomList{list-style:none;display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto}
#roomList li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
  padding:7px 9px;border:2px solid rgba(74,63,92,.65);border-radius:11px;background:rgba(255,255,255,.6);
  font-family:var(--disp);font-size:13px}
#roomList li strong{font-size:15px;letter-spacing:.12em;color:#d4638f}
#roomList li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#roomList li b{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
#roomList li .mini-btn{padding:4px 11px 5px;font-size:11px}
#roomList li.rooms-empty{display:block;text-align:center;border-style:dashed;color:var(--ink-soft);
  font-size:12px;font-weight:600;letter-spacing:.04em;background:rgba(255,255,255,.42)}
/* A running match is joinable, so it reads as available rather than greyed.
   The dashed edge is all that marks it as already underway; its button says
   DROP IN where a lobby's says JOIN. */
#roomList li.busy{border-style:dashed;background:rgba(255,255,255,.44)}
#menuNote,#netStatus{min-height:18px;text-align:center;font-family:var(--disp);font-size:12px;font-weight:600;
  letter-spacing:.035em;color:var(--ink-soft)}
#netStatus{margin-top:9px;color:#4f7389}
#netStatus[data-kind="error"]{color:#b8406a}
#menu.pause{margin-top:28px}
#menu.pause .setup-only{display:none}
/* The mirror of setup-only: controls that only make sense once there is a
   match to act on. LEAVE MATCH is the only one, and without it the pause
   card offered no way out of a round except reloading. */
.pause-only{display:none}
#menu.pause .pause-only{display:inline-flex;align-items:center;min-height:44px}
#menu.pause #menuNote{font-size:14px}
#lobby{width:min(440px,calc(100vw - 30px));margin-top:22px;padding:18px 20px 20px;pointer-events:auto}
.lobby-head,.roster-title,.lobby-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lobby-head>div{display:flex;align-items:baseline;gap:10px}
.lobby-head small,.roster-title{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
#lobbyCode{font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:.16em;color:#d4638f}
.roster-title{margin:17px 3px 7px}
/* Nine seats is roughly twice the lobby the card was drawn for, and a
   landscape phone has no vertical room to spare, so the list scrolls inside
   itself rather than pushing START MATCH off the bottom of the screen. */
#roster{list-style:none;display:flex;flex-direction:column;gap:6px;
  max-height:min(44vh,296px);overflow-y:auto}
#roster li{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:7px 9px;
  border:2px solid rgba(74,63,92,.65);border-radius:10px;background:rgba(255,255,255,.54);
  font-family:var(--disp);font-size:14px}
#roster li i{width:17px;height:17px;border:2px solid var(--ink);border-radius:5px}
#roster li b{font-size:10px;letter-spacing:.1em;color:var(--ink-soft)}
#lobbyCountdown{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px;
  font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.05em;color:#4f7389;text-align:center}
#lobbyCountdown[hidden]{display:none}
#lobbyCountdown .mini-btn{padding:4px 11px 5px;font-size:11px}
.lobby-actions{justify-content:center;margin-top:16px}
#netStart{font-size:20px;padding:11px 25px 13px}
.keys{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:640px}
.keys span{font-family:var(--disp);font-size:13px;font-weight:600;padding:6px 13px 7px;border:2.5px solid var(--ink);
  border-radius:11px;background:rgba(255,255,255,.72);box-shadow:0 3px 0 var(--ink)}
.keys span b{font-weight:800;color:#d4638f}

/* =====================================================================
   PARTS THE WIDE TITLE SCREEN NEEDS, IN THE COLUMN IT DOES NOT

   Everything the corner layout groups is wrapped, and every wrapper is
   `display:contents` until that layout hands it a box. So a phone in
   portrait, the pause card, and a page whose script never ran all lay
   these out as the flat column they were before the wrappers existed --
   one arrangement to keep in step instead of two.

   The four that are `display:none` here are the ones with nothing to say
   in a column: the stage is scenery for a character the column has no
   room to stand up, and the gear is a popover for two settings the
   column already shows in full.
   ===================================================================== */
.hud-stage{display:none}
.hud-meta,.hud-player,.menu-account,.menu-settings,.hud-rail{display:contents}
.menu-gear,.hud-pass,.menu-hero{display:none}
.tile-sub{display:none}
/* #signIn and the account row moved out of .locker, so the sizing that
   `.locker .mini-btn` was giving them has to come from somewhere. */
.menu-account .mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;font-size:11px;letter-spacing:.1em}
.menu-account #signIn{width:min(330px,100%)}
.hud-rail .mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;font-size:11px;letter-spacing:.1em;width:min(330px,100%)}

/* =====================================================================
   THE WIDE TITLE SCREEN

   A HUD pinned to the four corners around a character, rather than a
   column of cards down the middle. The middle belongs to the character;
   everything else is pushed to an edge, and the loudest thing on the
   screen is PLAY, alone in the corner a thumb or a cursor rests in.

   `.hud` on #title is menuHudSyncLayout's, and means the setup menu is
   the thing on screen -- not the lobby, not the pause card. Both of
   those want the column, so neither gets any of this.
   ===================================================================== */
@media (min-width:640px) and (min-aspect-ratio:13/10),
       (min-width:900px) and (min-height:600px){
#title.hud{
  display:grid;overflow:hidden;
  /* .screen is a centred flex column, and `align-items:center` survives the
     switch to grid — where it stops meaning "centre the column" and starts
     meaning "every item is as tall as its own content". The character's row
     then collapses to nothing, because the character is out of flow. */
  align-items:stretch;
  /* Bounded content, full-bleed stage: past about 1640px the corners stop
     being a composition and become four menus at the edges of a desk. The
     padding takes the surplus rather than a wrapper, which would take the
     stage in with it. */
  padding:clamp(10px,1.6vh,18px) max(16px,calc((100vw - 1640px) / 2));
  gap:clamp(6px,1.4vh,14px) clamp(14px,2.4vw,30px);
  grid-template-columns:minmax(168px,224px) minmax(0,1fr) minmax(168px,224px);
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:
    "tl   tc    tr"
    "lft  mid   rgt"
    "lft  note  rgt"
    "bl   mode  br";
  background:linear-gradient(180deg,#dbeefb 0%,#e6e2fa 38%,#f4dfeb 60%,#f0d7e0 100%);
  backdrop-filter:none;
}
/* The two spacers exist to centre a column; a grid does its own. */
#title.hud::before,#title.hud::after{display:none}
#title.hud #menu{display:contents}
/* The stage goes behind the content rather than the content being lifted in
   front of it. A blanket `position:relative` on the children reads as the
   same thing and is not: at `#title.hud #menu>*` it carries two ids, so it
   outranks every later rule in this block that wants to position one of them
   -- which is how the social link ends up as a panel filling a grid cell.
   #title is a stacking context of its own (fixed, z-index:34), so a negative
   layer here stays above its background and below everything in it. */
/* The wordmark, the key legend and the two counts-as-a-caption lines are
   what the column used to fill its middle with. The character is what
   fills it here. */
#title.hud h1,#title.hud .sub,#title.hud .keys{display:none}

/* ---- the stage ---- */
#title.hud .hud-stage{display:block;position:absolute;inset:0;z-index:-1;
  pointer-events:none;overflow:hidden}
/* The floor the character stands on. A plane, not a backdrop: the change of
   value across the horizon is what stops the character floating in a
   gradient. The edge is faded in over a few percent rather than drawn -- a
   hard line across the full width of the window reads as a seam between two
   backgrounds, which is what it would be. */
.hud-floor{position:absolute;left:-8%;right:-8%;bottom:0;height:44%;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.5) 5%,
    rgba(255,226,240,.32) 42%,rgba(214,199,247,.28))}
/* The pool of light the character is standing in, and the reason the eye goes
   to the middle before it goes to the corners. Centred on the feet -- which
   is the bottom of the character's row, not the bottom of the window -- and
   kept weak enough that the caption sitting just under it stays readable. */
.hud-pool{position:absolute;left:50%;bottom:15%;width:min(560px,44vw);height:clamp(90px,19vh,170px);
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.72),rgba(255,251,253,.4) 42%,rgba(255,255,255,0) 74%)}
/* Corners pulled down so the tiles have something to sit on. */
#title.hud .hud-stage::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 46%,rgba(74,63,92,0) 42%,rgba(74,63,92,.2) 100%)}

/* ---- top left: who you are ---- */
#title.hud .hud-player{grid-area:tl;display:flex;flex-direction:column;align-items:stretch;gap:6px;
  align-self:start;justify-self:stretch;min-width:0;padding:7px;
  border:2.5px solid var(--ink);border-radius:16px;background:rgba(255,255,255,.72);
  box-shadow:0 3px 0 var(--ink);backdrop-filter:blur(6px)}
/* min-width:0 on both, or the callsign's label and input add up to a
   min-content width wider than the card and simply hang out of it. */
#title.hud .hud-player .identity{width:auto;min-width:0;border:0;box-shadow:none;background:none;
  padding:1px 4px 1px 6px}
#title.hud .hud-player .identity input{font-size:15px}
#title.hud .menu-account{display:flex;min-width:0}
#title.hud .menu-account #signIn{width:100%;min-width:0;padding:7px 9px 8px;font-size:9px;gap:6px}
#title.hud .menu-account .locker-who{flex:1 1 auto;min-width:0;padding:3px 4px 3px 8px}

/* ---- top centre: what the relay is saying ---- */
#title.hud #netStatus{grid-area:tc;align-self:start;justify-self:center;margin-top:6px;
  max-width:100%;padding:0 8px}

/* ---- top right: the counts, and the way into the two look settings ---- */
#title.hud .hud-meta{grid-area:tr;display:flex;align-items:center;justify-content:flex-end;gap:8px;
  align-self:start;justify-self:end;flex-wrap:wrap}
#title.hud .hud-meta .online-count{margin:0;opacity:1;padding:5px 11px 6px;font-size:11px;
  border:2.5px solid var(--ink);border-radius:11px;background:rgba(255,255,255,.72);
  box-shadow:0 3px 0 var(--ink);color:var(--ink-soft)}
/* Ids, because the two rules that light these up are keyed by id and would
   otherwise outrank a class-and-pseudo selector -- leaving an empty chip
   drawn as a lone green dot when the relay has nothing to report. */
#title.hud .hud-meta #onlineCount:empty,#title.hud .hud-meta #matchesCount:empty{display:none}
/* The live figure gets the dot and the ink; how many have ever been played
   stays a footnote. */
#title.hud .hud-meta #onlineCount{display:flex;align-items:center;gap:7px;color:var(--ink)}
#title.hud .hud-meta #onlineCount::before{content:'';width:9px;height:9px;border-radius:50%;
  background:#5fc9a2;box-shadow:0 0 0 2px rgba(74,63,92,.55)}
#title.hud .menu-gear{display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;padding:0;font-size:17px;border-radius:13px;flex:none}
#title.hud .menu-settings{position:absolute;top:60px;right:max(16px,calc((100vw - 1640px) / 2));
  z-index:5;display:flex;flex-direction:column;gap:11px;width:min(290px,calc(100vw - 32px));
  padding:13px 15px 15px;border:2.5px solid var(--ink);border-radius:16px;
  background:rgba(255,248,240,.96);box-shadow:0 5px 0 var(--ink),0 12px 26px rgba(74,63,92,.24)}
#title.hud .menu-settings:not([data-open]){display:none}
#title.hud .menu-settings .sens,#title.hud .menu-settings .look-invert{width:100%}

/* ---- the two rails ---- */
#title.hud .locker{grid-area:lft}
#title.hud .hud-rail{grid-area:rgt}
#title.hud .locker,#title.hud .hud-rail{display:flex;flex-direction:column;gap:9px;
  align-self:start;justify-self:stretch;width:auto}
/* Icon-led square-ish tiles rather than the column's text rows: at this size
   the glyph is what is recognised, and the words underneath confirm it. */
#title.hud .locker .locker-btn,#title.hud .hud-rail .locker-btn{
  flex:0 0 auto;width:100%;min-height:0;display:grid;justify-content:stretch;
  grid-template-columns:44px minmax(0,1fr);grid-template-areas:"icon name" "icon sub";
  gap:0 10px;padding:11px 12px 12px;text-align:left;border-radius:16px}
#title.hud .locker .tile-icon,#title.hud .hud-rail .tile-icon{grid-area:icon;align-self:center;
  justify-self:center;font-size:29px;line-height:1}
#title.hud .locker .tile-name,#title.hud .hud-rail .tile-name{grid-area:name;align-self:end;
  font-size:14px;letter-spacing:.09em}
#title.hud .locker .tile-sub,#title.hud .hud-rail .tile-sub{grid-area:sub;align-self:start;display:block;
  font-family:var(--ui);font-size:9px;font-weight:800;letter-spacing:.09em;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#title.hud .rail-rooms{background:linear-gradient(180deg,#e3f7ff,#a8dcf0)}
#title.hud #lockerNote{font-size:11px;text-align:center}

/* ---- the middle: the character ---- */
#title.hud .menu-hero{grid-area:mid;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;min-height:0;overflow:hidden;pointer-events:none}
#title.hud .menu-hero[hidden]{display:none}
/* Out of flow, and that is the whole point. The picture is a fixed 440x680
   still in a row whose height is whatever the four corners leave over, so
   in flow the two define each other: the row asks the character how tall it
   is, the character's `max-height:100%` asks the row, and the answer is the
   still at its natural size with its head cropped off the top of the window.
   Absolute breaks the loop — the row is sized by the badge above, and the
   character is then fitted into it. Standing on the bottom edge puts it in
   the pool of light the stage draws there. */
#title.hud .menu-hero img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  /* The character's own contact shadow. Two drops rather than one: a tight
     dark one that reads as the foot touching the floor, and a wide soft one
     that seats it in the pool of light. */
  filter:drop-shadow(0 6px 3px rgba(74,63,92,.34)) drop-shadow(0 18px 22px rgba(74,63,92,.22))}
/* Above the head, where the mockup puts it. Positioned so it stays over the
   character rather than behind it. */
.hero-rank{position:relative;z-index:1;display:flex;align-items:center;gap:7px;flex:none;
  margin-bottom:4px;padding:4px 13px 5px;
  border:2.5px solid var(--ink);border-radius:999px;
  background:linear-gradient(180deg,#fff6d6,#ffe08a);box-shadow:0 3px 0 var(--ink)}
.hero-rank[hidden]{display:none}
.hero-rank small{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.15em;
  color:var(--ink-soft)}
.hero-rank b{font-family:var(--disp);font-size:17px;font-weight:800;line-height:1}

/* ---- bottom centre: what PLAY is going to do ---- */
/* Centred and capped: the middle column is a thousand points wide on a
   desktop, and a single line of explanation stretched across all of it
   reads as a banner rather than as a caption to the button below. */
#title.hud #menuNote{grid-area:note;align-self:end;justify-self:center;margin:0;
  max-width:min(560px,100%);font-size:13px}
#title.hud #modePicker{grid-area:mode;align-self:end;justify-self:center;width:min(430px,100%)}
#title.hud #modePicker .mode-option{min-height:58px}

/* ---- bottom left: the season, as a climb ---- */
#title.hud .hud-pass{grid-area:bl;display:flex;flex-direction:column;gap:6px;
  align-self:end;justify-self:stretch;margin-bottom:34px;padding:10px 13px 12px;
  border:2.5px solid var(--ink);border-radius:16px;
  background:linear-gradient(180deg,rgba(255,246,214,.94),rgba(255,224,138,.94));
  box-shadow:0 3px 0 var(--ink)}
#title.hud .hud-pass[hidden]{display:none}
.pass-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--ink-soft)}
.pass-head b{font-size:13px;letter-spacing:.06em;color:var(--ink)}
.pass-bar{display:block;height:11px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;
  background:rgba(255,255,255,.72)}
.pass-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffb7c5,#d4c5f9)}
.pass-xp{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.07em;
  color:var(--ink-soft);text-align:right}
/* The quietest thing on the screen, in the corner with the most room for
   something quiet. Absolute so it can sit under the pass plate without
   claiming a row of its own. */
#title.hud .social{position:absolute;left:max(16px,calc((100vw - 1640px) / 2));bottom:12px;
  z-index:1;font-size:11px;padding:5px 11px 6px}

/* ---- bottom right: the one thing to press ---- */
#title.hud .menu-actions{grid-area:br;display:flex;flex-direction:column;align-items:stretch;
  gap:8px;align-self:end;justify-self:stretch}
#title.hud .menu-actions #quickPlay{width:100%;padding:18px 14px 20px;font-size:clamp(24px,2.4vw,34px);
  border-radius:20px}
/* SOLO is the second choice and reads like one -- but it is also the only
   one that works with no relay reachable, so it stays a button and not a
   line of fine print. */
#title.hud .menu-actions #play{width:100%;padding:10px 14px 12px;font-size:15px;border-radius:15px}
}

/* A landscape phone has no vertical room to spare: the bottom band is the
   part that has to give, and the note is the part of it that can. */
@media (min-width:640px) and (max-height:480px){
  #title.hud{gap:4px clamp(10px,2vw,22px);padding-top:8px;padding-bottom:8px}
  /* The player card back to one row. Stacked it is a quarter of a landscape
     phone's height, and every point it gives up here goes to the character,
     which is the only thing on the screen that gets better with more room. */
  #title.hud .hud-player{flex-direction:row;align-items:center;gap:6px;padding:5px}
  /* Two hundred points of card cannot hold a word, a name and a sentence.
     The label goes -- an uppercase name in a box beside a sign-in button is
     legible as a callsign without being told -- and the button falls back to
     its mark, which is why it carries an aria-label. Losing the name instead
     is not an option: it is the one thing on this card the player set. */
  #title.hud .hud-player .identity{flex:1 1 auto;min-width:0}
  #title.hud .hud-player .identity>span{display:none}
  #title.hud .hud-player .identity input{font-size:13px;text-align:left}
  #title.hud .menu-account{flex:0 0 auto}
  #title.hud .menu-account #signIn{width:auto;padding:8px 10px 9px}
  #title.hud .menu-account #signIn>span{display:none}
  #title.hud .locker .locker-btn,#title.hud .hud-rail .locker-btn{padding:8px 10px 9px}
  #title.hud #menuNote{font-size:11px}
  #title.hud #modePicker .mode-option{min-height:46px}
  #title.hud .menu-actions #quickPlay{padding:12px 12px 14px}
  #title.hud .menu-actions #play{padding:7px 12px 9px;font-size:13px}
  #title.hud .hud-pass{margin-bottom:26px;padding:7px 11px 9px}
  #title.hud .social{bottom:8px}
}

/* The taller half of the wide layout. Below this the arrangement is the same
   but the character is not worth the vertical room, so it keeps the middle
   without the extra weight. */
@media (min-width:900px) and (min-height:600px){
  #title.hud{grid-template-columns:minmax(186px,246px) minmax(0,1fr) minmax(186px,246px)}
  #title.hud .locker .locker-btn,#title.hud .hud-rail .locker-btn{
    grid-template-columns:52px minmax(0,1fr);padding:13px 14px 14px}
  #title.hud .locker .tile-icon,#title.hud .hud-rail .tile-icon{font-size:34px}
  #title.hud .locker .tile-name,#title.hud .hud-rail .tile-name{font-size:15px}
  #title.hud .locker .tile-sub,#title.hud .hud-rail .tile-sub{font-size:10px}
}
@media(max-height:760px){
  .mode-option{min-height:44px;padding-top:5px;padding-bottom:6px}
  #title h1{font-size:clamp(42px,8vw,78px)}
  #title .sub{margin-top:9px}
  #menu,#lobby{margin-top:14px}
  .keys{margin-top:14px}
  .keys span{padding:4px 10px 5px;font-size:11px}
}
@media(max-width:360px){
  #board{padding:14px 12px 16px}
  #board h3{font-size:17px;margin-bottom:8px}
  #board table{font-size:13px}
  #lobby{width:calc(100vw - 16px);padding:14px 12px 16px}
  .lobby-head{align-items:stretch;flex-wrap:wrap}
  .lobby-head>div{width:100%;justify-content:center}
  #lobbyCode{font-size:24px;letter-spacing:.11em}
  #copyRoom{width:100%}
  .lobby-actions{flex-wrap:wrap}
  #netStart{flex:1 1 180px}
  .menu-btn{font-size:22px;padding:12px 35px 14px}
  .menu-btn.alt,#menu:not(.pause) #play{font-size:17px;padding:12px 18px 14px}
  .mode-option{padding-left:4px;padding-right:4px;font-size:10px}
  .mode-option small{font-size:9px}
  .keys{gap:6px;padding:0 6px}
  .keys span{padding:4px 8px 5px}
}
@media(max-height:680px){
  #title,#over{justify-content:flex-start;padding:12px 8px 24px}
  #title h1{font-size:clamp(38px,8vw,64px)}
  #title .sub{margin-top:6px}
  #menu,#lobby{margin-top:10px}
  #menu{gap:8px}
  .keys{margin-top:10px;gap:6px}
  #over .big{margin-top:4px}
}
@media(max-height:430px){
  #title{padding-top:8px}
  #title h1{font-size:38px}
  #title .sub{display:none}
  .online-count{display:none}
  .social{display:none}       /* landscape phone: the card is already over budget */
  .identity{padding-top:3px;padding-bottom:3px}
  .menu-btn{padding-top:8px;padding-bottom:10px}
  .menu-btn.alt,#menu:not(.pause) #play{padding-top:8px;padding-bottom:10px}
  .mode-option{min-height:48px;padding-top:5px;padding-bottom:6px}
  #roomCode{padding-top:5px;padding-bottom:6px}
  .keys span{font-size:10px;padding:2px 7px 3px}
}

/* =====================================================================
   SIGN-IN ROW + THE LOCKER
   Both are title-screen furniture, so they are built out of the parts the
   rest of that card is built out of: .mini-btn, .panel, the same 2.5px
   ink outline and 3px drop. The row sits between the callsign and the aim
   settings because who you are and what you are called belong together.
   The store itself is a .screen, which buys it the auto-margin centring
   the title uses -- six cards are taller than a phone held sideways, and
   that machinery is the only thing that keeps the top of a tall card
   reachable instead of cropped off the window.
   ===================================================================== */
.locker{width:min(330px,100%);display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:auto}
/* 44px everywhere something can be pressed, and it is a floor rather than a
   size: this game is played on a phone held sideways, where a thumb covers
   more than it can aim at. Everything below that wants to be smaller on a
   short screen shrinks its decoration -- the type, the padding, the swatch --
   and leaves the box you actually hit alone. */
.locker .mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;font-size:11px;letter-spacing:.1em}
.locker-btn{flex:1 1 auto;min-width:0}
#signIn{background:#fff}
.gmark{width:15px;height:15px;flex:none}
.locker-store{flex:0 0 auto;background:linear-gradient(180deg,#f3e9ff,#d4c5f9)}
.locker-who{flex:1 1 175px;display:flex;align-items:center;gap:8px;min-width:0;
  padding:4px 6px 4px 12px;border:2.5px solid var(--ink);border-radius:12px;
  background:rgba(255,255,255,.76);box-shadow:0 3px 0 var(--ink)}
.locker-who .tag{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.13em;
  color:var(--ink-soft);flex:none}
#accountName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.03em}
.locker-who .mini-btn{flex:none;min-height:44px;padding:5px 10px 6px;font-size:10px}
#lockerNote{flex:1 0 100%;text-align:center;font-family:var(--disp);font-size:11px;font-weight:600;
  letter-spacing:.04em;color:#b8406a}
#lockerNote:empty{display:none}

#store{z-index:36}                /* over #title (34): it replaces that card, not shares it */
.store-card{width:min(680px,calc(100vw - 16px));max-height:calc(100vh - 30px);padding:15px 17px 17px;
  display:flex;flex-direction:column;gap:11px;pointer-events:auto}
.store-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* A flex child is as wide as its longest word unless told otherwise, and the
   words here are somebody else's: a Google display name, a catalog name the
   relay wrote. Forty unbroken characters would push CLOSE off the card at
   phone width, so the text column is allowed to be narrower than its content
   and the content is allowed to break mid-word. */
.store-head-text{min-width:0}
.store-head h2{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.09em;line-height:1;
  overflow-wrap:anywhere}
.store-sub{margin-top:4px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;
  color:var(--ink-soft);overflow-wrap:anywhere}
#storeClose{flex:none;min-height:44px}
#storeNote{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.035em;
  color:#4f7389;text-align:center}
#storeNote[data-kind="error"]{color:#b8406a}
#storeNote:empty{display:none}

/* ---------------------------------------------------------------------
   THE DISPLAY CASE
   A shop window, not a 3D viewport: the same 2.5px ink outline and 3px drop
   as every other box on this card, a warm-to-lilac wash behind the geometry
   so pastel toon bands have something to sit against, and a soft ellipse on
   the floor so the model stands rather than floats. The canvas is drawn with
   alpha on purpose -- the backdrop and the shadow are CSS, which costs the
   renderer nothing and keeps the case looking the same on a browser whose
   context has just gone away.
   --------------------------------------------------------------------- */
/* Case above shelf, which is what it looks like everywhere except a phone on
   its side. `min-height:0` on both this and the grid inside it is what lets
   the pair be shorter than their content wants; without it a flex child
   refuses to shrink and the bottom of the card walks off the screen. */
.store-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:11px}
/* Content-sized and immovable, which is right wherever there is height to
   spare: the grid beside it takes the leftover and scrolls. The short-screen
   rules below are where it learns to give ground instead. */
.store-stage{flex:none;display:flex;flex-direction:column;gap:8px}
.store-stage[hidden]{display:none}
/* Tall on purpose. A character is 1.8m of mostly vertical detail and the
   thing being decided in front of it is whether to spend money on exactly
   these pixels, so the case is given the height a standing figure wants
   and the grid below it scrolls. */
.stage-case{position:relative;height:clamp(232px,42vh,336px);overflow:hidden;
  border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:0 3px 0 var(--ink),inset 0 -16px 30px rgba(74,63,92,.11);
  background:radial-gradient(122% 98% at 50% 10%,#fffdfa 0%,#fdf2fb 44%,#e3daf6 100%)}
/* The contact shadow sits under the canvas; the canvas is positioned only so
   that it wins the stacking order over it. */
/* Where the models' feet land, which the framing holds steady: the content
   sits on a floor a fixed share of the way up the case, because the share of
   the frame reserved for the captions does not change with what is in it. */
.stage-case::before{content:'';position:absolute;z-index:0;left:50%;bottom:23%;
  transform:translateX(-50%);width:64%;height:18px;border-radius:50%;
  background:rgba(74,63,92,.17);filter:blur(6px)}
#storeCanvas{position:relative;z-index:1;display:block;width:100%;height:100%}
/* Which half is which, under the models rather than beside them, so the two
   captions line up with the two things they name at any width. */
.stage-tags{position:absolute;z-index:2;left:0;right:0;bottom:0;display:flex;gap:8px;
  padding:0 9px 9px;pointer-events:none}
.stage-tag{flex:1 1 0;min-width:0;text-align:center;padding:4px 7px 5px;border-radius:999px;
  background:rgba(255,255,255,.80);font-family:var(--disp);font-size:9px;font-weight:700;
  letter-spacing:.13em;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-tag[hidden]{display:none}
.stage-empty{position:absolute;z-index:2;inset:0;display:flex;align-items:center;
  justify-content:center;padding:0 22px;text-align:center;
  font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
.stage-empty[hidden]{display:none}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage-title{min-width:0}
#stageName{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.02em;
  line-height:1.1;min-width:0;overflow-wrap:anywhere}
#stageKind{margin-top:2px;font-family:var(--disp);font-size:9px;font-weight:700;
  letter-spacing:.13em;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere}
#stageCompare{flex:none;min-height:44px;padding:8px 13px 9px;font-size:11px}
#stageCompare[aria-pressed="true"]{background:linear-gradient(180deg,#f8f0ff,#e0d3fa)}

/* Scrolls inside the card rather than growing it, so CLOSE stays where it
   was put on a short screen. `min-height:0` is what lets it: a flex child
   will not shrink below its content otherwise, and with the case above it
   that is the difference between a scrolling grid and a card taller than
   the window. */
#storeGrid{flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;
  overflow-y:auto;padding:3px}
.sitem{display:flex;flex-direction:column;gap:6px;padding:9px 10px 10px;
  border:2.5px solid var(--ink);border-radius:15px;background:rgba(255,255,255,.66);
  box-shadow:0 3px 0 var(--ink)}
.sitem.owned{background:rgba(255,255,255,.92)}
/* Equipped is a state of the card, not of the button alone -- at a glance
   across six of them the ring is what you actually read. */
.sitem.on{box-shadow:0 3px 0 var(--ink),0 0 0 3px #d4638f}
/* Which one the case is showing. Violet rather than the equipped pink,
   because a card can be both and the two answers are different questions:
   what you are wearing, and what you are looking at. */
.sitem.sel{background:rgba(255,255,255,.94);box-shadow:0 3px 0 var(--ink),0 0 0 3px #8f7ad4}
.sitem.on.sel{box-shadow:0 3px 0 var(--ink),0 0 0 3px #d4638f,0 0 0 6px #8f7ad4}
/* The picture and the name are the control that loads the case; BUY and
   EQUIP stay their own buttons in the foot, so nothing is nested inside
   anything. Everything from the swatch to the kind line is one 44px-plus
   target, which on a phone is the whole top of the card. */
.spick{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;border:0;
  background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
/* The card's picture: a render of the real item over the pastel wash. The
   wash stays because it is what the card looks like before the picture
   arrives, and on a browser that could not give the store a context it is
   what the card looks like for good. */
.swatch{position:relative;height:86px;overflow:hidden;
  border:2.5px solid var(--ink);border-radius:11px;
  box-shadow:inset 0 -6px 12px rgba(74,63,92,.14)}
.sshot{position:absolute;inset:0;display:block;width:100%;height:100%;
  object-fit:contain;pointer-events:none}
/* Same reasoning as the header: the name and the price are the relay's text
   in a two-column card 152px wide. */
.sname{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.02em;line-height:1.1;
  min-width:0;overflow-wrap:anywhere}
.skind{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.13em;color:var(--ink-soft);
  min-width:0;overflow-wrap:anywhere}
.sfoot{margin-top:auto;padding-top:3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sprice{font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.04em;
  min-width:0;overflow-wrap:anywhere}
.sitem .mini-btn{min-height:44px;padding:8px 13px 9px;font-size:11px}
.sitem .mini-btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff2c9,#ffe08a)}
.sitem .mini-btn:focus-visible,.locker .mini-btn:focus-visible,
.spick:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
.spick:focus-visible{border-radius:12px}
/* The dialog takes focus when it opens; it should say so quietly rather than
   draw a ring around the whole card. */
.store-card:focus{outline:none}
.store-card:focus-visible{outline:3px solid #d4638f;outline-offset:3px}

/* A phone in portrait: two columns is the narrowest a card can be and still
   fit a name, and one column would put BUY six scrolls apart. */
@media(max-width:430px){
  .store-card{padding:12px 12px 14px}
  #storeGrid{grid-template-columns:1fr 1fr;gap:8px;padding:2px}
  .sitem{padding:7px 8px 8px;border-radius:13px}
  .swatch{height:72px}
  .sname{font-size:13px}
  .sfoot{flex-wrap:wrap;gap:5px}
  .sitem .mini-btn{flex:1 1 100%;padding:8px 6px 9px}
  /* The case keeps its size here on purpose: it is the reason the panel
     exists, and a phone in portrait has the height to spare that a phone
     on its side does not. */
  .stage-case{height:clamp(216px,38vh,300px);border-radius:15px}
  #stageName{font-size:14px}
}
/* A phone held sideways, which is how this game is played: the title card is
   already over budget at this height, so the locker gets shorter rather than
   dropping off it the way the social link does. */
@media(max-height:430px){
  .locker{gap:6px}
  .locker .mini-btn{font-size:10px;padding-top:5px;padding-bottom:6px}
  .locker-who{padding-top:2px;padding-bottom:2px}
  .store-card{max-height:calc(100vh - 14px);padding:10px 12px 12px;gap:8px}
  .store-head h2{font-size:19px}
  .store-sub{font-size:10px}
  .sname{font-size:13px}
  .skind{font-size:8px}
  /* Whatever else gives, the shelf keeps enough room for a row of stock. A
     locker showing nothing to buy is not a locker, and that is exactly what
     a fixed-height case above a grid with no floor produced here: the case
     took its 150px, the head took its 44, and the grid was left with six. */
  #storeGrid{min-height:104px}
  /* And here is what pays for it: the case stops being immovable. It is
     content-sized until the grid's floor asks for the difference, and then
     it hands it over -- `0 1 auto` rather than `none`, with `min-height:0`
     on both boxes so the shrink is actually allowed to happen. */
  .store-stage{flex:0 1 auto;min-height:0}
  .stage-case{height:clamp(120px,46vh,214px);flex:0 1 auto;min-height:0;border-radius:14px}
  .store-body{gap:9px}
  .store-stage{gap:6px}
  #stageName{font-size:14px}
  #stageKind{font-size:8px}
  .stage-tags{padding:0 7px 6px;gap:6px}

  /* Wide rows, not tall tiles. A tile spends 176px of height on one item
     because the picture, the name and the button are stacked; laid across
     they are 83px and the picture is the only thing that gave anything up.
     Three items on a screen that could not show one. */
  /* 6px of padding because the equipped and selected rings are drawn 6px
     outside the card's border, and a scroll container clips whatever its
     padding does not reach -- at 3px the ring on the equipped item was cut
     off down its right-hand edge. */
  #storeGrid{grid-template-columns:minmax(0,1fr);gap:7px;padding:6px}
  .sitem{flex-direction:row;align-items:center;gap:9px;padding:6px 8px 7px}
  /* Picture on the left spanning both text lines, name over kind beside it.
     A grid rather than another wrapper because the card's markup is flat on
     purpose -- nothing interactive is nested inside anything. */
  .spick{flex:1 1 auto;display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:auto auto;column-gap:9px;row-gap:1px;align-items:center}
  .swatch{grid-row:1/3;width:74px;height:46px;border-radius:9px}
  /* Price over button, so the widest word in the foot ("EQUIPPED") sets the
     column on its own. Side by side they set it together and the name is
     squeezed down to a couple of characters. */
  .sfoot{flex:none;flex-direction:column;align-items:stretch;
    margin-top:0;padding-top:0;gap:3px}
  .sprice{text-align:center;font-size:12px}
}
/* The shape a phone in landscape actually is: no height to spare and plenty
   of width going begging. So stop stacking. The case takes a column on the
   left at the full height of the card -- taller than it ever got stacked --
   and the shelf scrolls beside it instead of underneath it.

   560px is the width where a row still fits a picture, a readable name and
   an EQUIPPED button after the case has taken its 40%. The narrowest phone
   anyone holds sideways is 568, so every real one lands here; a window too
   narrow for two columns keeps the stack, with the rows above. */
@media(max-height:430px) and (min-width:560px){
  .store-body{flex-direction:row;align-items:stretch;gap:11px}
  .store-stage{flex:0 0 40%;min-width:0}
  /* The case is now as tall as the row, which is the whole card under the
     header -- so no clamp, and no floor left to fight the grid over. */
  .stage-case{height:auto;flex:1 1 auto}
  #storeGrid{min-width:0;min-height:0}
}
/* Too short to stack and too narrow to split -- no phone is this shape, but a
   desktop window dragged down to it is. There is no honest size for the case
   here: shrinking it to fit lands on a four-pixel strip, and a four-pixel
   strip is worse than no case at all. So give the whole card to the shelf,
   which is the same state a browser with no WebGL context has always got. */
@media(max-height:430px) and (max-width:559px){
  .store-stage{display:none}
}

/* =====================================================================
   SEASON 1 BATTLE PASS
   Built out of the same parts as the locker — a .screen dialog, a .panel
   card, the 2.5px ink outline and the 3px drop — with one shape of its
   own: the track. Twenty-five tier columns scroll sideways under two lane
   labels that stay pinned to the left, which is how a 360px phone gets the
   whole ladder without the card ever growing wider than the window.
   ===================================================================== */
/* The title-screen entry, butter-yellow the way the store button is lilac. */
.locker-pass{flex:0 0 auto;background:linear-gradient(180deg,#fff6d6,#ffe08a)}
#battlepass{z-index:37}                /* over #store (36); the two never open together by design */
.bp-card{width:min(720px,calc(100vw - 16px));max-height:calc(100vh - 30px);padding:15px 17px 17px;
  display:flex;flex-direction:column;gap:10px;pointer-events:auto;overflow:hidden}
.bp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.bp-head-text{min-width:0}
.bp-head h2{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.09em;line-height:1;
  overflow-wrap:anywhere}
.bp-head h2 em{font-style:normal;color:#d4638f}
.bp-sub{margin-top:4px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.05em;
  color:var(--ink-soft);overflow-wrap:anywhere}
#bpClose{flex:none;min-height:44px}
#bpNote{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.035em;
  color:#4f7389;text-align:center}
#bpNote[data-kind="error"]{color:#b8406a}
#bpNote:empty{display:none}

/* The locker calls this layer .store-body. The pass gets the same split-ready
   shell: one summary column and one independently scrolling shelf. */
.bp-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.bp-summary{flex:none;display:flex;flex-direction:column;gap:10px}

/* ---- progress header ---- */
.bp-progress{flex:none;display:flex;align-items:center;gap:12px;padding:10px 13px;
  border:2.5px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.66);
  box-shadow:0 3px 0 var(--ink)}
.bp-progress-line{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft)}
.bp-tier-badge{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);
  background:linear-gradient(180deg,#fff2c9,#ffe08a);box-shadow:0 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9}
.bp-tier-badge small{font-family:var(--disp);font-size:8px;font-weight:700;letter-spacing:.13em;color:var(--ink-soft)}
.bp-tier-badge b{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--ink)}
.bp-tier-badge.done{background:linear-gradient(180deg,#d9f7e6,#b8f2d8)}
.bp-progress-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bp-xp-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.bp-xp-line small{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-align:right}
.bp-bar{height:16px;border:2.5px solid var(--ink);border-radius:9px;background:#efe3f2;overflow:hidden}
.bp-bar i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#ffd3b6,#ffb7c5,#d4c5f9);transition:width .3s ease-out}
.bp-progress-note{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft)}

/* ---- the offer / owned / sign-in row ---- */
.bp-cta{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;
  background:linear-gradient(120deg,#f3e9ff,#ffe6f0 55%,#fff6d6);box-shadow:0 3px 0 var(--ink)}
.bp-cta.owned{background:linear-gradient(120deg,#e2fbe9,#c8ffe4 60%,#fff6d6)}
.bp-cta.quiet{background:rgba(255,255,255,.6)}
.bp-cta-text{min-width:0;flex:1 1 auto;font-family:var(--disp);font-size:13px;font-weight:800;
  letter-spacing:.04em;line-height:1.25;color:var(--ink)}
.bp-cta-text small{display:block;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft)}
.bp-cta .mini-btn{flex:none;min-height:44px;font-size:12px;background:linear-gradient(180deg,#fff2c9,#ffe08a)}

/* ---- the track ---- */
/* Scrolls inside the card rather than growing it: the labels are the first
   child and stay pinned while the tiers slide under them. */
.bp-ladder-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  border:2.5px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.38);
  box-shadow:0 3px 0 var(--ink);overflow:hidden}
.bp-track-head{flex:none;height:28px;padding:5px 10px 4px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;border-bottom:2px solid rgba(74,63,92,.22);
  font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.bp-track-head small{font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft)}
.bp-ladder{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  scrollbar-color:#b7a8c7 transparent;scrollbar-width:thin}
.bp-ladder::after{content:'';flex:0 0 18px}
.bp-lanes{flex:none;position:sticky;left:0;z-index:2;display:flex;flex-direction:column;gap:6px;
  padding:2px 10px 2px 2px;
  background:linear-gradient(90deg,rgba(255,248,240,.96) 72%,rgba(255,248,240,0))}
.bp-lane-spacer{height:26px}
.bp-lane-label{height:84px;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.22em}
.bp-lane-free{color:#4f9d7a}
.bp-lane-premium{color:#b0568e}
.bp-tier{flex:none;width:88px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.bp-tier.final{width:104px}
.bp-tier-num{height:26px;display:flex;align-items:center;justify-content:center;gap:3px;
  border:2.5px solid transparent;border-radius:10px;
  font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--ink-soft)}
.bp-tier.reached .bp-tier-num{color:var(--ink);background:rgba(255,255,255,.85);
  border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.bp-tier.final .bp-tier-num{color:var(--ink);background:linear-gradient(180deg,#fff2c9,#ffe08a);
  border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.bp-node{position:relative;height:84px;padding:7px 6px 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;text-align:center;
  border:2.5px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.62);
  box-shadow:0 3px 0 var(--ink)}
.bp-node.bp-premium{background:linear-gradient(160deg,rgba(243,233,255,.92),rgba(255,230,240,.92))}
.bp-glyph{font-size:20px;line-height:1}
.bp-name{font-family:var(--disp);font-size:9px;font-weight:700;letter-spacing:.03em;line-height:1.18;
  color:var(--ink);max-width:100%;max-height:2.36em;overflow:hidden;overflow-wrap:anywhere}
.bp-badge{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:10px;font-weight:800;line-height:1;background:#fff;
  box-shadow:0 2px 0 rgba(74,63,92,.4)}
.bp-ready{position:absolute;left:0;right:0;bottom:0;padding:2px 0 3px;
  border-radius:0 0 9px 9px;border-top:2px solid var(--ink);background:#7fe6b4;
  font-family:var(--disp);font-size:7px;font-weight:800;letter-spacing:.16em;text-align:center;color:var(--ink)}
/* locked: the tier is not reached yet — dimmed, padlock in the corner. */
.bp-node.n-locked{background:rgba(255,255,255,.4)}
.bp-node.n-locked .bp-glyph,.bp-node.n-locked .bp-name{opacity:.45;filter:saturate(.35)}
.bp-node.n-locked .bp-badge{background:#e7ddf0}
/* unlocked and waiting to be claimed: bright, ringed, with a READY strip. */
.bp-node.n-ready{background:linear-gradient(180deg,#fffbe6,#ffefa8);
  box-shadow:0 3px 0 var(--ink),0 0 0 3px rgba(127,230,180,.9)}
.bp-node.bp-premium.n-ready{background:linear-gradient(160deg,#f3e9ff,#ffd9ec)}
/* Claimed rewards are wearable inventory. The tick marks ownership and the
   bottom strip makes the card's equip action explicit. */
.bp-node.n-claimed{background:linear-gradient(180deg,#e2fbe9,#c8ffe4)}
.bp-node.n-claimed .bp-glyph,.bp-node.n-claimed .bp-name{opacity:.72}
.bp-node.n-claimed .bp-badge{background:#7fe6b4}
.bp-node.can-equip{cursor:pointer;font:inherit;color:inherit}
.bp-node.can-equip:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
/* premium-locked: the tier is reached but the pass is not owned. The reward
   stays fully visible and gets a shimmer, because this node is the advert. */
.bp-node.n-premium-locked{overflow:hidden;background:linear-gradient(160deg,#efe2ff,#ffd9ec)}
.bp-node.n-premium-locked::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.55) 47%,transparent 62%);
  animation:bpShimmer 2.6s ease-in-out infinite}
.bp-node.n-premium-locked .bp-badge{background:#ffe08a}
@keyframes bpShimmer{0%,100%{transform:translateX(-75%)}50%{transform:translateX(75%)}}
/* Tier 25 premium is the season's headline prize. */
.bp-node.grand{background:linear-gradient(160deg,#fff2c9,#ffd3b6 55%,#ffb7c5);
  box-shadow:0 3px 0 var(--ink),0 0 0 3px rgba(255,224,138,.95),0 0 18px rgba(255,180,120,.55)}
.bp-node.grand .bp-glyph{font-size:26px}
.bp-node.grand .bp-name{font-weight:800}
.bp-foot{flex:none;padding:0 4px;text-align:center;font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:.04em;line-height:1.3;color:var(--ink-soft)}
/* The dialog takes focus when it opens; it should say so quietly rather than
   draw a ring around the whole card. */
.bp-card:focus{outline:none}
.bp-card:focus-visible{outline:3px solid #d4638f;outline-offset:3px}
#battlepass .mini-btn:focus-visible{outline:3px solid #d4638f;outline-offset:3px}

/* A phone in portrait: the tiers narrow down, and the labels narrow with
   them so the rows still line up. */
@media(max-width:430px){
  .bp-card{padding:12px 12px 14px;gap:9px}
  .bp-body,.bp-summary{gap:9px}
  .bp-tier{width:76px}
  .bp-tier.final{width:90px}
  .bp-node,.bp-lane-label{height:80px}
  .bp-glyph{font-size:18px}
  .bp-progress{gap:9px;padding:8px 10px}
  .bp-tier-badge{width:48px;height:48px}
  .bp-tier-badge b{font-size:19px}
  .bp-cta-text{font-size:12px}
  .bp-track-head{height:26px;padding-left:8px;padding-right:8px}
}
/* A phone held sideways: the card is over budget on height, so everything
   shrinks its decoration and the card scrolls inside itself if it must. */
@media(max-height:430px){
  .bp-card{width:calc(100vw - 14px);height:calc(100vh - 14px);max-height:none;
    padding:9px 11px 11px;gap:7px}
  .bp-head{align-items:center}
  .bp-head h2{font-size:18px}
  .bp-sub{font-size:9px;margin-top:2px}
  #bpClose{min-height:40px;padding:6px 12px 7px;font-size:11px}
  .bp-body{flex-direction:row;align-items:stretch;gap:10px}
  .bp-summary{flex:0 0 min(39%,260px);min-width:0;gap:7px;overflow-y:auto;padding:2px 4px 4px 2px}
  .bp-progress{flex-direction:column;align-items:stretch;gap:7px;padding:8px 9px}
  .bp-tier-badge{width:auto;height:36px;border-radius:11px;box-shadow:0 2px 0 var(--ink);
    flex-direction:row;gap:6px;line-height:1}
  .bp-tier-badge b{font-size:17px}
  .bp-tier-badge small{font-size:7px}
  .bp-progress-line{font-size:10px;line-height:1.3;text-align:center}
  .bp-xp-line{font-size:10px}
  .bp-xp-line small{font-size:8px}
  .bp-bar{height:11px}
  .bp-progress-note{font-size:8px;line-height:1.2}
  .bp-cta{align-items:stretch;padding:8px 9px;gap:7px}
  .bp-cta-text{font-size:11px}
  .bp-cta-text small{font-size:8px;line-height:1.25}
  .bp-cta .mini-btn{width:100%;min-height:40px;padding:6px 8px 7px;font-size:10px}
  .bp-foot{font-size:8px;padding:0 3px}
  .bp-ladder-wrap{min-width:0;border-radius:12px}
  .bp-track-head{height:25px;padding:4px 8px 3px;font-size:9px}
  .bp-track-head small{font-size:7px}
  .bp-ladder{flex:1 1 auto;min-height:0;align-items:flex-start;gap:7px;padding:6px 4px 9px}
  .bp-tier{width:78px}
  .bp-tier.final{width:92px}
  .bp-tier-num{height:22px;font-size:11px}
  .bp-lane-spacer{height:22px}
  .bp-node,.bp-lane-label{height:72px}
  .bp-node{padding:6px 5px 7px;border-radius:10px}
  .bp-glyph{font-size:17px}
  .bp-name{font-size:8px;max-height:3.54em}
  .bp-node.grand .bp-glyph{font-size:21px}
  .bp-lanes{gap:6px}
}

/* A narrow phone cannot support the locker's side-by-side case and shelf.
   Give it the same full-height sheet treatment, then stack the summary above
   a generously sized reward shelf. */
@media(max-height:430px) and (max-width:559px){
  .bp-body{flex-direction:column}
  .bp-summary{flex:none;display:grid;grid-template-columns:1fr 1fr;overflow:visible;padding:0}
  .bp-foot{grid-column:1/-1}
  .bp-progress,.bp-cta{min-width:0}
}

/* The screenshot-sized case: roughly 2.2:1 after device-pixel scaling. The
   store already drops secondary decoration on a phone this short; the pass
   follows suit so its actual actions and both reward lanes never require a
   vertical swipe. */
@media(max-height:330px) and (min-width:560px){
  .bp-card{padding-top:7px;padding-bottom:9px;gap:5px}
  .bp-head h2{font-size:17px}
  .bp-sub{font-size:8px}
  #bpClose{min-height:38px}
  .bp-body{gap:8px}
  .bp-summary{gap:6px;overflow:hidden;padding-bottom:2px}
  .bp-progress{flex-direction:row;align-items:center;gap:7px;padding:6px 7px}
  .bp-tier-badge{flex:none;width:40px;height:40px;border-radius:50%;flex-direction:column;gap:0}
  .bp-tier-badge b{font-size:15px}
  .bp-progress-note{display:none}
  .bp-cta{padding:6px 7px;gap:5px}
  .bp-cta-text small{display:none}
  .bp-cta .mini-btn{min-height:38px}
  .bp-foot{display:none}
  .bp-track-head{height:23px}
  .bp-ladder{padding-top:4px;padding-bottom:6px}
  .bp-tier{width:70px;gap:4px}
  .bp-tier.final{width:84px}
  .bp-tier-num,.bp-lane-spacer{height:20px}
  .bp-node,.bp-lane-label{height:58px}
  .bp-node{gap:2px;padding:4px;border-radius:9px}
  .bp-glyph{font-size:14px}
  .bp-name{font-size:7px;line-height:1.1;max-height:2.2em}
  .bp-node.grand .bp-glyph{font-size:18px}
}

/* .screen's wash is tuned for the title and match-over cards, where there is
   nothing behind it worth reading. A killcam you cannot see through is not a
   killcam, so pull it back to a vignette for as long as one is running. The
   death cam keeps the full wash — there the blur is ambience over your own
   corpse, not something you are being shown on purpose. */
#dead.killcam{background:radial-gradient(ellipse at 50% 38%,rgba(255,248,240,0),rgba(180,198,238,.2));
  backdrop-filter:none}

#dead .big{font-family:var(--disp);font-size:clamp(40px,8vw,84px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 28px rgba(74,63,92,.3)}
#dead .by{margin-top:8px;font-family:var(--disp);font-size:20px;font-weight:600;color:var(--ink)}
#dead .cd{margin-top:22px;font-family:var(--disp);font-size:58px;font-weight:800;color:#fff;
  text-shadow:0 4px 0 var(--ink)}

/* Quiet on purpose, and quiet in a specific direction: this is the one control
   on the screen you should not press by reflex. It sits under the respawn
   count so the eye reaches it last, and it is the only thing on the card that
   is pressable at all — everything above it is a label. */
#dead .report{margin-top:20px;pointer-events:auto;cursor:pointer;font-family:var(--disp);
  font-size:13px;font-weight:700;letter-spacing:.09em;color:var(--ink);padding:7px 16px 8px;
  border:2px solid var(--ink);border-radius:14px;background:rgba(255,255,255,.55);
  box-shadow:0 3px 0 var(--ink);opacity:.72;transition:opacity .15s}
#dead .report:hover:not(:disabled){opacity:1}
#dead .report:active:not(:disabled){transform:translateY(3px);box-shadow:none}
#dead .report .k{display:inline-block;margin-left:7px;padding:1px 5px 2px;border-radius:5px;
  border:1.5px solid var(--ink);font-size:10px;opacity:.8}
#dead .report:disabled{cursor:default;opacity:.9;box-shadow:none;transform:translateY(3px);
  background:rgba(214,240,226,.85)}
/* No report target, so no button: solo, bots, and a world death all land here.
   Hidden rather than disabled — a control for something that cannot happen is
   noise, not information. */
#dead .report.off{display:none}
/* The key hint is a lie on a phone, where there is no keyboard and the tap
   works on its own. */
body.touch #dead .report .k{display:none}

#over .big{font-family:var(--disp);font-size:clamp(40px,9vw,96px);font-weight:800;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 14px 30px rgba(74,63,92,.3);text-align:center}
#over .rank{margin-top:16px;font-family:var(--disp);font-size:22px;font-weight:700;color:var(--ink)}
/* #again carried these as inline styles while it was the only thing on the
   card. It has a neighbour now, so the row owns the spacing and the button
   owns a rule that :hover and :active can reach. */
.over-actions{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
#again{pointer-events:auto;cursor:pointer;font-family:var(--disp);font-size:22px;font-weight:800;
  letter-spacing:.08em;color:var(--ink);padding:13px 42px 15px;border:3px solid var(--ink);
  border-radius:20px;background:linear-gradient(180deg,#d9f7e6,#b8f2d8);box-shadow:0 6px 0 var(--ink)}
#again:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
#again:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
/* Never disabled, whoever is looking at it, which is the whole point of it. */
#overMenu{min-height:44px;font-size:13px;padding:11px 20px 12px}

#hint{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-family:var(--disp);
  font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:0;
  padding:7px 18px 8px;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);
  box-shadow:0 3px 0 var(--ink)}

#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:linear-gradient(180deg,#ffe9f0,#d8e8fb)}
/* The wordmark, in the one place it now appears. Same treatment the title
   card gave it, sized for a screen that holds nothing else. */
#loading .lmark{font-family:var(--disp);font-size:clamp(38px,9vw,84px);font-weight:800;line-height:.86;
  letter-spacing:.01em;text-align:center;color:#fff;
  text-shadow:0 5px 0 var(--ink),0 7px 0 rgba(74,63,92,.35),0 16px 34px rgba(74,63,92,.3)}
#loading .lmark em{display:block;font-style:normal;
  background:linear-gradient(180deg,#ffd9e6,#ffb7c5 45%,#f79ec0);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 var(--ink))}
#loading .lt{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:.2em;color:var(--ink)}
#loading .bar{width:230px;height:14px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
#loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd3b6,#ffb7c5,#d4c5f9)}
#loading.off{display:none}
#fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;max-width:70vw;
  padding:18px 22px;font-family:var(--ui);font-size:14px;line-height:1.5;display:none;white-space:pre-wrap}
/* A dead end with an error on it is still a dead end. */
#fatal .mini-btn{display:block;margin:14px auto 0}

/* =====================================================================
   TOUCH CONTROLS
   Everything below is inert until 78-touch.js puts `touch` on <body>, so
   a desktop build renders exactly as it did before. Sits at z-index 20:
   above the HUD (10) so buttons are tappable, below the title / death /
